/* ── Rotation: 交代記録から再現した出場時間 ── */
let rotation = null;               // { a, h, periods, end, now, plays, abbr }
const rotOpts = { team: 'a', color: 'team' };
let rotCursor = null, rotSel = null;

// 区間 [t0, t1) にコートにいた選手と、その間の出場秒数（Flow の内訳カード用）
function rtOnCourt(side, t0, t1) {
    const R = rotation?.[side];
    if (!R) return null;
    return R.map(r => ({ name: r.name, sec: r.stints.reduce((s, x) => s + Math.max(0, Math.min(x.t1, t1) - Math.max(x.t0, t0)), 0) }))
        .filter(r => r.sec > 0).sort((x, y) => y.sec - x.sec);
}

const rtSigned = v => v > 0 ? `+${v}` : `${v}`;
const rtCls = v => v > 0 ? 'rt-pos' : v < 0 ? 'rt-neg' : '';
const rtPmColor = pm => {
    if (pm === 0) return 'rgba(139,139,149,.55)';
    const a = Math.min(1, 0.35 + Math.abs(pm) / 12);
    return pm > 0 ? `rgba(61,220,132,${a})` : `rgba(255,107,97,${a})`;
};

function rotationPanelHTML() {
    const A = rotation.abbr;
    return `<div class="rt-controls">
            <div class="fl-seg" id="rt-team">${['a', 'h'].map(s => `<button data-t="${s}" class="${s === rotOpts.team ? 'active' : ''}">${A[s]}</button>`).join('')}</div>
            <div><span class="rt-seg-label">Bar color</span><div class="fl-seg" id="rt-color">
                <button data-c="team" class="${rotOpts.color === 'team' ? 'active' : ''}">On court</button>
                <button data-c="pm" class="${rotOpts.color === 'pm' ? 'active' : ''}">+/-</button>
            </div></div>
        </div>
        <div class="fl-legend" id="rt-legend"></div>
        <div class="rt-info" id="rt-info"></div>
        <div class="rt-grid" id="rt-grid"></div>
        <div class="rt-hint">MIN・+/- はボックススコアの値。バーの +/- は交代記録から再現した目安で、記録の順序により数点ずれることがあります。</div>
        <div id="rt-lineups"></div>`;
}

function bindRotationControls() {
    document.querySelectorAll('#rt-team button').forEach(b => b.addEventListener('click', () => {
        rotOpts.team = b.dataset.t; rotSel = null;
        document.querySelectorAll('#rt-team button').forEach(x => x.classList.toggle('active', x === b));
        renderRotation();
    }));
    document.querySelectorAll('#rt-color button').forEach(b => b.addEventListener('click', () => {
        rotOpts.color = b.dataset.c;
        document.querySelectorAll('#rt-color button').forEach(x => x.classList.toggle('active', x === b));
        renderRotation();
    }));
    document.getElementById('rt-grid')?.addEventListener('click', e => {
        const bar = e.target.closest('.rt-bar');
        if (bar) { rotSel = rotSel === bar.dataset.bar ? null : bar.dataset.bar; rotCursor = null; renderRotation(); return; }
        const track = e.target.closest('.rt-track');
        if (!track) return;
        const r = track.getBoundingClientRect();
        rotCursor = Math.max(0, Math.min(rotation.now, (e.clientX - r.left) / r.width * rotation.end));
        rotSel = null; renderRotation();
    });
}

// 点差の帯（選んだチームのリードが上）
function rtMarginSVG(team) {
    const { plays, end, now } = rotation;
    const pts = [[0, 0], ...plays.map(x => [x.t, team === 'a' ? x.as - x.hs : x.hs - x.as])];
    pts.push([now, pts.at(-1)[1]]);
    const m = Math.max(5, ...pts.map(p => Math.abs(p[1])));
    const X = t => t / end * 1000, Y = v => 23 - 21 * v / m;
    const d = pts.map((p, i) => i === 0 ? `M${X(p[0])},${Y(p[1])}` : `H${X(p[0])}V${Y(p[1])}`).join('');
    const area = d + `H${X(now)}V23H0Z`;
    const c = FL_HEX[team], o = FL_HEX[flOther(team)];
    return `<svg viewBox="0 0 1000 46" preserveAspectRatio="none">
        <clipPath id="rt-mu"><rect x="0" y="0" width="1000" height="23"/></clipPath><clipPath id="rt-md"><rect x="0" y="23" width="1000" height="23"/></clipPath>
        <path d="${area}" fill="${c}" opacity=".45" clip-path="url(#rt-mu)"/><path d="${area}" fill="${o}" opacity=".45" clip-path="url(#rt-md)"/>
        <line x1="0" x2="1000" y1="23" y2="23" stroke="#55555f" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <path d="${d}" fill="none" stroke="#f2f2f4" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    </svg>`;
}

function renderRotation() {
    const grid = document.getElementById('rt-grid');
    if (!grid || !rotation) return;
    const team = rotOpts.team, R = rotation[team], A = rotation.abbr, { end, periods } = rotation;
    const played = R.filter(r => r.stints.length);
    const starters = played.filter(r => r.starter);
    const bench = played.filter(r => !r.starter).sort((a, b) => b.sec - a.sec);
    const dnp = R.filter(r => !r.stints.length);
    const onNow = new Set(rotCursor == null ? [] : R.filter(r => r.stints.some(s => rotCursor >= s.t0 && rotCursor < s.t1)).map(r => r.id));
    // 延長があれば列（区切り線）も増やす
    const qLines = Array.from({ length: periods - 1 }, (_, k) => 100 * flPeriodStart(k + 2) / end);
    const qBg = qLines.map(p => `linear-gradient(to right, transparent calc(${p}% - 1px), #33333b calc(${p}% - 1px), #33333b ${p}%, transparent ${p}%)`).join(',');
    const qLabels = Array.from({ length: periods }, (_, k) => {
        const p = k + 1;
        return `<span style="left:${100 * (flPeriodStart(p) + flPeriodLen(p) / 2) / end}%">${flPLabel(p)}</span>`;
    }).join('');

    const bar = (r, s, k) => {
        const left = 100 * s.t0 / end, w = 100 * (s.t1 - s.t0) / end;
        const bg = rotOpts.color === 'pm' ? rtPmColor(s.pm) : FL_HEX[team];
        const label = rotOpts.color === 'pm' && w > 4.5 ? rtSigned(s.pm) : '';
        const key = `${r.id}:${k}`;
        return `<div class="rt-bar ${rotSel === key ? 'sel' : ''}" data-bar="${key}" style="left:${left}%;width:${w}%;background:${bg}">${label}</div>`;
    };
    const row = r => {
        const pm = parseInt(r.pm);
        return `<div class="rt-row ${onNow.has(r.id) ? 'hl' : ''} ${r.stints.length ? '' : 'dnp'}">
            <div class="rt-name">${flEsc(r.name)}${r.mismatch ? '<span class="rt-warn" title="交代記録とボックススコアの出場時間がずれています">⚠</span>' : ''}</div>
            <div class="rt-track" style="background-image:${qBg}">${r.stints.map((s, k) => bar(r, s, k)).join('')}</div>
            <div class="rt-stat"><span>${r.min || '-'}</span><span class="${rtCls(pm)}">${isNaN(pm) ? '-' : rtSigned(pm)}</span></div>
        </div>`;
    };
    const sep = label => `<div class="rt-row sep"><div class="rt-name">${label}</div><div></div><div></div></div>`;
    grid.innerHTML = `
        <div class="rt-row head"><div class="rt-name"></div><div class="rt-qlabels">${qLabels}</div><div class="rt-stat"><span>MIN</span><span>+/-</span></div></div>
        <div class="rt-row"><div class="rt-name rt-lead">${A[team]} lead ▲</div><div class="rt-track rt-margin" style="background-image:${qBg}">${rtMarginSVG(team)}</div><div></div></div>
        ${sep('Starters')}${starters.map(row).join('')}
        ${sep('Bench')}${bench.map(row).join('')}
        ${dnp.length ? sep('DNP') + dnp.map(row).join('') : ''}
        <div class="rt-cursor" id="rt-cursor"></div>`;

    document.getElementById('rt-legend').innerHTML = rotOpts.color === 'pm'
        ? `<span><i style="background:rgba(61,220,132,.9)"></i>出場中にリードを広げた</span><span><i style="background:rgba(255,107,97,.9)"></i>縮められた</span><span><i style="background:rgba(139,139,149,.55)"></i>±0</span>`
        : `<span><i style="background:${FL_HEX[team]}"></i>コートにいた時間</span>`;

    // 選んだ時点／出場区間の情報
    const info = document.getElementById('rt-info');
    if (rotSel) {
        const [id, k] = rotSel.split(':');
        const r = R.find(x => x.id === id), s = r?.stints[+k];
        info.innerHTML = s ? `<b>${flEsc(r.name)}</b> ${flAtR(s.t0)} → ${flAtR(s.t1)}（${flDur(s.t1 - s.t0)}）<br>出場中 <b>${s.pf}-${s.pa}</b> <span class="${rtCls(s.pm)}">${rtSigned(s.pm)}</span>` : '';
    } else if (rotCursor != null) {
        const last = [...rotation.plays].reverse().find(x => x.t <= rotCursor);
        const names = R.filter(r => onNow.has(r.id)).map(r => flEsc(r.name)).join('・');
        info.innerHTML = `<b>${flAtR(rotCursor)}</b>　${A.a} ${last?.as ?? 0}-${last?.hs ?? 0} ${A.h}<br>On court: ${names || '—'}`;
    } else {
        info.innerHTML = '<span class="rt-muted">グラフをタップすると、その時点でコートにいた5人を表示します。バーをタップすると、その出場区間の得失点を表示します</span>';
    }
    rtPlaceCursor();
    const lu = document.getElementById('rt-lineups');
    if (lu) lu.innerHTML = lineupsHTML(team);
}

// Flow と同じ書式（Q3 10:42）。Flow を開いていない試合でも使えるよう rotation の期数で数える
function flAtR(t) {
    let p = 1;
    while (p < rotation.periods && t >= flPeriodStart(p + 1)) p++;
    const rem = flPeriodStart(p) + flPeriodLen(p) - t;
    return `${flPLabel(p)} ${rem >= 60 ? flDur(rem) : rem.toFixed(1)}`;
}

function rtPlaceCursor() {
    const c = document.getElementById('rt-cursor'), track = document.querySelector('#rt-grid .rt-track');
    if (!c || !track || rotCursor == null) return;
    const g = document.getElementById('rt-grid').getBoundingClientRect(), tr = track.getBoundingClientRect();
    c.style.left = `${tr.left - g.left + tr.width * rotCursor / rotation.end}px`;
    c.style.display = 'block';
}
window.addEventListener('resize', rtPlaceCursor);

/* ═══════════════════════════════════════════════
   試合ページ: games/game.html?id=<ESPNの試合ID>&tab=<box|team|flow|rotation|preview>
   ═══════════════════════════════════════════════ */
const GAME_ID = NBA.url.get('id');
const TAB_LABELS = { preview: 'Preview', box: 'Box Score', team: 'Team Stats', impact: 'Impact', shots: 'Shots', flow: 'Flow', rotation: 'Rotation' };
let activeTab = NBA.url.get('tab');
let boxSide = NBA.url.get('side') === 'home' ? 'h' : 'a';   // Box Score で表示中のチーム
let game = null;   // { data, event, away, home, isOver, isLive, isPre }

// summary のヘッダーを scoreboard の event と同じ形にそろえる（Flow / Rotation の関数がそのまま使える）
function eventFromSummary(data) {
    const comp = data.header.competitions[0];
    return {
        id: data.header.id || comp.id, date: comp.date, status: comp.status, links: data.header.links,
        competitions: [{
            ...comp,
            competitors: comp.competitors.map(c => ({
                ...c,
                team: { ...c.team, logo: c.team.logos?.[0]?.href || '' },
                linescores: (c.linescores || []).map(l => ({ value: l.value ?? l.displayValue })),
            })),
        }],
    };
}

const fmtJst = (iso, opts) => new Date(iso).toLocaleString('en-US', { timeZone: 'Asia/Tokyo', ...opts });

function headerHTML() {
    const { event, away, home, isOver, isLive, isPre } = game;
    const st = event.status;
    const statusText = isOver ? 'FINAL'
        : isLive ? `● LIVE  Q${st.period}  ${st.displayClock}`
        : `${fmtJst(event.date, { month: 'numeric', day: 'numeric', weekday: 'short' })}  ${fmtJst(event.date, { hour: '2-digit', minute: '2-digit' })} JST`;
    const abbr = t => normAbbr(t.team.abbreviation) || t.team.displayName;
    const awayNum = parseInt(away.score), homeNum = parseInt(home.score);
    const rec = t => t.record?.find(r => r.type === 'total')?.summary || '';

    // クォーター別スコア（OTがあれば列が増える）
    const periods = Math.max(away.linescores?.length || 0, home.linescores?.length || 0);
    const pLabel = i => i < 4 ? `Q${i + 1}` : (i === 4 ? 'OT' : `OT${i - 3}`);
    const lineRow = t => `<tr><td class="box-name">${abbr(t)}</td>
        ${Array.from({ length: periods }, (_, i) => `<td>${t.linescores?.[i]?.value ?? '-'}</td>`).join('')}
        <td class="box-pts">${t.score ?? '-'}</td></tr>`;
    const lineHTML = periods ? `<div class="box-table-wrap"><table class="box-table box-line">
        <thead><tr><th class="box-name"></th>${Array.from({ length: periods }, (_, i) => `<th>${pLabel(i)}</th>`).join('')}<th>T</th></tr></thead>
        <tbody>${lineRow(away)}${lineRow(home)}</tbody>
    </table></div>` : '';

    // チーム名はチームページへ
    const teamHead = (t, won) => `<a class="box-team ${won ? 'winner' : ''}" href="${NBA.link.team(abbr(t))}">
        <img src="${t.team.logo || ''}" alt="${abbr(t)}">
        <div class="box-team-abbr">${abbr(t)}</div>
        ${rec(t) ? `<div class="box-team-rec">${rec(t)}</div>` : ''}
    </a>`;
    const espnUrl = espnLink(event.links, 'summary') || NBA.link.espnGame(event.id);

    return `
        <div class="status ${isOver ? 'status-final' : isLive ? 'status-live' : 'status-pre'}">${statusText}</div>
        <div class="box-scoreline">
            ${teamHead(away, isOver && awayNum > homeNum)}
            <div class="box-score">${isPre ? '<span>@</span>' : `${away.score ?? '-'}<span>-</span>${home.score ?? '-'}`}</div>
            ${teamHead(home, isOver && homeNum > awayNum)}
        </div>
        <div class="game-sub"><a href="${espnUrl}" target="_blank" rel="noopener">ESPN ↗</a></div>
        ${lineHTML}`;
}

/* ── 怪我人（summary の injuries。チームごと） ── */
const INJ_STATUS = {
    'Out':          { cls: 'inj-out', label: 'OUT' },
    'Doubtful':     { cls: 'inj-d',   label: 'DOUBT' },
    'Questionable': { cls: 'inj-q',   label: 'GTD' },
    'Day-To-Day':   { cls: 'inj-dtd', label: 'D2D' },
};
const INJ_ORDER = { 'Out': 0, 'Doubtful': 1, 'Questionable': 2, 'Day-To-Day': 3 };

function injuriesHTML(teamId, title = 'Injury Report') {
    const list = (game.data.injuries || []).find(t => String(t.team?.id) === String(teamId))?.injuries || [];
    const rows = [...list].sort((a, b) => (INJ_ORDER[a.status] ?? 9) - (INJ_ORDER[b.status] ?? 9)).map(inj => {
        const ath = inj.athlete || {}, d = inj.details || {};
        const side = (d.side || '').replace('Not Specified', '').trim();
        const reason = [side, d.type || d.detail].filter(Boolean).join(' ');
        const ret = d.returnDate, thisYear = String(new Date().getFullYear());
        const back = ret ? `復帰見込み ${ret.slice(0, 4) === thisYear ? '' : ret.slice(0, 4) + '/'}${+ret.slice(5, 7)}/${+ret.slice(8, 10)}` : '';
        const cfg = INJ_STATUS[inj.status] || { cls: 'inj-out', label: String(inj.status || 'OUT').toUpperCase() };
        const name = ath.id ? `<a class="inj-name" href="${NBA.link.player(ath.id)}">${esc(ath.displayName || '?')}</a>` : `<span class="inj-name">${esc(ath.displayName || '?')}</span>`;
        return `<div class="inj-row"><div>${name}<span class="inj-sub">${esc([reason, back].filter(Boolean).join('・'))}</span></div>
            <span class="inj-status ${cfg.cls}">${cfg.label}</span></div>`;
    }).join('');
    return `<div class="inj-block"><div class="ts-group">${title}</div>${rows ? `<div class="inj-list">${rows}</div>` : '<div class="inj-none">No injuries reported</div>'}</div>`;
}

/* ── Box Score（チームを切り替えて1チームずつ。Full は公式記録、Q1〜 は play-by-play から集計） ── */
let boxPeriod = parseInt(NBA.url.get('q')) || 0;   // 0 = Full

function boxPanelHTML() {
    const { away, home } = game;
    const A = { a: normAbbr(away.team.abbreviation), h: normAbbr(home.team.abbreviation) };
    const periods = Math.max(...[away, home].map(t => t.linescores?.length || 0), 0);
    if (boxPeriod > periods) boxPeriod = 0;
    const pBtns = [0, ...Array.from({ length: periods }, (_, i) => i + 1)]
        .map(p => `<button data-p="${p}" class="${p === boxPeriod ? 'active' : ''}">${p ? flPLabel(p) : 'Full'}</button>`).join('');
    return `<div class="box-controls">
            <div class="fl-seg" id="box-side">${['a', 'h'].map(s => `<button data-s="${s}" class="${s === boxSide ? 'active' : ''}">${A[s]}</button>`).join('')}</div>
            ${periods && game.data.plays?.length ? `<div class="fl-seg" id="box-period">${pBtns}</div>` : ''}
        </div>
        <div id="box-table"></div>`;
}

function renderBox() {
    const el = document.getElementById('box-table');
    if (!el) return;
    const teams = game.data.boxscore?.players || [];
    const team = boxSide === 'a' ? game.away : game.home;
    const td = teams.find(t => t.team?.id === team.team.id);
    let table;
    if (!td) table = '<div class="msg">No stats available</div>';
    else if (boxPeriod) table = boxPeriodTable(td, boxPeriod);
    else table = boxTeamTable(td, sumBoxLines(teams.map(teamBoxTotals)));
    el.innerHTML = table + assistsHTML(team.team.id) + injuriesHTML(team.team.id);
}

function bindBoxControls() {
    document.querySelectorAll('#box-side button').forEach(b => b.addEventListener('click', () => {
        boxSide = b.dataset.s;
        document.querySelectorAll('#box-side button').forEach(x => x.classList.toggle('active', x === b));
        NBA.url.set({ side: boxSide === 'h' ? 'home' : null });
        renderBox();
    }));
    document.querySelectorAll('#box-period button').forEach(b => b.addEventListener('click', () => {
        boxPeriod = +b.dataset.p;
        document.querySelectorAll('#box-period button').forEach(x => x.classList.toggle('active', x === b));
        NBA.url.set({ q: boxPeriod || null });
        renderBox();
    }));
}

/* ── クォーター別スタッツ（play-by-play から集計） ──
   ・シュート: 1人目が打った選手。成功なら2人目がアシスト、失敗なら2人目がブロック
   ・ターンオーバー: 1人目がミスした選手、2人目がスティール
   ・終了間際のハーフコート付近からのシュート（Heave）は公式記録の FGA に入らないので数えない
   ・Offensive Charge は Offensive Foul Turnover と対になるので、ファウルとしてだけ数える
   ・Kicked Ball は守備側の反則なのでターンオーバーではない
   ・MIN と +/- は Rotation と同じ交代記録からの再現 */
const Q_KEYS = ['pts', 'fgm', 'fga', 'tpm', 'tpa', 'ftm', 'fta', 'oreb', 'dreb', 'ast', 'stl', 'blk', 'to', 'pf'];
const Q_TO_RE = /Turnover|Traveling|Double Dribble|Discontinued Dribble|Palming|Basket from Below/;
const Q_PF_RE = /Foul|Offensive Charge/;
const Q_NOT_PF_RE = /Technical|Turnover|Defensive 3-Seconds/;
let periodStatsCache = null;   // { data, stats }

// → { 選手ID: { クォーター: { pts, fgm, ... } } }
function buildPeriodStats(data) {
    if (periodStatsCache?.data === data) return periodStatsCache.stats;
    const S = {};
    const add = (id, p, k, v = 1) => {
        const line = ((S[id] ||= {})[p] ||= {});
        line[k] = (line[k] || 0) + v;
    };
    (data.plays || []).forEach(x => {
        const ids = (x.participants || []).map(q => q.athlete?.id).filter(Boolean);
        if (!ids.length) return;
        const t = (x.type?.text || '').replace(/\n/g, ' ');
        const p = x.period?.number || 1, a = ids[0];
        const ft = t.startsWith('Free Throw');
        if (ft) {
            add(a, p, 'fta');
            if (x.scoringPlay) { add(a, p, 'ftm'); add(a, p, 'pts', x.scoreValue || 1); }
        } else if (x.shootingPlay && !/Heave/.test(t)) {
            const three = x.pointsAttempted === 3;
            add(a, p, 'fga');
            if (three) add(a, p, 'tpa');
            if (x.scoringPlay) {
                add(a, p, 'fgm'); add(a, p, 'pts', x.scoreValue || 0);
                if (three) add(a, p, 'tpm');
                if (ids[1]) add(ids[1], p, 'ast');
            } else if (ids[1]) add(ids[1], p, 'blk');
        } else if (t === 'Offensive Rebound') add(a, p, 'oreb');
        else if (t === 'Defensive Rebound') add(a, p, 'dreb');
        else if (Q_TO_RE.test(t)) {
            add(a, p, 'to');
            if (ids[1]) add(ids[1], p, 'stl');
        }
        if (!ft && Q_PF_RE.test(t) && !Q_NOT_PF_RE.test(t)) add(a, p, 'pf');
    });
    periodStatsCache = { data, stats: S };
    return S;
}

// その選手のそのクォーターの出場秒数と +/-（Rotation の再現データ。無ければ null）
function periodMinutes(side, id, p) {
    const r = rotation?.[side]?.find(x => x.id === id);
    if (!r) return null;
    const p0 = flPeriodStart(p), p1 = p0 + flPeriodLen(p);
    const st = r.stints.filter(x => x.t0 >= p0 && x.t0 < p1);
    return { sec: st.reduce((s, x) => s + x.t1 - x.t0, 0), pm: st.reduce((s, x) => s + x.pm, 0), mismatch: r.mismatch };
}

function boxPeriodTable(teamData, period) {
    const sg = teamData.statistics?.[0];
    if (!sg?.athletes?.length) return '<div class="msg">No stats available</div>';
    const S = buildPeriodStats(game.data);
    const side = teamData.team?.id === game.away.team.id ? 'a' : 'h';
    const oppSide = side === 'a' ? 'h' : 'a';
    const blank = () => Object.fromEntries(Q_KEYS.map(k => [k, 0]));
    const lineOf = (id, p) => ({ ...blank(), ...(S[id]?.[p] || {}) });

    // 追加指標用: このクォーターの自チーム・両チームの合計（出場時間は分）
    const linesFor = (td, sd) => (td?.statistics?.[0]?.athletes || []).map(a => {
        const id = a.athlete?.id, m = periodMinutes(sd, id, period);
        return { ...lineOf(id, period), min: (m?.sec || 0) / 60 };
    });
    const oppData = game.data.boxscore.players.find(t => t.team?.id !== teamData.team?.id);
    const tmTot = sumBoxLines(linesFor(teamData, side));
    const gameTot = sumBoxLines([tmTot, sumBoxLines(linesFor(oppData, oppSide))]);

    const periods = Math.max(...[game.away, game.home].map(t => t.linescores?.length || 0));
    const nCols = BOX_COLS.length + ADV_COLS.length;
    const row = a => {
        const id = a.athlete?.id;
        const pos = a.athlete?.position?.abbreviation || '';
        const jersey = a.athlete?.jersey || '';
        const name = a.athlete?.shortName || a.athlete?.displayName || '—';
        const l = lineOf(id, period), m = periodMinutes(side, id, period);
        // 全クォーターの合計が公式記録と合わない項目（記録の訂正などで起こる）
        const official = parseBoxLine(sg, a);
        const sums = blank();
        for (let p = 1; p <= periods; p++) Q_KEYS.forEach(k => { sums[k] += lineOf(id, p)[k]; });
        const off = official ? Q_KEYS.filter(k => sums[k] !== official[k]) : [];
        const warn = [...off.map(k => k.toUpperCase()), ...(m?.mismatch ? ['MIN'] : [])];
        const url = id ? NBA.link.player(id) : '';
        const nameCell = `<td class="box-name">${url ? `<a class="box-player-link" href="${url}">${name}</a>` : name}
            ${jersey ? `<span class="box-pos">#${jersey}</span>` : ''}
            ${pos ? `<span class="box-pos">${pos}</span>` : ''}
            ${warn.length ? `<span class="rt-warn" title="全クォーターの合計が公式記録と合わない項目: ${warn.join(', ')}">⚠</span>` : ''}</td>`;
        const played = (m?.sec || 0) > 0 || Q_KEYS.some(k => l[k]);
        if (!played) return `<tr class="box-dnp">${nameCell}<td colspan="${nCols}">—</td></tr>`;
        const pm = m ? (m.pm > 0 ? `+${m.pm}` : String(m.pm)) : '-';
        const cells = {
            MIN: m ? flDur(m.sec) : '-', PTS: l.pts, REB: l.oreb + l.dreb, OREB: l.oreb, DREB: l.dreb, AST: l.ast,
            FG: `${l.fgm}-${l.fga}`, '3PT': `${l.tpm}-${l.tpa}`, FT: `${l.ftm}-${l.fta}`,
            STL: l.stl, BLK: l.blk, TO: l.to, PF: l.pf, '+/-': pm,
        };
        const adv = advStats({ ...l, min: (m?.sec || 0) / 60 }, tmTot, gameTot).map(v => `<td>${v ?? '-'}</td>`).join('');
        return `<tr>${nameCell}${BOX_COLS.map(c => `<td class="${c[0] === 'PTS' ? 'box-pts' : ''}">${cells[c[0]]}</td>`).join('')}${adv}</tr>`;
    };

    const starters = sg.athletes.filter(a => a.starter);
    const bench    = sg.athletes.filter(a => !a.starter);
    const head = `<tr><th class="box-name">Player</th>${BOX_COLS.map(c => `<th>${c[0]}</th>`).join('')}${ADV_COLS.map(c => `<th class="box-adv">${c}</th>`).join('')}</tr>`;
    const sep  = label => `<tr class="box-sep"><td colspan="${nCols + 1}">${label}</td></tr>`;
    return `<div class="box-table-wrap"><table class="box-table">
        <thead>${head}</thead>
        <tbody>
            ${starters.length ? sep('Starters') + starters.map(row).join('') : ''}
            ${bench.length ? sep('Bench') + bench.map(row).join('') : ''}
            ${boxTotalRow(BOX_COLS.map(([k]) => ({
                MIN: flDur(5 * flPeriodLen(period)), PTS: tmTot.pts, REB: tmTot.oreb + tmTot.dreb, OREB: tmTot.oreb, DREB: tmTot.dreb,
                AST: tmTot.ast, FG: `${tmTot.fgm}-${tmTot.fga}`, '3PT': `${tmTot.tpm}-${tmTot.tpa}`, FT: `${tmTot.ftm}-${tmTot.fta}`,
                STL: tmTot.stl, BLK: tmTot.blk, TO: tmTot.to, PF: tmTot.pf, '+/-': boxMargin(teamData.team?.id, period),
            }[k])), tmTot, gameTot)}
        </tbody>
    </table></div>
    <div class="rt-hint">${flPLabel(period)} のスタッツは play-by-play から集計した値です。MIN・+/- は交代記録から再現した目安です。⚠ は全クォーターの合計が公式記録と合わない選手です（試合後の記録の訂正などで起こります）。</div>`;
}

/* ═══════════════════════════════════════════════
   分析: Impact（WPA・Clutch）/ Shots / Four Factors / ラインナップ / アシストの相関
   どれも1試合の summary だけで計算する（追加の取得なし）
   ═══════════════════════════════════════════════ */
// 選手ID → { side: 'a' | 'h', name }（ボックススコアから）
function anPlayers() {
    const side = { [game.away.team.id]: 'a', [game.home.team.id]: 'h' };
    const map = {};
    (game.data.boxscore?.players || []).forEach(t => (t.statistics?.[0]?.athletes || []).forEach(a => {
        if (a.athlete?.id) map[a.athlete.id] = { side: side[t.team?.id], name: a.athlete.shortName || a.athlete.displayName || '' };
    }));
    return map;
}
const anAbbr = () => ({ a: normAbbr(game.away.team.abbreviation), h: normAbbr(game.home.team.abbreviation) });
const anSigned = v => v > 0 ? `+${v.toFixed(1)}` : v.toFixed(1);
const anPlayerLink = (id, name) => id ? `<a class="ts-player" href="${NBA.link.player(id)}">${esc(name)}</a>` : esc(name);

/* ── WPA（Win Probability Added） ──
   プレーごとの勝率（ESPN）の変化を、そのプレーをした選手に配分して合計する（単位は勝率のポイント）。
   シュート・ターンオーバー・ファウルなどをした選手が 100%。
   アシスト・スティール・ブロックがあるプレーは、相手役と 50% ずつ分ける */
function computeWPA() {
    const wp = new Map((game.data.winprobability || []).map(w => [w.playId, w.homeWinPercentage]));
    if (!wp.size) return null;
    const P = anPlayers(), out = {};
    const add = (id, v) => { out[id] = (out[id] || 0) + v; };
    let prev = 0.5;
    (game.data.plays || []).forEach(x => {
        if (!wp.has(x.id)) return;
        const cur = wp.get(x.id), dh = cur - prev;
        prev = cur;
        const ids = (x.participants || []).map(q => q.athlete?.id).filter(id => id && P[id]);
        if (!ids.length || !dh) return;
        const own = id => (P[id].side === 'h' ? dh : -dh) * 100;
        const t = x.type?.text || '';
        const shared = ids[1] && (x.scoringPlay || /Turnover/.test(t) || (x.shootingPlay && !x.scoringPlay));
        if (shared) { add(ids[0], own(ids[0]) / 2); add(ids[1], own(ids[1]) / 2); }
        else add(ids[0], own(ids[0]));
    });
    return Object.entries(out).map(([id, v]) => ({ id, v, ...P[id] }));
}

/* ── Clutch: 第4Q・延長の残り5分以内で、プレー直前の点差が5点以内（NBA.com と同じ定義） ── */
function computeClutch() {
    const plays = game.data.plays || [];
    let prev = { awayScore: 0, homeScore: 0 };
    const cp = plays.filter(x => {
        const before = prev; prev = x;
        return (x.period?.number || 1) >= 4 && flClockSec(x.clock?.displayValue ?? '0') <= 300
            && Math.abs((before.homeScore ?? 0) - (before.awayScore ?? 0)) <= 5;
    });
    if (!cp.length) return null;
    const P = anPlayers();
    const i0 = plays.indexOf(cp[0]), start = i0 > 0 ? plays[i0 - 1] : { awayScore: 0, homeScore: 0 };
    const S = {};
    const add = (id, k, v = 1) => { if (!P[id]) return; (S[id] ||= { id, ...P[id], pts: 0, fgm: 0, fga: 0, tpm: 0, tpa: 0, ftm: 0, fta: 0, reb: 0, ast: 0, stl: 0, blk: 0, to: 0 })[k] += v; };
    cp.forEach(x => {
        const ids = (x.participants || []).map(q => q.athlete?.id).filter(Boolean);
        if (!ids.length) return;
        const t = (x.type?.text || '').replace(/\n/g, ' '), a = ids[0];
        if (t.startsWith('Free Throw')) { add(a, 'fta'); if (x.scoringPlay) { add(a, 'ftm'); add(a, 'pts', x.scoreValue || 1); } }
        else if (x.shootingPlay && !/Heave/.test(t)) {
            add(a, 'fga'); if (x.pointsAttempted === 3) add(a, 'tpa');
            if (x.scoringPlay) { add(a, 'fgm'); add(a, 'pts', x.scoreValue || 0); if (x.pointsAttempted === 3) add(a, 'tpm'); if (ids[1]) add(ids[1], 'ast'); }
            else if (ids[1]) add(ids[1], 'blk');
        } else if (/Rebound/.test(t)) add(a, 'reb');
        else if (Q_TO_RE.test(t)) { add(a, 'to'); if (ids[1]) add(ids[1], 'stl'); }
    });
    const last = plays.at(-1);
    return {
        start: `${flPLabel(cp[0].period.number)} ${cp[0].clock.displayValue}`,
        startScore: [start.awayScore ?? 0, start.homeScore ?? 0],
        pts: { a: (last.awayScore ?? 0) - (start.awayScore ?? 0), h: (last.homeScore ?? 0) - (start.homeScore ?? 0) },
        players: Object.values(S),
    };
}

function impactPanelHTML() {
    const A = anAbbr();
    const wpa = computeWPA();
    let html = '';
    if (wpa) {
        const max = Math.max(1, ...wpa.map(p => Math.abs(p.v)));
        const list = s => wpa.filter(p => p.side === s).sort((x, y) => y.v - x.v).slice(0, 8).map(p => {
            const w = Math.min(50, 50 * Math.abs(p.v) / max);
            return `<div class="an-row"><span class="an-name">${anPlayerLink(p.id, p.name)}</span>
                <div class="an-dbar" title="${anSigned(p.v)}"><span style="background:var(--ts-${s === 'a' ? 'away' : 'home'});${p.v >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`}"></span></div>
                <span class="an-val ${p.v > 0 ? 'rt-pos' : p.v < 0 ? 'rt-neg' : ''}">${anSigned(p.v)}</span></div>`;
        }).join('');
        html += `<div class="ts-group">Win Probability Added <small>勝利に何ポイント効いたか</small></div>
            <div class="an-two"><div><div class="an-team">${A.a}</div>${list('a')}</div><div><div class="an-team">${A.h}</div>${list('h')}</div></div>
            <div class="rt-hint">プレーごとの勝率（ESPN）の変化を、そのプレーをした選手に配分して合計した値です。アシスト・スティール・ブロックがあるプレーは、相手役と半分ずつ分けています。</div>`;
    } else {
        html += '<div class="msg">この試合は勝率のデータがありません</div>';
    }
    const c = computeClutch();
    html += `<div class="ts-group">Clutch <small>第4Q・延長の残り5分、点差5点以内</small></div>`;
    if (!c) return html + '<div class="inj-none">接戦の終盤（残り5分で5点差以内）はありませんでした</div>';
    const rows = c.players.filter(p => p.pts || p.fga || p.fta || p.reb || p.ast || p.stl || p.blk || p.to)
        .sort((x, y) => y.pts - x.pts || y.ast - x.ast);
    return html + `<div class="an-note">${c.start}（${A.a} ${c.startScore[0]}-${c.startScore[1]} ${A.h}）から終了まで: ${A.a} <b>${c.pts.a}</b> 点 / ${A.h} <b>${c.pts.h}</b> 点</div>
        <div class="box-table-wrap"><table class="box-table">
            <thead><tr><th class="box-name">Player</th><th>PTS</th><th>FG</th><th>3PT</th><th>FT</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th></tr></thead>
            <tbody>${rows.map(p => `<tr><td class="box-name"><span class="an-side ${p.side}">${A[p.side]}</span> ${anPlayerLink(p.id, p.name)}</td>
                <td class="box-pts">${p.pts}</td><td>${p.fgm}-${p.fga}</td><td>${p.tpm}-${p.tpa}</td><td>${p.ftm}-${p.fta}</td>
                <td>${p.reb}</td><td>${p.ast}</td><td>${p.stl}</td><td>${p.blk}</td><td>${p.to}</td></tr>`).join('')}</tbody>
        </table></div>`;
}

/* ── Four Factors（Team Stats の上部） ──
   ORtg のポゼッションは play-by-play から実際に数えた回数（assets/stats.js の countPossessions）。
   play-by-play がなければ推定式 FGA + 0.44×FTA − OREB + TO */
function fourFactorsHTML() {
    const teams = game.data.boxscore?.players || [];
    const tot = s => { const t = teams.find(x => x.team?.id === (s === 'a' ? game.away : game.home).team.id); return t ? teamBoxTotals(t) : null; };
    const A = tot('a'), H = tot('h');
    if (!A?.fga || !H?.fga) return '';
    const side = { [game.away.team.id]: 'a', [game.home.team.id]: 'h' };
    const counted = game.data.plays?.length ? countPossessions(game.data.plays, id => side[id]) : null;
    const est = m => m.fga + 0.44 * m.fta - m.oreb + m.to;
    const PA = counted ? counted.a : est(A), PH = counted ? counted.h : est(H);
    const f = (m, o, poss) => ({
        efg: 100 * (m.fgm + 0.5 * m.tpm) / m.fga, tov: 100 * m.to / (m.fga + 0.44 * m.fta + m.to),
        orb: 100 * m.oreb / ((m.oreb + o.dreb) || 1), ftr: 100 * m.ftm / m.fga, ortg: 100 * m.pts / poss,
    });
    const a = f(A, H, PA), h = f(H, A, PH);
    const row = (k, label, sub, lower, scale) => {
        const va = a[k], vh = h[k], la = lower ? va < vh : va > vh, lh = lower ? vh < va : vh > va;
        const w = v => Math.max(0, Math.min(100, v * scale));
        return `<div class="ts-row"><div class="ts-head">
            <span class="ts-val ${la ? 'lead' : ''}">${va.toFixed(1)}</span><span class="ts-lbl">${label}<small class="an-sub">${sub}</small></span>
            <span class="ts-val right ${lh ? 'lead' : ''}">${vh.toFixed(1)}</span>
        </div><div class="ts-rate"><div class="ts-track"><span class="ts-a" style="width:${w(va)}%"></span></div><div class="ts-track"><span class="ts-h" style="width:${w(vh)}%"></span></div></div></div>`;
    };
    return `<div class="ts-group">Four Factors <small>ポゼッション ${Math.round(PA)} / ${Math.round(PH)}${counted ? '' : '（推定）'}</small></div>
        ${row('efg', 'eFG%', 'シュートの質', false, 1.4)}${row('tov', 'TOV%', '100回の攻撃でのTO', true, 3)}
        ${row('orb', 'ORB%', '取れたOREBの割合', false, 2)}${row('ftr', 'FT Rate', 'FTM ÷ FGA', false, 2.5)}
        ${row('ortg', 'ORtg', '100ポゼッションの得点', false, 0.6)}`;
}

/* ── Shots: ゾーン別の成功率とシュートチャート
   座標はフィート。x は 0〜50（リングは 25）、y はリングの高さからの距離（ベースラインは約 −5.25） ── */
const AN_ZONES = [['rim', 'ゴール下'], ['paint', 'ペイント'], ['mid', 'ミドル'], ['corner3', 'コーナー3'], ['ab3', 'トップ3']];
function anZone(x) {
    const c = x.coordinate, dx = c.x - 25, dy = Math.max(0, c.y), dist = Math.hypot(dx, dy);
    // コーナー3: 3Pラインがまっすぐな部分（ベースラインから14フィート＝リングの高さから約9フィートまで）
    if (x.pointsAttempted === 3) return Math.abs(dx) >= 21 && dy <= 9 ? 'corner3' : 'ab3';
    if (dist <= 4) return 'rim';
    // ペイント: 幅16フィート、フリースローライン（ベースラインから19フィート＝リングの高さから約14フィート）まで
    if (Math.abs(dx) <= 8 && dy <= 13.75) return 'paint';
    return 'mid';
}
function shotsPanelHTML() {
    const A = anAbbr(), side = { [game.away.team.id]: 'a', [game.home.team.id]: 'h' };
    // ベースライン際のシュートは y がわずかにマイナスになる。ハーフコートからのブザービーターは公式記録と同じく除く
    const shots = (game.data.plays || []).filter(x => x.shootingPlay && !/Free Throw|Heave/.test(x.type?.text || '')
        && x.coordinate?.x >= 0 && x.coordinate?.y >= -3 && x.coordinate.y < 47 && side[x.team?.id]);
    if (!shots.length) return '<div class="msg">この試合はシュートの位置のデータがありません</div>';
    const Z = { a: {}, h: {} };
    shots.forEach(x => { const r = (Z[side[x.team.id]][anZone(x)] ||= { m: 0, a: 0 }); r.a++; if (x.scoringPlay) r.m++; });
    const court = s => {
        // ベースラインから38フィートまでを描く（遠い3Pも入るように）
        const k = 7, W = 50 * k, H = 38 * k, rimY = 5.25, X = x => x * k, Y = y => (y + rimY) * k;
        const ln = 'stroke="#3a3a44" stroke-width="1.5" fill="none"', c = `var(--ts-${s === 'a' ? 'away' : 'home'})`;
        const dots = shots.filter(x => side[x.team.id] === s).map(x => {
            const cx = X(x.coordinate.x), cy = Y(Math.max(0, x.coordinate.y));
            return x.scoringPlay ? `<circle cx="${cx}" cy="${cy}" r="4.5" fill="${c}"/>` : `<circle cx="${cx}" cy="${cy}" r="4" fill="none" stroke="${c}" stroke-width="1.5" opacity=".75"/>`;
        }).join('');
        return `<svg class="an-court" viewBox="0 0 ${W} ${H}" role="img" aria-label="${A[s]} のシュートの位置">
            <rect width="${W}" height="${H}" fill="var(--surface-deep)"/>
            <rect x="${X(17)}" y="0" width="${16 * k}" height="${Y(19 - rimY)}" ${ln}/>
            <path d="M ${X(3)} 0 L ${X(3)} ${Y(14 - rimY)} A ${23.75 * k} ${23.75 * k} 0 0 0 ${X(47)} ${Y(14 - rimY)} L ${X(47)} 0" ${ln}/>
            <circle cx="${X(25)}" cy="${Y(0)}" r="${0.75 * k}" stroke="#8b8b95" stroke-width="1.5" fill="none"/>
            <line x1="${X(22)}" x2="${X(28)}" y1="${Y(-1.25)}" y2="${Y(-1.25)}" stroke="#8b8b95" stroke-width="2"/>${dots}</svg>`;
    };
    const pct = r => r?.a ? `${(100 * r.m / r.a).toFixed(1)}%` : '-';
    return `<div class="an-two">
            <div><div class="an-team">${A.a}</div>${court('a')}</div>
            <div><div class="an-team">${A.h}</div>${court('h')}</div>
        </div>
        <div class="fl-legend" style="margin-top:8px"><span>● 成功</span><span>○ 失敗</span></div>
        <div class="box-table-wrap"><table class="box-table">
            <thead><tr><th class="box-name">Zone</th><th>${A.a}</th><th>%</th><th>${A.h}</th><th>%</th></tr></thead>
            <tbody>${AN_ZONES.map(([z, label]) => {
                const a = Z.a[z], h = Z.h[z];
                return `<tr><td class="box-name">${label}</td><td>${a ? `${a.m}/${a.a}` : '0/0'}</td><td class="box-pts">${pct(a)}</td><td>${h ? `${h.m}/${h.a}` : '0/0'}</td><td class="box-pts">${pct(h)}</td></tr>`;
            }).join('')}</tbody>
        </table></div>
        <div class="rt-hint">ゴール下 = リングから4フィート以内、ペイント = 制限区域、コーナー3 = サイドライン際の3P。ハーフコートからの最後のブザービーターは公式記録と同じく数えていません。位置が記録されていないシュートも数えていないため、公式の FGA より1〜2本少ないことがあります。</div>`;
}

/* ── ラインナップ（Rotation タブの下）: 5人がそろって出ていた時間と得失点 ── */
function lineupsHTML(side) {

            <tbody>${list.map(u => { const d = u.pf - u.pa;

                    <td class="${d > 0 ? 'rt-pos' : d < 0 ? 'rt-neg' : ''}">${d > 0 ? '+' : ''}${d}</td></tr>`; }).join('')}</tbody>
        </table></div>`;
}

/* ── アシストの相関（Box Score の下）: 誰のパスから誰が決めたか ── */
function assistsHTML(teamId) {
    const P = anPlayers(), pairs = {};
    (game.data.plays || []).forEach(x => {
        if (!x.scoringPlay || !x.shootingPlay || x.team?.id !== teamId) return;
        const ids = (x.participants || []).map(q => q.athlete?.id);
        if (!ids[1] || !P[ids[0]] || !P[ids[1]]) return;
        const p = (pairs[ids[1] + '>' + ids[0]] ||= { from: ids[1], to: ids[0], n: 0, pts: 0 });
        p.n++; p.pts += x.scoreValue || 0;
    });
    const list = Object.values(pairs).sort((x, y) => y.n - x.n || y.pts - x.pts).slice(0, 10);
    if (!list.length) return '';
    const max = list[0].n;
    return `<div class="ts-group">Assist Network <small>誰のパスから誰が決めたか</small></div>${list.map(p => `<div class="an-row an-ast">
        <span class="an-name">${anPlayerLink(p.from, P[p.from].name)} <span class="rt-muted">→</span> ${anPlayerLink(p.to, P[p.to].name)}</span>
        <div class="an-bar"><span style="width:${100 * p.n / max}%"></span></div>
        <span class="an-val">${p.n}<small> 回・${p.pts}点</small></span></div>`).join('')}`;
}

/* ── Preview（試合前）: 注目ポイント・予測・成績・チーム比較・直近の試合・対戦成績・リーダー・怪我人 ── */
function previewPanelHTML() {
    return '<div id="preview"><div class="msg">Loading<span class="spinner"></span></div></div>';
}

// チームのレギュラーシーズンの終わった試合（新しい順）と、この試合の直前の試合
async function teamRecent(teamId) {
    const d = await NBA.api.schedule(teamId, '?seasontype=2').catch(() => null);
    const tip = new Date(game.event.date).getTime();
    const games = (d?.events || []).map(ev => {
        const comp = ev.competitions?.[0];
        const me = comp?.competitors?.find(c => String(c.team?.id) === String(teamId));
        const op = comp?.competitors?.find(c => String(c.team?.id) !== String(teamId));
        if (!me || !op) return null;
        const sc = c => c.score?.value ?? parseFloat(c.score?.displayValue ?? c.score);
        return { id: ev.id, date: ev.date, done: !!comp.status?.type?.completed, atVs: me.homeAway === 'away' ? '@' : 'vs',
            opp: normAbbr(op.team?.abbreviation || ''), my: sc(me), their: sc(op) };
    }).filter(g => g && new Date(g.date).getTime() < tip);
    return { done: games.filter(g => g.done).reverse(), prev: games.at(-1) || null };
}

async function renderPreview() {
    const el = document.getElementById('preview');
    if (!el) return;
    const { data, away, home, event } = game;
    const side = { a: away, h: home };
    const ab = { a: normAbbr(away.team.abbreviation), h: normAbbr(home.team.abbreviation) };
    const [lg, recA, recH] = await Promise.all([
        NBA.teams.leagueStats().catch(() => null),
        teamRecent(away.team.id), teamRecent(home.team.id),
    ]);
    const recent = { a: recA, h: recH };
    const T = { a: lg?.teams.find(t => t.id === String(away.team.id)), h: lg?.teams.find(t => t.id === String(home.team.id)) };
    const rank = (k, s, lower) => lg ? NBA.teams.leagueRank(lg.teams, k, side[s].team.id, lower) : null;
    const rk = r => r ? `<span class="pv-rank ${r <= 5 ? 'top' : r >= 26 ? 'low' : ''}">#${r}</span>` : '';

    /* 比較する項目（lower: 小さい方が良い） */
    const CMP = [
        { key: 'ppg', label: 'PPG', fmt: v => v.toFixed(1) },
        { key: 'opp', label: 'OPP PPG', fmt: v => v.toFixed(1), lower: true },
        { key: 'diff', label: 'DIFF', fmt: v => (v > 0 ? '+' : '') + v.toFixed(1) },
        { key: 'rpg', label: 'RPG', fmt: v => v.toFixed(1) },
        { key: 'apg', label: 'APG', fmt: v => v.toFixed(1) },
        { key: 'tov', label: 'TOV', fmt: v => v.toFixed(1), lower: true },
        { key: 'fg', label: 'FG%', fmt: v => v.toFixed(1) },
        { key: 'tp', label: '3P%', fmt: v => v.toFixed(1) },
        { key: 'ft', label: 'FT%', fmt: v => v.toFixed(1) },
    ];

    /* 注目ポイント（データから自動で作る。多すぎないよう最大5つ） */
    const notes = [];
    const injuredOut = s => ((data.injuries || []).find(t => String(t.team?.id) === String(side[s].team.id))?.injuries || [])
        .filter(i => i.status === 'Out').map(i => i.athlete);
    const leadersOf = s => (data.leaders || []).find(t => String(t.team?.id) === String(side[s].team.id))?.leaders || [];
    // 1. 勝率予測
    const pr = data.predictor;
    const prob = { a: parseFloat(pr?.awayTeam?.gameProjection), h: parseFloat(pr?.homeTeam?.gameProjection) };
    if (!isNaN(prob.a) && !isNaN(prob.h)) {
        const fav = prob.a >= prob.h ? 'a' : 'h';
        if (prob[fav] >= 65) notes.push(`ESPN の予測では ${ab[fav]} が優勢（勝率 ${Math.round(prob[fav])}%）`);
        else if (prob[fav] <= 55) notes.push(`ESPN の予測はほぼ互角（${ab.a} ${Math.round(prob.a)}% - ${Math.round(prob.h)}% ${ab.h}）`);
    }
    // 2. 主力の欠場（チームリーダーが Out）
    ['a', 'h'].forEach(s => {
        const out = new Set(injuredOut(s).map(a => String(a?.id)));
        const hit = leadersOf(s).map(c => ({ c, l: c.leaders?.[0] })).filter(x => x.l && out.has(String(x.l.athlete?.id)));
        const names = [...new Set(hit.map(x => x.l.athlete.displayName))];
        if (names.length) notes.push(`${ab[s]} は ${names.join('・')}（チームの${hit.map(x => ({ Points: '得点', Rebounds: 'リバウンド', Assists: 'アシスト' }[x.c.displayName] || x.c.displayName)).filter((v, i, a) => a.indexOf(v) === i).join('・')}リーダー）が欠場`);
    });
    // 3. 連戦（前の試合から36時間以内）・連勝/連敗
    ['a', 'h'].forEach(s => {
        const prev = recent[s].prev;
        if (prev && new Date(event.date) - new Date(prev.date) < 36 * 3600e3) notes.push(`${ab[s]} は連戦の2日目（前日 ${prev.atVs} ${prev.opp}）`);
        const m = (T[s]?.streak || '').match(/^([WL])(\d+)/);
        if (m && +m[2] >= 3) notes.push(`${ab[s]} は${m[2]}${m[1] === 'W' ? '連勝' : '連敗'}中`);
    });
    // 4. 強みと弱みのかみ合い（得点上位5位以内 vs 失点下位5位以内）
    if (lg) ['a', 'h'].forEach(s => {
        const o = s === 'a' ? 'h' : 'a';
        const off = rank('ppg', s), def = rank('opp', o, true);
        if (off && def && off <= 5 && def >= 26) notes.push(`${ab[s]} の得点力（リーグ${off}位）vs ${ab[o]} の失点の多さ（${def}位）`);
        const t3 = rank('tp', s);
        if (t3 && t3 <= 3) notes.push(`${ab[s]} は3P成功率リーグ${t3}位（${T[s].tp.toFixed(1)}%）`);
    });
    // 5. 今季の対戦成績
    const ss = (data.seasonseries || [])[0];
    const played = (ss?.events || []).filter(e => e.statusType?.completed || e.status === 'post');
    if (played.length) notes.push(`今季の対戦は${played.length}試合（${ss.summary || ss.seriesScore}）`);
    const gpMin = Math.min(T.a?.gp ?? 99, T.h?.gp ?? 99);

    /* 勝率予測のバー */
    const predHTML = !isNaN(prob.a) && !isNaN(prob.h) ? `<div class="ts-group">Matchup Predictor <small>ESPN BPI</small></div>
        <div class="ts-row"><div class="ts-head">
            <span class="ts-val ${prob.a > prob.h ? 'lead' : ''}">${prob.a.toFixed(1)}%</span><span class="ts-lbl">Win Probability</span>
            <span class="ts-val right ${prob.h > prob.a ? 'lead' : ''}">${prob.h.toFixed(1)}%</span>
        </div><div class="ts-bar"><span class="ts-a" style="flex:${prob.a} 1 0"></span><span class="ts-h" style="flex:${prob.h} 1 0"></span></div></div>` : '';

    /* 成績（ホーム/アウェー・直近10試合・連勝） */
    const recRow = (label, va, vh) => `<div class="ts-row"><div class="ts-head"><span class="ts-val">${va || '-'}</span><span class="ts-lbl">${label}</span><span class="ts-val right">${vh || '-'}</span></div></div>`;
    const confRank = s => T[s]?.seed ? `${T[s].conf} #${T[s].seed}` : '';
    const recordHTML = `<div class="ts-group">Records</div>
        ${recRow('Record', T.a ? `${T.a.w}-${T.a.l}` : '', T.h ? `${T.h.w}-${T.h.l}` : '')}
        ${recRow('Conference', confRank('a'), confRank('h'))}
        ${recRow('Away / Home', T.a?.road, T.h?.home)}
        ${recRow('Last 10', T.a?.l10, T.h?.l10)}
        ${recRow('Streak', T.a?.streak, T.h?.streak)}`;

    /* チーム比較（リーグ順位付き） */
    const cmpHTML = lg ? `<div class="ts-group">Team Comparison <small>1試合平均・#はリーグ順位${gpMin < 5 ? '（開幕直後のため参考値）' : ''}</small></div>` + CMP.map(c => {
        const va = T.a?.[c.key], vh = T.h?.[c.key];
        if (va == null || vh == null) return '';
        const ra = rank(c.key, 'a', c.lower), rh = rank(c.key, 'h', c.lower);
        const leadA = c.lower ? va < vh : va > vh, leadH = c.lower ? vh < va : vh > va;
        // バーはリーグ順位を長さにする（1位が最長）
        const w = r => r ? Math.round(100 * (31 - r) / 30) : 0;
        return `<div class="ts-row"><div class="ts-head">
            <span class="ts-val ${leadA ? 'lead' : ''}">${c.fmt(va)} ${rk(ra)}</span><span class="ts-lbl">${c.label}</span>
            <span class="ts-val right ${leadH ? 'lead' : ''}">${rk(rh)} ${c.fmt(vh)}</span>
        </div><div class="ts-rate">
            <div class="ts-track"><span class="ts-a" style="width:${w(ra)}%"></span></div>
            <div class="ts-track"><span class="ts-h" style="width:${w(rh)}%"></span></div>
        </div></div>`;
    }).join('') : '';

    /* 直近の試合（レギュラーシーズン・新しい順に5試合） */
    const lastHTML = s => {
        const list = recent[s].done.slice(0, 5);
        return `<div class="pv-col"><div class="pv-col-head">${ab[s]}</div>${list.length ? list.map(g => {
            const win = g.my > g.their;
            return `<a class="pv-game" href="${NBA.link.game(g.id)}"><span class="pv-res ${win ? 'w' : 'l'}">${win ? 'W' : 'L'}</span>
                <span>${g.atVs} ${esc(g.opp)}</span><span class="pv-score">${g.my}-${g.their}</span>
                <span class="pv-date">${fmtJst(g.date, { month: 'numeric', day: 'numeric' })}</span></a>`;
        }).join('') : '<div class="inj-none">No games yet</div>'}</div>`;
    };

    /* 今季の対戦 */
    const seriesHTML = ss?.events?.length ? `<div class="ts-group">Season Series <small>${esc(ss.summary || ss.seriesScore || '')}</small></div>
        <div class="pv-series">${ss.events.map(e => {
            const cur = String(e.id) === String(event.id);
            const done = e.statusType?.completed;
            const score = done ? e.competitors.map(c => `${normAbbr(c.team?.abbreviation || '')} ${c.score}`).join(' - ') : (cur ? 'This game' : 'Scheduled');
            return `<a class="pv-game ${cur ? 'cur' : ''}" href="${NBA.link.game(e.id)}"><span class="pv-date">${fmtJst(e.date, { month: 'numeric', day: 'numeric' })}</span><span>${esc(score)}</span></a>`;
        }).join('')}</div>` : '';

    /* チームリーダー */
    const leaderHTML = s => `<div class="pv-col"><div class="pv-col-head">${ab[s]}</div>${leadersOf(s).map(c => {
        const l = c.leaders?.[0];
        if (!l) return '';
        return `<div class="pv-leader"><span class="pv-cat">${esc(c.displayName)}</span>
            <a class="inj-name" href="${NBA.link.player(l.athlete?.id)}">${esc(l.athlete?.displayName || '')}</a>
            <span class="pv-score">${esc(l.displayValue)}</span></div>`;
    }).join('') || '<div class="inj-none">-</div>'}</div>`;

    const venue = data.gameInfo?.venue;
    const tv = (data.broadcasts || []).map(b => b.media?.shortName || b.station).filter(Boolean);
    el.innerHTML = `
        ${notes.length ? `<div class="ts-group">Key Points</div><ul class="pv-notes">${notes.slice(0, 5).map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
        <div class="ts-legend"><span><i class="ts-sw a"></i>${ab.a}</span><span>${ab.h}<i class="ts-sw h"></i></span></div>
        ${predHTML}
        ${recordHTML}
        ${cmpHTML}
        <div class="ts-group">Last Games <small>レギュラーシーズン</small></div>
        <div class="pv-two">${lastHTML('a')}${lastHTML('h')}</div>
        ${seriesHTML}
        ${(data.leaders || []).length ? `<div class="ts-group">Team Leaders <small>1試合平均</small></div><div class="pv-two">${leaderHTML('a')}${leaderHTML('h')}</div>` : ''}
        <div class="pv-two">${injuriesHTML(away.team.id, `${ab.a} Injury Report`)}${injuriesHTML(home.team.id, `${ab.h} Injury Report`)}</div>
        ${venue ? `<div class="rt-hint">${esc(venue.fullName || '')}${venue.address?.city ? `（${esc(venue.address.city)}${venue.address.state ? ', ' + esc(venue.address.state) : ''}）` : ''}${tv.length ? `・${esc(tv.join(' / '))}` : ''}</div>` : ''}`;
}

/* ── タブ ── */
function availableTabs() {
    if (game.isPre) return ['preview'];
    return ['box', 'team', 'impact', 'shots', 'flow', 'rotation'];
}

function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.game-tabs .conf-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.game-panel').forEach(p => p.classList.toggle('active', p.dataset.tab === tab));
    NBA.url.set({ tab: tab === availableTabs()[0] ? null : tab });
    // Flow と Rotation は表示中の幅で描くため、タブを開いたときに描画する
    if (tab === 'flow') { flHideTip(); renderFlow(); }
    if (tab === 'rotation') renderRotation();
}

/* ── 描画 ── */
function setGame(data) {
    const event = eventFromSummary(data);
    const comp = event.competitions[0];
    const away = comp.competitors.find(c => c.homeAway === 'away') ?? comp.competitors[0];
    const home = comp.competitors.find(c => c.homeAway === 'home') ?? comp.competitors[1];
    const st = event.status.type;
    const isOver = !!st.completed || st.state === 'post';
    const isLive = !isOver && st.state === 'in';
    game = { data, event, away, home, isOver, isLive, isPre: !isOver && !isLive };

    document.title = `${normAbbr(away.team.abbreviation)} @ ${normAbbr(home.team.abbreviation)} — NBA Daily`;
}

function render() {
    const { data, away, home, isOver, isPre } = game;
    document.getElementById('game-head').innerHTML = headerHTML();
    const tabs = availableTabs();
    if (!tabs.includes(activeTab)) activeTab = tabs[0];

    if (!isPre) {
        flow = data.plays?.length ? buildFlow(data, away, home, isOver) : null;
        rotation = buildRotation(data, away, home, isOver);
    }
    const teamTotals = id => data.boxscore?.teams?.find(x => x.team?.id === id);
    const panels = {
        preview: () => previewPanelHTML(),
        box: () => boxPanelHTML(),
        team: () => boxTeamStats(teamTotals(away.team.id), teamTotals(home.team.id)),
        flow: () => flow ? flowPanelHTML() : '<div class="msg">No play-by-play data</div>',
        rotation: () => rotation ? rotationPanelHTML() : '<div class="msg">No substitution data</div>',
        impact: () => data.plays?.length ? impactPanelHTML() : '<div class="msg">No play-by-play data</div>',
        shots: () => data.plays?.length ? shotsPanelHTML() : '<div class="msg">No play-by-play data</div>',
    };
    document.getElementById('game-body').innerHTML = `
        <div class="conf-tabs game-tabs">
            ${tabs.map(t => `<button class="conf-btn" data-tab="${t}">${TAB_LABELS[t]}</button>`).join('')}
        </div>
        ${tabs.map(t => `<div class="game-panel" data-tab="${t}">${panels[t]()}</div>`).join('')}`;
    document.querySelectorAll('.game-tabs .conf-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
    if (tabs.includes('box')) { bindBoxControls(); renderBox(); }
    if (tabs.includes('preview')) renderPreview();
    if (flow) bindFlowControls();
    if (rotation) bindRotationControls();
    switchTab(activeTab);
}

/* ── 読み込みと試合中の更新 ── */
const LIVE_REFRESH_MS = NBA.api.MIN;   // スコア・ボックススコア
let liveTimer = null, lastGraphAt = 0;

async function load() {
    const head = document.getElementById('game-head');
    if (!GAME_ID) { head.innerHTML = '<div class="msg error">試合が指定されていません</div>'; return; }
    try {
        const data = await NBA.api.summary(GAME_ID);
        if (!data?.header?.competitions?.[0]) throw new Error('no data');
        setGame(data);
        render();
        lastGraphAt = Date.now();
        document.getElementById('last-updated').textContent =
            'Updated: ' + new Date().toLocaleTimeString('en-US', { timeZone: 'Asia/Tokyo' });
        if (game.isLive) liveTimer = setTimeout(refresh, LIVE_REFRESH_MS);
    } catch (e) {
        console.error(e);
        head.innerHTML = '<div class="msg error">Failed to load game</div>';
    }
}

// 試合中: 1分ごとにスコアとボックススコアを更新。Flow / Rotation は開いている内訳を閉じないよう5分ごと
async function refresh() {
    const data = await NBA.api.summary(GAME_ID).catch(() => null);
    if (data?.header?.competitions?.[0]) {
        const wasPre = game.isPre;
        setGame(data);
        const graphDue = Date.now() - lastGraphAt >= FL_REFRESH_MS || !game.isLive || wasPre;
        if (graphDue) { render(); lastGraphAt = Date.now(); }
        else {
            document.getElementById('game-head').innerHTML = headerHTML();
            // クォーター別の MIN・+/- に使うので、交代記録の再現だけは毎回作り直す
            rotation = buildRotation(data, game.away, game.home, game.isOver) || rotation;
            if (document.getElementById('box-table')) renderBox();
            const tp = document.querySelector('.game-panel[data-tab="team"]');
            const tt = id => data.boxscore?.teams?.find(x => x.team?.id === id);
            if (tp) tp.innerHTML = boxTeamStats(tt(game.away.team.id), tt(game.home.team.id));
        }
        document.getElementById('last-updated').textContent =
            'Updated: ' + new Date().toLocaleTimeString('en-US', { timeZone: 'Asia/Tokyo' });
    }
    if (game.isLive || game.isPre) liveTimer = setTimeout(refresh, game.isPre ? 5 * NBA.api.MIN : LIVE_REFRESH_MS);
}

load();
</script>
