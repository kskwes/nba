<script>
/* ═══════════════════════════════════════════════
   ドラフト結果: standings/draft.html
   ・ふだんは直近の終わったドラフト（2026-27 シーズンなら 2026）
   ・次のドラフトが始まったら（ESPN の状態が pre 以外になったら）そちらに切り替え、更新ボタンで指名を取り直す
   ・「現在」の列: 今どのチームのロスターにいるか（ドラフト中は出さない）
   ═══════════════════════════════════════════════ */
// ESPN の core API（ブラウザから読める。site API のドラフトは CORS で読めない）
const CORE = y => `https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/seasons/${y}/draft`;
const SIM = NBA.url.get('sim');   // 確認用: ?sim=live で「ドラフト当日」を再現（2026 の途中までを指名済みにする）
const MONTH = 30 * NBA.api.DAY;

// 状態: 終わったものは1週間、進行中は30秒、開始前は30分で取り直す
const stateTtl = st => st === 'post' ? 7 * NBA.api.DAY : st === 'in' ? 30 * NBA.api.SEC : 30 * NBA.api.MIN;
const loadStatus = (y, fresh) => NBA.api.json(`${CORE(y)}/status`, { fresh, ttl: d => stateTtl(d?.type?.state) });

// 同時に投げる数を抑えて順に取得する
async function mapLimit(items, limit, fn) {
    const out = new Array(items.length);
    let next = 0;
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
        while (next < items.length) { const i = next++; out[i] = await fn(items[i]).catch(() => null); }
    }));
    return out;
}

const https = u => u.replace(/^http:/, 'https:').split('?')[0];

// 指名の一覧（1回）+ 指名された選手（1人1回）+ 出身校（学校ごとに1回）。選手と学校は変わらないので30日使い回す
async function loadDraft(y, fresh) {
    const st = await loadStatus(y, fresh);
    const state = st?.type?.state || 'pre';
    const rounds = await NBA.api.json(`${CORE(y)}/rounds`, { fresh, ttl: stateTtl(state) });
    const picks = (rounds.items || []).flatMap(r => r.picks || []);
    const refs = picks.map(p => p.athlete?.$ref).filter(Boolean).map(https);
    const aths = await mapLimit(refs, 6, u => NBA.api.json(u, { ttl: MONTH }));
    const byRef = new Map(refs.map((u, i) => [u, aths[i]]));
    const colRefs = [...new Set(aths.map(a => a?.college?.$ref).filter(Boolean).map(https))];
    const cols = await mapLimit(colRefs, 6, u => NBA.api.json(u, { ttl: MONTH }));
    const colBy = new Map(colRefs.map((u, i) => [u, cols[i]]));
    return {
        year: y, shortDisplayName: `${y} NBA Draft`,
        status: { state, round: st?.round },
        picks: picks.map(p => {
            const a = p.athlete?.$ref ? byRef.get(https(p.athlete.$ref)) : null;
            const nbaId = a?.links?.map(l => l.href?.match(/\/nba\/player\/_\/id\/(\d+)/)?.[1]).find(Boolean) || null;
            const col = a?.college?.$ref ? colBy.get(https(a.college.$ref)) : null;
            return {
                overall: p.overall, pick: p.pick, round: p.round, tradeNote: p.tradeNote || '',
                status: p.status?.name || '', teamId: p.team?.$ref?.match(/\/teams\/(\d+)/)?.[1] || '',
                athlete: a ? { displayName: a.displayName, displayHeight: a.displayHeight, pos: a.position?.abbreviation || '',
                    school: col?.shortName || col?.name || '', nbaId } : null,
            };
        }),
    };
}

let draft = null, current = new Map(), round = 0, teamFilter = '';
// 今季の成績: ESPN の選手 ID → { gp, min, pts, reb, ast, ts, gs }。取れなかったら null（列を出さない）
let stats = null, statsYear = null;

// 今の所属: 30チームのロスター（チームページなどと同じデータ。1日保存）から、NBA の選手 ID → チーム
async function loadCurrent() {
    const out = new Map();
    const lists = await mapLimit(NBA.teams.list, 6, t => NBA.api.roster(t.id));
    lists.forEach((d, i) => (d?.athletes || []).forEach(a => out.set(String(a.id), NBA.teams.list[i].abbr)));
    current = out;
}

// 指名された選手の成績（ドラフトの翌シーズン = そのドラフトの年 + 1 の ESPN の年）。
// statistics/byathlete を isqualified=false・limit=1000 で1回取ると、出場した全選手が1ページで返る（qualified=false は無視され、6試合以上の選手だけになる）。
// 引数の並びは players/index.html の Leaders と同じ形（qualified だけ違うので同じ URL にはならない）
async function loadStats(year) {
    const out = new Map();
    const d = await NBA.api.leaders(`season=${year}&seasontype=2&limit=1000&isqualified=false&sort=${encodeURIComponent('offensive.avgPoints:desc')}`);
    const idx = {};
    (d.categories || []).forEach(c => { idx[c.name] = {}; (c.names || []).forEach((n, i) => { idx[c.name][n] = i; }); });
    (d.athletes || []).forEach(a => {
        const v = (c, n) => { const i = idx[c]?.[n]; return i == null ? 0 : Number(a.categories?.find(x => x.name === c)?.values?.[i]) || 0; };
        const gp = v('general', 'gamesPlayed');
        if (!gp) return;
        const reb = v('general', 'avgRebounds');
        const l = {
            pts: v('offensive', 'avgPoints'), fgm: v('offensive', 'avgFieldGoalsMade'), fga: v('offensive', 'avgFieldGoalsAttempted'),
            ftm: v('offensive', 'avgFreeThrowsMade'), fta: v('offensive', 'avgFreeThrowsAttempted'),
            // OREB/DREB の内訳は返らないので、players/index.html の Game Score と同じく 0.7×OREB＋0.3×DREB ≒ 0.4×REB になるように分ける
            oreb: reb / 4, dreb: reb * 3 / 4,
            ast: v('offensive', 'avgAssists'), stl: v('defensive', 'avgSteals'), blk: v('defensive', 'avgBlocks'),
            to: v('offensive', 'avgTurnovers'), pf: v('general', 'avgFouls'),
        };
        out.set(String(a.athlete?.id), { gp, min: v('general', 'avgMinutes'), pts: l.pts, reb, ast: l.ast, ts: calcTS(l), gs: gameScore(l) });
    });
    stats = out; statsYear = year;
}

async function chooseDraft(fresh) {
    if (SIM === 'live') {
        const d = structuredClone(await loadDraft(NBA.SEASON - 1, fresh));
        d.status = { state: 'in', round: 1 };
        d.picks.forEach(p => {
            if (p.overall === 24) { p.status = 'ON_THE_CLOCK'; delete p.athlete; }
            else if (p.overall > 24) { p.status = 'PENDING'; delete p.athlete; }
        });
        return d;
    }
    // 次のドラフトが始まっていればそちら、まだなら直近の終わったドラフト
    const next = await loadStatus(NBA.SEASON, fresh).catch(() => null);
    return loadDraft(next?.type?.state && next.type.state !== 'pre' ? NBA.SEASON : NBA.SEASON - 1, fresh);
}

function render() {
    const wrap = document.getElementById('dr-wrap');
    const rows = draft.picks.map(p => {
        const a = p.athlete, nbaId = a?.nbaId;
        return { p, a, team: NBA.teams.byId(p.teamId)?.abbr || '', via: p.tradeNote || '', nbaId,
            cur: a && nbaId ? current.get(String(nbaId)) || '' : null,
            st: nbaId && stats ? stats.get(String(nbaId)) || null : null };
    }).filter(r => (!round || r.p.round === round) && (!teamFilter || r.team === teamFilter || r.cur === teamFilter));
    const withCur = draft.status?.state !== 'in' && current.size > 0;   // ドラフト中はロスターがまだ変わらないので出さない
    const withStats = draft.status?.state !== 'in' && !!stats;            // ドラフト中は成績の列も出さない
    // 成績の列（成績がない選手 = 未出場・Unsigned は "-"。並び替えでは常に下）
    const f1 = x => x.toFixed(1);
    const statCols = [
        { key: 'gp',  label: 'GP',   fmt: x => String(x), title: 'Games played\n出場試合数' },
        { key: 'min', label: 'MIN',  fmt: f1, title: 'Minutes per game\n1試合平均の出場時間' },
        { key: 'pts', label: 'PTS',  fmt: f1 },
        { key: 'reb', label: 'REB',  fmt: f1 },
        { key: 'ast', label: 'AST',  fmt: f1 },
        { key: 'ts',  label: 'TS%',  fmt: f1, title: 'True shooting %: PTS / (2 × (FGA + 0.44 × FTA))\n真のシュート効率（FT も含めた得点効率）' },
        { key: 'gs',  label: 'GmSc', fmt: f1, title: 'Game Score from per-game averages (REB split estimated)\n1試合平均の成績から計算した Game Score（REB の内訳は近似）' },
    ].map(c => ({ ...c, get: r => r.st?.[c.key] ?? null }));

    const cols = [
        { key: 'no', label: '#', cls: 'dr-no', get: r => r.p.overall, asc: true },
        { key: 'team', label: 'Team', cls: 'l', get: r => r.team, asc: true },
        { key: 'name', label: 'Player', cls: 'l', get: r => r.a?.displayName || '', asc: true },
        ...(withCur ? [{ key: 'cur', label: 'Now', cls: 'l', get: r => r.cur ?? '', asc: true, title: 'Team whose roster he is on now\n今どのチームのロスターにいるか' }] : []),
        ...(withStats ? statCols : []),
    ];
    const player = r => {
        if (!r.a) return r.p.status === 'ON_THE_CLOCK' ? '<span class="dr-clock">On the clock…</span>' : '<span class="dr-wait">Pending</span>';
        const meta = [r.a.pos, r.a.displayHeight, r.a.school].filter(Boolean).join(' · ');
        // 写真: NBA の写真、なければ大学時代の写真
        const img = r.nbaId ? `<img src="https://a.espncdn.com/i/headshots/nba/players/full/${r.nbaId}.png" alt="" loading="lazy"
            onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://a.espncdn.com/i/headshots/mens-college-basketball/players/full/${r.nbaId}.png'}else{this.style.visibility='hidden'}">` : '<span class="ph"></span>';
        const name = r.nbaId ? `<a href="${NBA.link.player(r.nbaId)}">${esc(r.a.displayName)}</a>` : esc(r.a.displayName);
        return `<div class="dr-player">${img}<div>${name}<small>${esc(meta)}</small></div></div>`;
    };
    wrap.innerHTML = '<table class="dr-table"><thead></thead><tbody></tbody></table>';
    let lastRound = null;
    NBA.ui.sortable(wrap, {
        rows, cols, initial: { key: 'no', asc: true },
        render: (r, i, col) => {
            if (i === 0) lastRound = null;
            // 指名順で並べているときは、2巡目の始まりに線を引く
            const start = col?.key === 'no' && lastRound != null && r.p.round !== lastRound;
            lastRound = r.p.round;
            return `<tr class="${r.p.round === 2 ? 'r2' : ''} ${start ? 'round-start' : ''}">
                <td class="dr-no">${r.p.overall}<small>R${r.p.round}-${r.p.pick}</small></td>
                <td class="l dr-team"><a href="${NBA.link.team(r.team)}">${esc(r.team)}</a>${r.via ? `<small>${esc(r.via)}</small>` : ''}</td>
                <td class="l dr-player-td">${player(r)}</td>
                ${withCur ? `<td class="l dr-cur">${r.cur ? `<a href="${NBA.link.team(r.cur)}">${esc(r.cur)}</a>` : r.a ? '<span class="dr-na">Unsigned</span>' : ''}</td>` : ''}
                ${withStats ? statCols.map(c => { const v = c.get(r); return `<td class="${c.key === 'gs' ? 'dr-gs' : ''}">${v == null ? '<span class="dr-na">-</span>' : c.fmt(v)}</td>`; }).join('') : ''}
            </tr>`;
        },
    });
    if (!rows.length) wrap.innerHTML = '<div class="msg">No picks</div>';
}

function renderHead() {
    const st = draft.status || {};
    const live = st.state === 'in';
    document.getElementById('dr-name').textContent = draft.shortDisplayName || `${draft.year} NBA Draft`;
    const badge = document.getElementById('dr-status');
    badge.textContent = live ? `LIVE · Round ${st.round || ''}` : st.state === 'post' ? 'FINAL' : 'UPCOMING';
    badge.className = `dr-badge ${live ? 'live' : ''}`;
    // 成績を出しているときだけ、ESPN のバッジ（成績のシーズン）
    document.getElementById('dr-src').innerHTML = !live && stats ? NBA.ui.src.live(`ESPN · ${statsYear - 1}-${String(statsYear).slice(2)}`) : '';
    document.getElementById('dr-refresh').hidden = !live;
    const made = draft.picks.filter(p => p.athlete).length;
    document.getElementById('dr-sub').innerHTML = live
        ? `<span data-ja="ドラフト中: ${made} / ${draft.picks.length} 人を指名済み">Draft in progress: ${made} of ${draft.picks.length} picks made.</span> <span data-ja="「Refresh」で最新の指名を取り込む">Hit Refresh for the latest picks.</span>`
        : `${draft.picks.length} players drafted in ${draft.year}`;
    document.getElementById('dr-updated').textContent = `Updated ${new Date().toLocaleTimeString('en-US', { timeZone: 'Asia/Tokyo', hour: 'numeric', minute: '2-digit' })}`;
    document.getElementById('dr-note').innerHTML = live
        ? '<span data-ja="via はトレードで手に入れた指名権">via = pick acquired by trade.</span><br><span data-ja="ドラフト中は Now の列を出さない（ロスターがまだ変わらないため）">Now column hidden during the draft (rosters not updated yet).</span>'
        : '<span data-ja="Now は今どのチームのロスターにいるか（どのロスターにもいない選手は Unsigned）">Now = team whose roster he is on today (not on any roster = "Unsigned").</span><br>'
        + '<span data-ja="via はトレードで手に入れた指名権、Traded to はドラフト当日のトレード">via = pick acquired by trade. Traded to = draft-night trade.</span><br>'
        + (stats ? `<span data-ja="成績は ESPN の ${statsYear - 1}-${String(statsYear).slice(2)} レギュラーシーズンの1試合平均（GP は出場試合数）。まだ出場していない選手・Unsigned は -">Stats: ESPN ${statsYear - 1}-${String(statsYear).slice(2)} regular season, per game (GP = games played). No games yet or unsigned = "-".</span><br>`
            + '<span data-ja="GmSc は1試合平均の成績から計算した Game Score（REB の内訳は近似。Players の Leaders と同じ）">GmSc = Game Score from per-game averages (REB split estimated, same as Players › Leaders).</span><br>' : '')
        + '<span data-ja="列の見出しを押すと並び替え">Click a column header to sort.</span><br>'
        + '<span data-ja="チームの絞り込みは、指名したチームと今のチームのどちらかに当てはまれば出す">Team filter matches either the drafting team or the current team.</span>';
    const sel = document.getElementById('dr-team');
    const teams = [...new Set(draft.picks.map(p => NBA.teams.byId(p.teamId)?.abbr))].filter(Boolean).sort();
    sel.innerHTML = `<option value="">All teams</option>${teams.map(t => `<option ${t === teamFilter ? 'selected' : ''}>${t}</option>`).join('')}`;
}

async function init(fresh = false) {
    try {
        draft = await chooseDraft(fresh);
        stats = null;
        if (draft.status?.state !== 'in') {
            // 成績はドラフトの翌シーズン（今季より先なら、まだ始まっていないので取らない）
            const sy = draft.year + 1;
            await Promise.all([
                loadCurrent().catch(e => console.warn('rosters:', e)),
                sy <= NBA.SEASON ? loadStats(sy).catch(e => console.warn('stats:', e)) : null,
            ]);
        }
        renderHead();
        render();
    } catch (e) {
        console.error(e);
        document.getElementById('dr-wrap').innerHTML = '<div class="msg error">Failed to load draft data</div>';
    }
}

if (SIM === 'live') document.getElementById('mock').innerHTML = '<div class="mock-banner"><span data-ja="確認用: ドラフト当日の表示を再現（2026 のデータで 24位から先を未指名に）">Test mode: simulating draft night (2026 data, picks 25+ left open).</span> <a href="draft.html">Back to normal view</a></div>';

document.getElementById('dr-round').addEventListener('click', e => {
    const b = e.target.closest('[data-r]');
    if (!b) return;
    round = +b.dataset.r;
    document.querySelectorAll('#dr-round button').forEach(x => x.classList.toggle('active', x === b));
    render();
});
document.getElementById('dr-team').addEventListener('change', e => { teamFilter = e.target.value; render(); });
document.getElementById('dr-refresh').addEventListener('click', async e => {
    const b = e.currentTarget;
    b.disabled = true; b.textContent = 'Refreshing…';
    await init(true);
    b.disabled = false; b.textContent = '↻ Refresh';
});

init();
NBA.ui.fetched();
</script>
</body>
</html>
