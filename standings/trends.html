    <style>
        /* 2026-11 リニューアル: predict/index.html の Trends タブから移動 */

        /* ─── Segmented control / Buttons / Panels ─── */
        .seg {
            display: inline-flex; background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap;
        }
        .seg button {
            background: none; border: none; color: var(--muted); font-size: 12.5px; font-weight: 700;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: inherit;
        }
        .seg button:hover { color: var(--text); }
        .seg button.on { background: var(--accent); color: var(--on-accent); }
        .btn {
            background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
            font-size: 12.5px; font-weight: 700; padding: 8px 14px; border-radius: 8px; cursor: pointer;
            font-family: inherit; white-space: nowrap;
        }
        .btn:hover { color: var(--text); border-color: #3a3a44; }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
        .placeholder { padding: 46px 20px; text-align: center; }
        .placeholder .big { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .placeholder .sub { font-size: 12.5px; color: var(--muted); }

        /* ─── Trends ─── */
        .trend-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .pred-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--text-dim); cursor: pointer; user-select: none; }
        .pred-toggle input { accent-color: var(--accent); margin: 0; }
        .pred-toggle.off { opacity: .45; cursor: default; }
        .team-chips { display: flex; gap: 4px; flex-wrap: wrap; }
        .team-chip {
            width: 38px; height: 38px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
        }
        .team-chip img { width: 24px; height: 24px; object-fit: contain; opacity: .55; }
        .team-chip:hover img { opacity: 1; }
        .team-chip.on { background: var(--surface2); }
        .chip-hint { font-size: 11.5px; color: var(--muted); margin: 6px 0 12px; }
        .team-chip.on img { opacity: 1; }
        .trend-body { display: flex; gap: 14px; align-items: flex-start; }
        .chart-panel { padding: 14px 14px 10px; flex: 0 0 auto; width: 100%; min-width: 0; transition: width .35s ease; }
        .trend-body.recent .chart-panel { width: 580px; }
        .chart-wrap { min-height: 340px; }
        .delta-panel { flex: 1; min-width: 0; padding: 14px 14px 8px; }
        .delta-panel.fade { animation: fadein .3s ease; }
        .trend-body.all .delta-panel { display: none; }
        @keyframes fadein { from { opacity: 0; } }
        .d-row { display: flex; align-items: center; gap: 8px; height: 25px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--line-soft); }
        .d-row:last-child { border-bottom: none; }
        .d-row.sel { color: var(--text); font-weight: 700; }
        .d-rank { width: 18px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
        .d-dot { width: 6px; height: 6px; border-radius: 50%; }
        .d-row img { width: 18px; height: 18px; object-fit: contain; }
        .d-abbr { width: 36px; }
        .d-rec { flex: 1; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
        .d-chg { width: 44px; text-align: right; font-family: var(--font-score); font-size: 13px; font-weight: 600; }
        .d-chg .up { color: var(--pos); }
        .d-chg .down { color: var(--neg); }
        .d-chg .flat { color: var(--muted); }
        .chart-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; padding-left: 4px; }
        .chart-title .t { font-size: 14px; font-weight: 700; }
        .chart-title .s { font-size: 12px; color: var(--muted); }
        .chart-wrap { position: relative; }
        .chart-wrap.recent #hit { cursor: zoom-out; }
        .chart-wrap.all #hit { cursor: zoom-in; }
        .chart-note { font-size: 11px; color: var(--muted); padding: 6px 4px 0; }
        .chart-wrap svg { display: block; width: 100%; }
        .tt {
            position: absolute; pointer-events: none; z-index: 10; display: none;
            background: #1a1a20; border: 1px solid #33333c; border-radius: 10px; padding: 8px 10px;
            box-shadow: 0 10px 28px rgba(0,0,0,.55); font-size: 11.5px; min-width: 150px;
        }
        .tt-h { font-weight: 700; color: var(--text); margin-bottom: 5px; }
        .tt-row { display: flex; gap: 8px; color: var(--muted); line-height: 1.55; font-variant-numeric: tabular-nums; }
        .tt-row .r { width: 16px; text-align: right; }
        .tt-row .a { width: 42px; display: flex; align-items: center; gap: 4px; }
        .tt-row .a i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .tt-row .p { margin-left: auto; padding-left: 6px; }
        .tt-row.sel { color: var(--text); font-weight: 700; }

        .chart-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); padding: 8px 4px 0; }
        .lg { display: inline-flex; align-items: center; gap: 6px; }
        .lg i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid var(--accent); }
        .lg i.pred { border-top: 1.5px dashed var(--muted) !important; }
        .chart-foot .btn { margin-left: auto; padding: 6px 12px; font-size: 12px; }
        .tbl-wrap { overflow-x: auto; margin-top: 12px; }
        .rank-tbl { border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; }
        .rank-tbl th, .rank-tbl td { padding: 5px 7px; text-align: center; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
        .rank-tbl th { color: var(--muted); font-weight: 700; font-size: 10.5px; }
        .rank-tbl td:first-child, .rank-tbl th:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); font-weight: 700; }
        .rank-tbl tr.sel td { color: var(--text); font-weight: 700; }
        .rank-tbl tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--c); }

        @media (max-width: 860px) {
            .trend-body { flex-direction: column; }
            .trend-body.recent .chart-panel { width: 100%; }
            .delta-panel { width: 100%; }
        }
    </style>
</head>
<body class="theme-broadcast">

    <div id="trends"><div class="msg">Loading<span class="spinner"></span></div></div>

<script src="../assets/api.js?v=2026111301"></script>
<script src="../assets/teams.js?v=2026111301"></script>
<script src="../assets/ui.js?v=2026111301"></script>
<script>
/* ══════════════════════════════════════════════
   Standings Trends（毎週日曜時点の順位・勝率の推移）
   2026-11: predict/index.html の Trends タブから移動。
   予想順位（data/predictions-<シーズン>.js）は、ファイルがあるときだけ点線で重ねる
   ══════════════════════════════════════════════ */
const SEASON = NBA.SEASON;   // ESPN の年（2026-27 シーズン → 2027）
const CONF = { west: 'West', east: 'East' };

const etDate = d => new Date(d).toLocaleDateString('en-CA', { timeZone: 'America/New_York' });   // YYYY-MM-DD
const mdLabel = ymd => `${+ymd.slice(5, 7)}/${+ymd.slice(8, 10)}`;
const logo = a => NBA.teams.byAbbr(a)?.logo || FALLBACK_IMG;
const fmtPct = v => v == null ? '-' : v.toFixed(3).replace(/^0/, '');
const pctOf = r => r && r.w + r.l ? r.w / (r.w + r.l) : null;

// 強調色（暗い背景で3色とも区別できることを検証済み）。色はチームに付き、選択順で空いている色を割り当てる
const SERIES_COLORS = ['#c98500', '#3987e5', '#d55181'];
const MAX_TEAMS = SERIES_COLORS.length;
const RECENT_POINTS = 5;   // 直近1ヶ月 = 最新を含む5時点

/* ── State ── */
const TEAMS = {};          // abbr → { id, name, conf: 'west' | 'east' }
let PRED = null;           // 予想ファイル（window.NBA_PREDICTIONS）。無ければ null
let showPred = true;       // "Show my predicted rank"
let defaultOrder = null;   // 同率の並び（昨季の最終順位） { west: [abbr], east: [abbr] }
let trend = null;          // { dates: [YYYY-MM-DD], snaps: { west: [{abbr: {rank,w,l}}], east } }
let trendError = false;
let trendConf = 'west';
let trendSel = {};         // conf → [{ team, color }]
let trendRange = 'recent';
let trendMetric = 'rank';  // 'rank' | 'pct'
let trendNotice = '';
let showTable = false;

/* ══════════════════════════════════════════════
   Data loading
   ══════════════════════════════════════════════ */
// 予想ファイルは置いたシーズンだけある。無い（404）ときは null
function loadPredFile() {
    return new Promise(resolve => {
        const s = document.createElement('script');
        s.src = `../data/predictions-${SEASON}.js`;
        s.onload = () => {
            const p = window.NBA_PREDICTIONS;
            resolve(Array.isArray(p?.standings?.west) && Array.isArray(p?.standings?.east) ? p : null);
        };
        s.onerror = () => resolve(null);
        document.head.appendChild(s);
    });
}

// standings の順位（シード順の略称）。名前もここから取る
async function fetchStandings(season) {
    const d = await NBA.api.standings(season);
    const out = { west: [], east: [] };
    (d.children || []).forEach(c => {
        const conf = /east/i.test(c.name) ? 'east' : 'west';
        const entries = c.standings?.entries?.length
            ? c.standings.entries
            : (c.children || []).flatMap(x => x.standings?.entries || []);
        entries.forEach(e => {
            const s = e.stats?.find(x => x.name === 'playoffSeed');
            out[conf].push({ abbr: normAbbr(e.team.abbreviation), name: e.team.shortDisplayName || e.team.name, seed: Number(s?.value ?? s?.displayValue) || 99 });
        });
        out[conf].sort((a, b) => a.seed - b.seed);
    });
    return out;
}

async function loadTrends() {
    const abbrs = Object.keys(TEAMS);
    const scheds = await Promise.all(abbrs.map(a =>
        NBA.api.schedule(TEAMS[a].id, `?season=${SEASON}&seasontype=2`)));
    const games = {};   // abbr → [{ date, win }]
    let last = null;
    abbrs.forEach((a, k) => {
        games[a] = [];
        (scheds[k].events || []).forEach(ev => {
            const comp = ev.competitions?.[0];
            if (!comp?.status?.type?.completed) return;
            const me = comp.competitors.find(c => String(c.team?.id) === TEAMS[a].id);
            if (!me) return;
            const date = etDate(ev.date);
            games[a].push({ date, win: !!me.winner });
            if (!last || date > last) last = date;
        });
    });
    if (!last) { trend = { dates: [], snaps: { west: [], east: [] } }; return; }
    // 時点：開幕後の毎週日曜＋最新の試合日
    const first = Object.values(games).flat().reduce((m, g) => g.date < m ? g.date : m, last);
    const dates = [];
    const d = new Date(first + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + (7 - d.getUTCDay()) % 7);
    for (; d.toISOString().slice(0, 10) <= last; d.setUTCDate(d.getUTCDate() + 7)) dates.push(d.toISOString().slice(0, 10));
    if (dates[dates.length - 1] !== last) dates.push(last);
    const snaps = { west: [], east: [] };
    dates.forEach(day => {
        ['west', 'east'].forEach(c => {
            const rec = {};
            abbrs.filter(a => TEAMS[a].conf === c).forEach(a => {
                const gs = games[a].filter(g => g.date <= day);
                rec[a] = { w: gs.filter(g => g.win).length, l: gs.filter(g => !g.win).length };
            });
            // まだ試合をしていないチームは勝率5割として、勝ったチームと負けたチームの間に置く
            const pct = a => rec[a].w + rec[a].l ? rec[a].w / (rec[a].w + rec[a].l) : 0.5;
            const snap = {};
            // 同率は昨季の順位順（名前順のような意味のない並びにしない）
            const prev = a => { const i = (defaultOrder?.[c] || []).indexOf(a); return i < 0 ? 99 : i; };
            Object.keys(rec).sort((a, b) => pct(b) - pct(a) || rec[b].w - rec[a].w || prev(a) - prev(b) || a.localeCompare(b))
                .forEach((a, i) => snap[a] = { rank: i + 1, ...rec[a] });
            snaps[c].push(snap);
        });
    });
    trend = { dates, snaps };
}

/* ══════════════════════════════════════════════
   Helpers
   ══════════════════════════════════════════════ */
// 予想順位（1〜15）。予想ファイルが無い・表示を切っている・そのカンファレンスにいないときは null
function predRank(t) {
    if (!PRED || !showPred) return null;
    const i = PRED.standings[trendConf].indexOf(t);
    return i < 0 ? null : i + 1;
}
// 最新時点の順位順の略称
function latestOrder() {
    const now = trend.snaps[trendConf][trend.dates.length - 1];
    return Object.keys(now).sort((a, b) => now[a].rank - now[b].rank);
}
function selected() {
    if (!trendSel[trendConf]) trendSel[trendConf] = [{ team: latestOrder()[0], color: SERIES_COLORS[0] }];
    return trendSel[trendConf];
}
function toggleTeam(t) {
    const sel = selected();
    const at = sel.findIndex(s => s.team === t);
    trendNotice = '';
    if (at >= 0) { if (sel.length > 1) sel.splice(at, 1); }
    else if (sel.length >= MAX_TEAMS) trendNotice = `Up to ${MAX_TEAMS} teams at once`;
    else sel.push({ team: t, color: SERIES_COLORS.find(c => !sel.some(s => s.color === c)) });
    renderTrends();
}
function pointWindow() {
    const n = trend.dates.length;
    return { n, from: trendRange === 'recent' ? Math.max(0, n - RECENT_POINTS) : 0 };
}
function setRange(r) {
    if (r === trendRange) return;
    const prev = trendRange;
    trendRange = r;
    renderTrends(prev);
}
// 表示中の指標の値（順位 or 勝率。試合前は勝率 null）
const valueOf = (snap, t) => trendMetric === 'rank' ? snap[t].rank : pctOf(snap[t]);

/* ══════════════════════════════════════════════
   Render
   ══════════════════════════════════════════════ */
// 直近1ヶ月の変動（グラフ横の一覧）。Rank は順位の上下、Win % は勝率の増減
function deltaPanel(fade) {
    const { n, from } = pointWindow();
    const snaps = trend.snaps[trendConf], now = snaps[n - 1], before = snaps[from];
    const colorOf = t => selected().find(s => s.team === t)?.color;
    const chgHTML = t => {
        if (trendMetric === 'rank') {
            const d = before[t].rank - now[t].rank;
            return d > 0 ? `<span class="up">▲${d}</span>` : d < 0 ? `<span class="down">▼${-d}</span>` : '<span class="flat">–</span>';
        }
        const a = pctOf(before[t]), b = pctOf(now[t]);
        if (a == null || b == null) return '<span class="flat">–</span>';
        const d = Math.round((b - a) * 1000);
        return d > 0 ? `<span class="up">+${fmtPct(d / 1000)}</span>` : d < 0 ? `<span class="down">−${fmtPct(-d / 1000)}</span>` : '<span class="flat">–</span>';
    };
    return `<div class="panel delta-panel ${fade ? 'fade' : ''}">
        <div class="chart-title"><span class="t">${trendMetric === 'rank' ? 'Rank' : 'Win %'} Change · Last Month</span><span class="s">${mdLabel(trend.dates[from])} → ${mdLabel(trend.dates[n - 1])}</span></div>
        ${latestOrder().map(t => {
            const c = colorOf(t);
            return `<div class="d-row ${c ? 'sel' : ''}"><span class="d-rank">${now[t].rank}</span>
                <span class="d-dot" style="${c ? `background:${c}` : ''}"></span>
                <img src="${logo(t)}" alt=""><span class="d-abbr">${t}</span>
                <span class="d-rec">${now[t].w}-${now[t].l}${trendMetric === 'pct' ? ` · ${fmtPct(pctOf(now[t]))}` : ''}</span><span class="d-chg">${chgHTML(t)}</span></div>`;
        }).join('')}
    </div>`;
}

function renderTrends(animFrom) {
    const el = document.getElementById('trends');
    if (trendError) { el.innerHTML = '<div class="msg error"><span data-ja="試合結果を取得できませんでした">Failed to load game results.</span> <span data-ja="時間をおいて再読み込みしてください">Try reloading later.</span></div>'; return; }
    if (!trend) { el.innerHTML = '<div class="msg">Loading<span class="spinner"></span></div>'; return; }
    if (!trend.dates.length) {
        el.innerHTML = `<div class="panel placeholder"><div class="big" data-ja="開幕後、1週間ごとの順位推移を表示します">Weekly standings trend appears after opening night</div>
            <div class="sub" data-ja="毎週日曜時点の順位を、ESPN の試合結果から計算します">Ranks as of each Sunday, from ESPN game results</div></div>`;
        return;
    }
    const teams = latestOrder();
    const sel = selected();
    const colorOf = t => sel.find(s => s.team === t)?.color;
    const { n, from } = pointWindow();
    const predOn = trendMetric === 'rank' && PRED && showPred;
    el.innerHTML = `
        <div class="trend-controls">
            <div class="seg">
                <button data-conf="west" class="${trendConf === 'west' ? 'on' : ''}">West</button>
                <button data-conf="east" class="${trendConf === 'east' ? 'on' : ''}">East</button>
            </div>
            <div class="seg">
                <button data-range="recent" class="${trendRange === 'recent' ? 'on' : ''}">Last Month</button>
                <button data-range="all" class="${trendRange === 'all' ? 'on' : ''}">Full Season</button>
            </div>
            <div class="seg">
                <button data-metric="rank" class="${trendMetric === 'rank' ? 'on' : ''}">Rank</button>
                <button data-metric="pct" class="${trendMetric === 'pct' ? 'on' : ''}">Win %</button>
            </div>
            ${PRED ? `<label class="pred-toggle ${trendMetric === 'rank' ? '' : 'off'}" title="${trendMetric === 'rank'
                ? `Dashed line: your preseason prediction (data/predictions-${SEASON}.js)\n点線: シーズン前の予想順位`
                : 'Rank view only\n順位の表示のときだけ'}">
                <input type="checkbox" id="pred-toggle" ${showPred ? 'checked' : ''} ${trendMetric === 'rank' ? '' : 'disabled'}> Show my predicted rank</label>` : ''}
        </div>
        <div class="team-chips">${teams.map(t => {
            const c = colorOf(t);
            return `<button class="team-chip ${c ? 'on' : ''}" style="${c ? `border-color:${c};box-shadow:inset 0 -3px 0 ${c}` : ''}"
                data-team-chip="${t}" title="${esc(TEAMS[t]?.name || t)}" aria-pressed="${!!c}"><img src="${logo(t)}" alt="${t}"></button>`;
        }).join('')}</div>
        <div class="chip-hint">${trendNotice
            ? `<span data-ja="同時に選べるのは${MAX_TEAMS}チームまでです">${trendNotice}</span>`
            : `<span data-ja="チームを選んで比較（最大${MAX_TEAMS}チーム）">Pick teams to compare (up to ${MAX_TEAMS})</span>`}</div>
        <div class="trend-body ${animFrom || trendRange}" id="trend-body">
        <div class="panel chart-panel">
            <div class="chart-title"><span class="t">${CONF[trendConf]} ${trendMetric === 'rank' ? 'Standings' : 'Win %'} Trend</span>
                <span class="s">${mdLabel(trend.dates[from])}–${mdLabel(trend.dates[n - 1])}</span></div>
            <div class="chart-wrap ${trendRange}" id="chart-wrap"><div class="tt" id="tt"></div></div>
            <div class="chart-foot">
                ${sel.map(s => `<span class="lg"><i style="border-top-color:${s.color}"></i>${s.team}${predOn && predRank(s.team) ? ` (Pred. #${predRank(s.team)})` : ''}</span>`).join('')}
                ${predOn ? '<span class="lg"><i class="pred"></i>Predicted rank</span>' : ''}
                <button class="btn" id="tbl-toggle">${showTable ? 'Hide Table' : 'Show Table'}</button>
            </div>
            <div class="chart-note">${trendRange === 'recent'
                ? '<span data-ja="グラフをクリックするとシーズン全体を表示">Click chart for full season</span>'
                : '<span data-ja="グラフをクリックすると直近1ヶ月に戻る">Click chart to return to last month</span>'}
                · <span data-ja="毎週日曜時点（最後は最新の試合日）">As of each Sunday (last point: latest game day)</span>
                · <span data-ja="順位は勝率で算出（同率は昨季の順位順。公式のタイブレークは未考慮）">Ranked by win % (ties: last season's rank; official tiebreakers not applied)</span></div>
            ${showTable ? rankTable() : ''}
        </div>
        ${deltaPanel(!!animFrom)}
        </div>`;
    el.querySelectorAll('[data-conf]').forEach(b => b.onclick = () => { trendConf = b.dataset.conf; trendNotice = ''; renderTrends(); });
    el.querySelectorAll('[data-range]').forEach(b => b.onclick = () => setRange(b.dataset.range));
    el.querySelectorAll('[data-metric]').forEach(b => b.onclick = () => { if (trendMetric !== b.dataset.metric) { trendMetric = b.dataset.metric; renderTrends(); } });
    el.querySelectorAll('[data-team-chip]').forEach(b => b.onclick = () => toggleTeam(b.dataset.teamChip));
    const pt = document.getElementById('pred-toggle');
    if (pt) pt.onchange = () => { showPred = pt.checked; renderTrends(); };
    document.getElementById('tbl-toggle').onclick = () => { showTable = !showTable; renderTrends(); };
    if (!animFrom) return drawChart();
    // 期間切替: 前の幅から新しい幅へアニメーションし、終わってからグラフを描く
    const body = document.getElementById('trend-body');
    let done = false;
    const finish = () => { if (!done) { done = true; drawChart(); } };
    requestAnimationFrame(() => requestAnimationFrame(() => {
        body.classList.replace(animFrom, trendRange);
        body.querySelector('.chart-panel').addEventListener('transitionend', finish, { once: true });
        setTimeout(finish, 450); // 幅が変わらない（スマホ）場合の保険
    }));
}

// 表で見る（各時点の順位 or 勝率）。予想順位は表示しているときだけ列を出す
function rankTable() {
    const { n, from } = pointWindow();
    const snaps = trend.snaps[trendConf];
    const cols = [];
    for (let i = from; i < n; i++) cols.push(i);
    const colorOf = t => selected().find(s => s.team === t)?.color;
    const predCol = PRED && showPred;
    const cell = (i, t) => trendMetric === 'rank' ? snaps[i][t].rank : fmtPct(pctOf(snaps[i][t]));
    return `<div class="tbl-wrap"><table class="rank-tbl">
        <tr><th>Team</th>${predCol ? '<th>Pred.</th>' : ''}${cols.map(i => `<th>${mdLabel(trend.dates[i])}</th>`).join('')}</tr>
        ${latestOrder().map(t => `<tr ${colorOf(t) ? `class="sel" style="--c:${colorOf(t)}"` : ''}><td>${t}</td>${predCol ? `<td>${predRank(t) ?? '-'}</td>` : ''}
            ${cols.map(i => `<td>${cell(i, t)}</td>`).join('')}</tr>`).join('')}
    </table></div>`;
}

function drawChart() {
    const wrap = document.getElementById('chart-wrap');
    if (!wrap || !wrap.clientWidth || !trend?.dates.length) return;
    const { n, from } = pointWindow();
    const snaps = trend.snaps[trendConf];
    const sel = selected();
    const isRank = trendMetric === 'rank';
    const W = wrap.clientWidth, H = Math.max(340, Math.min(440, W * .55));
    const m = { l: isRank ? 30 : 40, r: 46, t: 10, b: 26 };
    const span = Math.max(trendRange === 'recent' ? RECENT_POINTS - 1 : Math.max(n, 8) - 1, 1);
    const x = i => m.l + (i - from) * (W - m.l - m.r) / span;
    const idx = [];
    for (let i = from; i < n; i++) idx.push(i);
    const allTeams = Object.keys(snaps[n - 1]);

    // 縦軸: Rank は 1〜15、Win % は表示期間の最小〜最大を 0.1 刻みに広げた範囲
    let y, lo = 0, hi = 1;
    if (isRank) {
        y = r => m.t + (r - 1) * (H - m.t - m.b) / 14;
    } else {
        const vals = [];
        idx.forEach(i => allTeams.forEach(t => { const v = pctOf(snaps[i][t]); if (v != null) vals.push(v); }));
        if (!vals.length) vals.push(0, 1);
        lo = Math.max(0, Math.floor(Math.min(...vals) * 10 - 1e-9) / 10);
        hi = Math.min(1, Math.ceil(Math.max(...vals) * 10 + 1e-9) / 10);
        if (hi - lo < 0.2) { lo = Math.max(0, lo - 0.1); hi = Math.min(1, hi + 0.1); }
        y = v => m.t + (hi - v) * (H - m.t - m.b) / (hi - lo);
    }

    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${CONF[trendConf]} ${isRank ? 'Standings' : 'Win %'} Trend">`;
    if (isRank) {
        const half = (y(2) - y(1)) / 2;
        const band = (r1, r2, op) => `<rect x="${m.l}" y="${y(r1) - half}" width="${W - m.l - m.r}" height="${y(r2) - y(r1) + half * 2}" fill="#fff" opacity="${op}"/>`;
        s += band(1, 6, .035) + band(7, 10, .015);
        for (let r = 1; r <= 15; r++) s += `<text x="${m.l - 10}" y="${y(r) + 3.5}" fill="#8b8b95" font-size="10" text-anchor="end">${r}</text>`;
    } else {
        for (let k = Math.round(lo * 10); k <= Math.round(hi * 10); k++) {
            const v = k / 10;
            s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#fff" opacity="${k === 5 ? .18 : .05}"/>`;
            s += `<text x="${m.l - 8}" y="${y(v) + 3.5}" fill="#8b8b95" font-size="10" text-anchor="end">${fmtPct(v)}</text>`;
        }
    }
    const step = trendRange === 'recent' ? 1 : Math.max(1, Math.ceil(span / (W < 500 ? 4 : 8)));
    for (let i = from; i < n; i += step) s += `<text x="${x(i)}" y="${H - 6}" fill="#8b8b95" font-size="10" text-anchor="middle">${mdLabel(trend.dates[i])}</text>`;
    // 値が無い時点（勝率で試合前）は線を切る
    const path = t => {
        let d = '', pen = false;
        idx.forEach(i => {
            const v = valueOf(snaps[i], t);
            if (v == null) { pen = false; return; }
            d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
            pen = true;
        });
        return d;
    };
    const isSel = t => sel.some(v => v.team === t);
    const endY = t => { const v = valueOf(snaps[n - 1], t); return v == null ? null : y(v); };
    allTeams.filter(t => !isSel(t)).forEach(t => {
        s += `<path d="${path(t)}" fill="none" stroke="#3a3a44" stroke-width="1.5" stroke-linejoin="round"/>`;
        // Win % は同率で重なるので、選んでいないチームの名前は Rank のときだけ
        if (isRank) s += `<text x="${x(n - 1) + 7}" y="${endY(t) + 3.5}" fill="#6b6b75" font-size="9.5">${t}</text>`;
    });
    if (isRank && PRED && showPred) sel.forEach(v => {
        const pr = predRank(v.team);
        if (pr) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(pr)}" y2="${y(pr)}" stroke="${v.color}" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>`;
    });
    // 選んだチームの名前（重なるときは 13px ずつずらす）
    const labels = sel.map(v => ({ v, y: endY(v.team) })).filter(l => l.y != null).sort((a, b) => a.y - b.y);
    labels.forEach((l, k) => { if (k && l.y - labels[k - 1].y < 13) l.y = labels[k - 1].y + 13; });
    sel.forEach(v => {
        s += `<path d="${path(v.team)}" fill="none" stroke="${v.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
        idx.forEach(i => { const val = valueOf(snaps[i], v.team); if (val != null) s += `<circle cx="${x(i)}" cy="${y(val)}" r="4" fill="${v.color}" stroke="#141418" stroke-width="2"/>`; });
    });
    labels.forEach(({ v, y: ly }) => {
        s += `<rect x="${x(n - 1) + 5}" y="${ly - 7}" width="30" height="14" fill="#141418"/>`;
        s += `<text x="${x(n - 1) + 7}" y="${ly + 4}" fill="#f2f2f4" font-size="11" font-weight="700">${v.team}</text>`;
    });
    s += `<line id="xh" x1="0" x2="0" y1="${m.t - 6}" y2="${H - m.b + 4}" stroke="#8b8b95" stroke-width="1" opacity="0"/>`;
    s += `<rect id="hit" x="${m.l - 10}" y="0" width="${W - m.l - m.r + 20}" height="${H}" fill="transparent"/>`;
    s += '</svg>';
    wrap.querySelector('svg')?.remove();
    wrap.insertAdjacentHTML('beforeend', s);

    const tt = document.getElementById('tt'), xh = wrap.querySelector('#xh'), hit = wrap.querySelector('#hit');
    const show = clientX => {
        const box = wrap.getBoundingClientRect();
        const px = (clientX - box.left) * (W / box.width);
        const i = Math.max(from, Math.min(n - 1, from + Math.round((px - m.l) / ((W - m.l - m.r) / span))));
        const w = snaps[i];
        const order = Object.keys(w).sort((a, b) => w[a].rank - w[b].rank);
        tt.innerHTML = `<div class="tt-h">As of ${mdLabel(trend.dates[i])}</div>` + order.map(t => {
            const c = sel.find(v => v.team === t)?.color;
            return `<div class="tt-row ${c ? 'sel' : ''}"><span class="r">${w[t].rank}</span>
                <span class="a">${c ? `<i style="background:${c}"></i>` : ''}${t}</span><span>${w[t].w}-${w[t].l}</span>${isRank ? '' : `<span class="p">${fmtPct(pctOf(w[t]))}</span>`}</div>`;
        }).join('');
        tt.style.display = 'block';
        const left = x(i) * box.width / W;
        tt.style.left = (left > box.width / 2 ? left - tt.offsetWidth - 14 : left + 14) + 'px';
        tt.style.top = '6px';
        xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('opacity', '.6');
    };
    const hide = () => { tt.style.display = 'none'; xh.setAttribute('opacity', '0'); };
    const toggleRange = () => setRange(trendRange === 'recent' ? 'all' : 'recent');
    // PC: ホバーでツールチップ、クリックで期間切替 ／ スマホ: なぞるとツールチップ、タップで期間切替
    hit.addEventListener('mousemove', e => show(e.clientX));
    hit.addEventListener('mouseleave', hide);
    hit.addEventListener('click', toggleRange);
    let moved = false;
    hit.addEventListener('touchstart', () => { moved = false; }, { passive: true });
    hit.addEventListener('touchmove', e => { moved = true; show(e.touches[0].clientX); }, { passive: true });
    hit.addEventListener('touchend', e => { if (!moved) { e.preventDefault(); toggleRange(); } else hide(); });
}
let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawChart, 120); });

/* ══════════════════════════════════════════════
   Init
   ══════════════════════════════════════════════ */
async function init() {
    NBA.teams.list.forEach(t => { TEAMS[t.abbr] = { id: t.id, name: t.abbr, conf: t.conf.toLowerCase() }; });
    const [pred, cur, prev] = await Promise.all([
        loadPredFile(),
        fetchStandings(SEASON).catch(() => null),
        fetchStandings(SEASON - 1).catch(() => null),
    ]);
    PRED = pred;
    ['west', 'east'].forEach(c => (cur?.[c] || []).forEach(t => { if (TEAMS[t.abbr]) TEAMS[t.abbr].name = t.name; }));
    defaultOrder = {};
    ['west', 'east'].forEach(c => { defaultOrder[c] = (prev?.[c] || []).map(t => t.abbr).filter(a => TEAMS[a]?.conf === c); });
    try {
        await loadTrends();
    } catch (e) {
        console.warn('trend error:', e);
        trendError = true;
    }
    NBA.ui.fetched();
    renderTrends();
}
init();
</script>
