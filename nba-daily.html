<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Daily</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="nba-common.css">
    <style>
        /* ─── Refresh button ─── */
        .header-right {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .refresh-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-size: 15px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, transform 0.3s;
            flex-shrink: 0;
            padding: 0;
            line-height: 1;
        }

        .refresh-btn:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
        .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .refresh-btn.spinning { animation: spin 0.8s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Section ─── */
        .section { margin-bottom: 32px; }

        .section-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 12px;
        }

        .section-header h2 {
            font-family: var(--font-score); font-size: 17px; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
        }

        .date-badge {
            font-family: var(--font-score); font-size: 12px; letter-spacing: 1px;
            color: var(--muted); text-transform: uppercase;
        }

        /* ─── Game Grid / Card（放送スコアボード風） ─── */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.15s, border-color 0.15s;
        }
        .card.clickable { cursor: pointer; }
        .card.clickable:hover { transform: translateY(-2px); border-color: #3a3a44; }
        .card.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .card.live {
            border-color: var(--live);
            box-shadow: 0 0 0 1px rgba(255,77,66,.35), 0 0 18px rgba(255,77,66,.18);
        }

        .g-team { display: flex; align-items: center; gap: 10px; padding-right: 12px; min-height: 48px; }
        .g-team + .g-team { border-top: 1px solid var(--line-soft); }
        .g-team.lose { opacity: .45; }

        /* --tc / --tc2 / --tc-text は JS でチームカラーから設定 */
        .g-chip {
            width: 48px; align-self: stretch; flex-shrink: 0;
            display: grid; place-items: center;
            background: var(--tc, var(--surface2));
            box-shadow: inset 0 -3px 0 var(--tc2, transparent);
            color: var(--tc-text, #fff);
            font-family: var(--font-score); font-weight: 600; font-size: 13px; letter-spacing: .5px;
        }

        .g-info { flex: 1; min-width: 0; padding: 6px 0; }
        .g-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .g-meta {
            display: flex; flex-wrap: wrap; gap: 0 5px;
            font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
        }
        .g-dot { color: var(--border); }
        .streak { font-weight: 700; }
        .streak.w { color: var(--pos); }
        .streak.l { color: var(--neg); }

        .g-score {
            font-family: var(--font-score); font-weight: 600; font-size: 28px; line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .g-series {
            padding: 4px 12px; font-size: 10.5px; color: var(--muted);
            border-top: 1px solid var(--line-soft);
        }

        .g-foot {
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            padding: 5px 12px; background: var(--surface-deep); border-top: 1px solid var(--line-soft);
            font-family: var(--font-score); font-size: 11.5px; letter-spacing: 1px;
            text-transform: uppercase; color: var(--muted); white-space: pre;
        }
        .g-status.final { color: var(--text-dim); }
        .g-status.live { color: var(--live); }
        .g-status.live::before {
            content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: var(--live); margin-right: 6px; vertical-align: 2px;
            animation: pulse 1.4s ease-in-out infinite;
        }
        .g-box { transition: color .15s; }
        .card.clickable:hover .g-box { color: var(--accent); }

        @keyframes pulse { 50% { opacity: .25; } }
        @media (prefers-reduced-motion: reduce) {
            .g-status.live::before { animation: none; }
            .card.clickable:hover { transform: none; }
        }

        /* ステータス帯（ボックススコアのモーダルで使用） */
        .status {
            text-align: center;
            font-family: var(--font-score);
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 3px 0;
            border-radius: 4px;
            margin-bottom: 14px;
            white-space: pre;
        }
        .status-final { background: var(--surface2); color: var(--text-dim); }
        .status-live  { background: rgba(255,77,66,.14); color: var(--live); }

        /* ─── Conf sub-tabs ─── */
        .conf-tabs { display: flex; gap: 8px; margin-bottom: 20px; }

        .conf-btn {
            padding: 6px 22px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.15s;
            text-decoration: none;
        }

        .conf-btn.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

        .conf-panel { display: none; }
        .conf-panel.active { display: block; }

        /* ─── Standings table ─── */
        .standings-wrap { overflow-x: auto; }

        .st-table { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }

        .st-table th {
            color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: 0.5px;
            padding: 7px 10px; text-align: right; border-bottom: 2px solid var(--border);
        }

        .st-table th:nth-child(1) { text-align: center; width: 30px; }
        .st-table th:nth-child(2) { text-align: left; }

        .st-table td {
            padding: 8px 10px; text-align: right;
            border-bottom: 1px solid var(--line-soft);
        }

        .st-table td:nth-child(1) { text-align: center; color: var(--muted); font-size: 11px; }
        .st-table td:nth-child(2) { text-align: left; }

        .st-team { display: flex; align-items: center; gap: 8px; }

        .st-logo { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }

        .st-abbr { font-weight: 700; }

        .st-table tr.edge-playoff td { border-bottom: 2px solid var(--accent); }
        .st-table tr.edge-playin td  { border-bottom: 1px dashed var(--border); }

        /* ─── Standings + Lottery side-by-side ─── */
        .standings-lottery-wrap {
            display: flex;
            gap: 28px;
            align-items: flex-start;
        }

        .standings-col { flex: 1; min-width: 0; }

        /* ─── Lottery section ─── */
        .lottery-section {
            flex: 1;
            min-width: 0;
        }

        .lottery-section h3 {
            font-family: var(--font-score); font-size: 17px; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 20px;
        }

        .lottery-sub { font-size: 11px; color: var(--muted); margin-top: 12px; }

        .lt-table { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }

        .lt-table th {
            color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: 0.5px;
            padding: 7px 10px; text-align: right; border-bottom: 2px solid var(--border);
        }

        .lt-table th:nth-child(1) { text-align: center; width: 30px; }
        .lt-table th:nth-child(2) { text-align: left; }

        .lt-table td {
            padding: 8px 10px; text-align: right;
            border-bottom: 1px solid var(--line-soft);
        }

        .lt-table td:nth-child(1) { text-align: center; color: var(--muted); font-size: 11px; }
        .lt-table td:nth-child(2) { text-align: left; }

        .lt-odds { color: var(--pos); font-weight: 700; }
        .lt-odds-dim { color: var(--muted); font-weight: 600; }
        .playin-mark { color: var(--muted); font-size: 10px; margin-left: 2px; }
        .lottery-note { font-size: 10.5px; color: var(--muted); margin-top: 12px; line-height: 1.6; }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .standings-lottery-wrap { flex-direction: column; align-items: stretch; }
            .lottery-section { border-top: 1px solid var(--border); padding-top: 28px; margin-top: 28px; }
            #lottery-list { overflow-x: auto; }
        }

        @media (max-width: 600px) {
            .section-header { flex-wrap: wrap; gap: 8px; }
            .conf-tabs {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                flex-wrap: nowrap;
            }
            .conf-tabs::-webkit-scrollbar { display: none; }
            .conf-btn { white-space: nowrap; flex-shrink: 0; }
        }

        @media (max-width: 480px) {
            .games-grid { grid-template-columns: 1fr; }
            .tab-btn { padding: 9px 14px; font-size: 13px; }
            .conf-btn { font-size: 12px; padding: 5px 14px; }
        }

        /* ─── Games layout (左: 試合一覧 / 右: Top Players・Injury) ─── */
        .games-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .games-main { flex: 1 1 0; min-width: 0; }
        .games-side { flex: 0 0 360px; min-width: 0; }

        .games-main .games-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .top-players-col {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .tp-subtitle {
            font-size: 10px;
            color: var(--muted);
            background: var(--surface2);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .tp-filter { gap: 6px; margin: 0 14px 10px; flex-wrap: wrap; }
        .tp-filter .conf-btn { padding: 4px 12px; font-size: 12px; }

        .tp-item {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--line-soft);
            box-shadow: inset 3px 0 0 var(--tc, transparent);
        }

        .tp-item:last-child { border-bottom: none; }

        .tp-rank {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            background: var(--surface2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-score);
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            margin-top: 3px;
        }

        .tp-item:nth-child(-n+3) .tp-rank { background: var(--accent); color: var(--on-accent); }

        .tp-photo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--surface2);
            border: 1px solid var(--border);
        }

        .tp-photo-placeholder {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
        }

        .tp-body { flex: 1; min-width: 0; }

        .tp-name-row {
            display: flex;
            align-items: baseline;
            gap: 5px;
            margin-bottom: 2px;
        }

        .tp-name {
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tp-team { font-size: 10px; color: var(--muted); flex-shrink: 0; }

        .tp-main-stats {
            display: flex;
            align-items: baseline;
            gap: 3px;
            margin-bottom: 5px;
        }

        .tp-pts-val { font-family: var(--font-score); font-size: 19px; font-weight: 600; line-height: 1; color: var(--accent); }
        .tp-reb-val, .tp-ast-val { font-family: var(--font-score); font-size: 14px; font-weight: 500; color: var(--text); }
        .tp-stat-sep { font-size: 10px; color: var(--border); margin: 0 2px; }
        .tp-stat-lbl { font-size: 9px; color: var(--muted); }

        .tp-total-badge {
            margin-left: 5px;
            font-size: 10px;
            font-weight: 700;
            color: var(--accent);
            background: rgba(245,183,0,0.12);
            padding: 1px 6px;
            border-radius: 8px;
        }

        .tp-detail-row { display: flex; flex-wrap: wrap; gap: 3px; }

        .tp-chip {
            font-size: 9.5px;
            color: var(--muted);
            background: var(--surface2);
            padding: 1px 5px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .tp-chip strong { color: var(--text-dim); }

        .injury-players-col {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .ip-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 14px;
            border-bottom: 1px solid var(--line-soft);
        }
        .ip-item:last-child { border-bottom: none; }

        .ip-photo {
            width: 30px; height: 30px;
            border-radius: 50%; object-fit: cover; flex-shrink: 0;
            background: var(--surface2); border: 1px solid var(--border);
        }
        .ip-photo-placeholder {
            width: 30px; height: 30px;
            border-radius: 50%; flex-shrink: 0;
            background: var(--surface2); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: var(--muted);
        }

        .ip-body { flex: 1; min-width: 0; }
        .ip-name-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 1px; }
        .ip-name {
            font-size: 11.5px; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ip-team { font-size: 10px; color: var(--muted); flex-shrink: 0; }
        .ip-reason { font-size: 10px; color: var(--muted); }

        .ip-status {
            flex-shrink: 0; font-size: 10px; font-weight: 800;
            padding: 2px 6px; border-radius: 5px; letter-spacing: 0.5px;
        }
        .ip-out  { background: rgba(255,77,66,0.14);  color: var(--live); }
        .ip-q    { background: rgba(255,193,7,0.15);   color: #ffc107; }
        .ip-d    { background: rgba(255,152,0,0.15);   color: #ff9800; }
        .ip-dtd  { background: rgba(122,133,163,0.15); color: var(--muted); }

        @media (max-width: 1060px) {
            .games-layout { flex-direction: column; align-items: stretch; }
            .games-main, .games-side { flex: none; width: 100%; }
        }

        @media (max-width: 700px) {
            .games-main .games-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .games-main .games-grid { grid-template-columns: 1fr; }
        }

        /* ─── Mobile: Top 10 / Injury をメインタブに分離 ─── */
        .tab-btn.mobile-only { display: none; }
        @media (max-width: 768px) {
            .tab-btn.mobile-only { display: inline-block; }
            .tabs-nav { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
            .tabs-nav::-webkit-scrollbar { display: none; }
            .tab-btn { white-space: nowrap; flex-shrink: 0; }
            #tab-games[data-view="games"] .games-side,
            #tab-games[data-view="top"] .games-main,
            #tab-games[data-view="top"] .injury-players-wrap,
            #tab-games[data-view="injury"] .games-main,
            #tab-games[data-view="injury"] .top-players-wrap { display: none; }
        }

        /* ─── Box score modal ─── */
        .box-modal {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.7);
            align-items: center; justify-content: center; padding: 16px;
        }
        .box-modal.open { display: flex; }
        .box-modal-dialog {
            position: relative; width: 100%; max-width: 760px; max-height: 90vh;
            overflow-y: auto; background: var(--surface);
            border: 1px solid var(--border); border-radius: 10px;
            padding: 20px 20px 24px;
        }
        .box-modal-close {
            position: absolute; top: 10px; right: 12px;
            background: none; border: none; color: var(--muted);
            font-size: 26px; line-height: 1; cursor: pointer; padding: 4px 8px;
        }
        .box-modal-close:hover { color: var(--text); }
        .box-modal .status { margin: 0 36px 16px; }
        .box-scoreline { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 18px; color: inherit; text-decoration: none; }
        .box-scoreline:hover .box-score { color: var(--accent); }
        .box-team { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: .6; }
        .box-team.winner, .box-modal .status-live ~ .box-scoreline .box-team { opacity: 1; }
        .box-team img { width: 52px; height: 52px; object-fit: contain; }
        .box-team-abbr { font-family: var(--font-score); font-size: 14px; font-weight: 600; letter-spacing: 1px; }
        .box-score { font-family: var(--font-score); font-size: 34px; font-weight: 600; display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
        .box-score span { color: var(--muted); font-weight: 400; }
        .box-team-tabs { margin: 18px 0 10px; }
        .box-team-panel { display: none; }
        .box-team-panel.active { display: block; }
        .box-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .box-table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
        .box-table th, .box-table td { padding: 6px 7px; text-align: center; border-bottom: 1px solid var(--border); }
        .box-table th { color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .5px; }
        .box-table .box-name {
            text-align: left; position: sticky; left: 0; background: var(--surface);
            font-weight: 600; min-width: 120px;
        }
        .box-player-link { color: inherit; text-decoration: none; }
        .box-player-link:hover { color: var(--accent); text-decoration: underline; }
        /* Team Stats: away(青) / home(橙) の比率バー */
        .box-modal { --ts-away: #3987e5; --ts-home: #d95926; }
        .ts-legend { display: flex; justify-content: space-between; margin: 4px 2px 12px; font-size: 12px; font-weight: 700; color: var(--text-dim); }
        .ts-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .ts-sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
        .ts-sw.a, .ts-a { background: var(--ts-away); }
        .ts-sw.h, .ts-h { background: var(--ts-home); }
        .ts-group { color: var(--text-dim); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
            margin: 14px 0 2px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
        .ts-legend + .ts-group { margin-top: 0; }
        .ts-group small { color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 6px; }
        .ts-row { padding: 7px 2px; border-bottom: 1px solid var(--line-soft); }
        .ts-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline; gap: 8px; }
        .ts-row .ts-head + * { margin-top: 5px; }
        .ts-lbl { color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; text-align: center; }
        .ts-val { font-family: var(--font-score); font-size: 15px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
        .ts-val.right { text-align: right; }
        .ts-val.lead { color: var(--text); font-weight: 600; }
        .ts-val small { font-family: inherit; font-size: 11px; color: var(--muted); margin: 0 4px; }
        /* 件数: 両チームの比率を1本のバーで */
        .ts-bar { display: flex; gap: 2px; height: 6px; }
        .ts-bar span { min-width: 0; }
        .ts-bar .ts-a { border-radius: 4px 0 0 4px; }
        .ts-bar .ts-h { border-radius: 0 4px 4px 0; }
        .ts-bar.empty span { opacity: .3; }
        /* 率: 中央から左右に 0〜100% の物差しで */
        .ts-rate { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; height: 6px; }
        .ts-track { background: var(--surface2); display: flex; }
        .ts-track:first-child { justify-content: flex-end; border-radius: 4px 0 0 4px; }
        .ts-track:last-child { border-radius: 0 4px 4px 0; }
        .ts-rate .ts-a { border-radius: 4px 0 0 4px; }
        .ts-rate .ts-h { border-radius: 0 4px 4px 0; }
        .box-table th.box-adv { color: var(--accent); }
        .box-pos { color: var(--muted); font-size: 10px; margin-left: 4px; font-weight: 400; }
        .box-pts { font-weight: 800; color: var(--accent); }
        .box-sep td {
            text-align: left; color: var(--muted); font-size: 10px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; background: var(--surface2);
            position: sticky; left: 0;
        }
        .box-dnp td { color: var(--muted); }
        .box-dnp td:not(.box-name) { text-align: left; font-style: italic; }

<script>
const ESPN_SCOREBOARD = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
const ESPN_STANDINGS  = 'https://site.api.espn.com/apis/v2/sports/basketball/nba/standings';

const rankMap = {};
const standingsData = { East: [], West: [] };
let isPlayoffMode = false;

// ESPN略称 → 標準3文字略称
const ABBR_MAP = { NY: 'NYK', GS: 'GSW', NO: 'NOP', SA: 'SAS', UTAH: 'UTA' };
function normAbbr(a) { return ABBR_MAP[a] || a; }

// NBA lottery odds for #1 pick (2019 reform, 14 teams)
const LOTTERY_ODDS = [
    [14.0, 13.4, 12.7, 12.0],
    [14.0, 13.4, 12.7, 12.0],
    [14.0, 13.4, 12.7, 12.0],
    [12.5, 12.3, 11.9, 10.0],
    [10.5, 10.5, 10.5,  8.1],
    [ 9.0,  9.1,  9.2,  6.7],
    [ 7.5,  7.7,  7.8,  5.4],
    [ 6.0,  6.2,  6.3,  4.3],
    [ 4.5,  4.7,  4.9,  3.2],
    [ 3.0,  3.2,  3.3,  2.3],
    [ 2.0,  2.1,  2.3,  1.5],
    [ 1.5,  1.6,  1.8,  1.1],
    [ 1.0,  1.1,  1.2,  0.7],
    [ 0.5,  0.6,  0.6,  0.3],
];

/* ── ET date helpers (America/New_York, handles DST automatically) ── */
function etDateStr(utcDate) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' })
        .format(utcDate).replace(/-/g, '');
}

function etDateShift(utcDate, days) {
    const s = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(utcDate);
    const [y, m, d] = s.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + days, 17, 0, 0));
}

function fmtJstDate(utcDate) {
    const datePart = new Intl.DateTimeFormat('ja-JP', {
        year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Tokyo'
    }).format(utcDate);
    const weekday = new Intl.DateTimeFormat('en-US', {
        weekday: 'short', timeZone: 'Asia/Tokyo'
    }).format(utcDate);
    return `${datePart} (${weekday})`;
}

/* ── Tab / conf switching ── */
function switchTab(tab) {
    // Top 10 / Injury はスマホ用タブ。中身は Games パネル内の右カラムを表示切替する
    const panel = (tab === 'top' || tab === 'injury') ? 'games' : tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${panel}`));
    document.getElementById('tab-games').dataset.view = tab;
}

function switchConf(conf) {
    document.querySelectorAll('.conf-btn[data-conf]').forEach(b => b.classList.toggle('active', b.dataset.conf === conf));
    document.querySelectorAll('.conf-panel').forEach(p => p.classList.toggle('active', p.id === `conf-${conf}`));
}

document.querySelectorAll('.tab-btn').forEach(btn =>
    btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

// PC幅に戻ったらスマホ専用タブは存在しないので Games に戻す
window.matchMedia('(min-width: 769px)').addEventListener('change', e => {
    const view = document.getElementById('tab-games').dataset.view;
    if (e.matches && (view === 'top' || view === 'injury')) switchTab('games');
});
document.querySelectorAll('.conf-btn[data-conf]').forEach(btn =>
    btn.addEventListener('click', () => switchConf(btn.dataset.conf)));
document.getElementById('refresh-btn').addEventListener('click', () => init());

/* ── API ── */
async function loadStandings() {
    standingsData.East = [];
    standingsData.West = [];
    try {
        const d = await fetch(ESPN_STANDINGS).then(r => r.json());
        (d.children || []).forEach(conf => {
            const isEast = conf.name.toLowerCase().includes('east');
            const confKey = isEast ? 'East' : 'West';
            (conf.standings?.entries || []).forEach(e => {
                const get = name => e.stats?.find(s => s.name === name)?.displayValue ?? '';
                const rank = parseInt(get('playoffSeed'));
                if (!rank) return;
                rankMap[e.team.id] = { rank, conf: confKey, l10: get('Last Ten Games'), streak: get('streak') };
                standingsData[confKey].push({
                    rank,
                    id:     e.team.id,
                    abbr:   normAbbr(e.team.abbreviation || ''),
                    logo:   e.team.logos?.[0]?.href || '',
                    wins:   parseInt(get('wins'))   || 0,
                    losses: parseInt(get('losses')) || 0,
                    pct:    get('winPercent'),
                    gb:     get('gamesBehind'),
                    home:   get('Home'),
                    road:   get('Road'),
                    conf:   get('vs. Conf.'),
                    l10:    get('Last Ten Games'),
                    streak: get('streak'),
                });
            });
            standingsData[confKey].sort((a, b) => a.rank - b.rank);
        });
    } catch (e) { console.warn('standings:', e); }
}

/* ── Standings table render ── */
function renderStandingsTable(conf) {
    const el = document.getElementById(`conf-${conf.toLowerCase()}`);
    const teams = standingsData[conf];
    if (!el || !teams.length) return;

    const rows = teams.map(t => {
        let cls = '';
        if (t.rank === 6)  cls = 'edge-playoff';
        if (t.rank === 10) cls = 'edge-playin';

        return `<tr class="${cls}">
            <td>${t.rank}</td>
            <td><div class="st-team">
                <img class="st-logo" src="${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'">
                <span class="st-abbr">${t.abbr}</span>
            </div></td>
            <td>${t.wins}</td>
            <td>${t.losses}</td>
            <td>${t.pct}</td>
            <td>${t.gb || '-'}</td>
            <td>${t.home}</td>
            <td>${t.road}</td>
            <td>${t.conf}</td>
            <td>${t.l10}</td>
            <td>${t.streak}</td>
        </tr>`;
    }).join('');

    el.innerHTML = `
        <div class="standings-wrap">
            <table class="st-table">
                <thead><tr>
                    <th>#</th><th>Team</th>
                    <th>W</th><th>L</th><th>PCT</th><th>GB</th>
                    <th>Home</th><th>Away</th><th>Conf</th><th>L10</th><th>Strk</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

/* ── Lottery render ── */
function renderLottery() {
    const el = document.getElementById('lottery-list');
    if (!el) return;

    // 全30チームを成績順（勝率昇順）に並べ、プレーオフ確定(rank 1-6)以外を抽出
    const all = [...standingsData.West, ...standingsData.East]
        .filter(t => t.rank > 6)
        .sort((a, b) => {
            const pctA = a.wins / (a.wins + a.losses || 1);
            const pctB = b.wins / (b.wins + b.losses || 1);
            if (pctA !== pctB) return pctA - pctB; // 勝率昇順（悪い順）
            return b.losses - a.losses;             // 負け数が多い方が上
        })
        .slice(0, 14); // 上位14チーム

    if (!all.length) { el.innerHTML = '<div class="msg">No data</div>'; return; }

    const rows = all.map((t, i) => {
        const odds    = LOTTERY_ODDS[i] ?? ['-','-','-','-'];
        const isPlayin = t.rank <= 10;
        return `<tr>
            <td>${i + 1}</td>
            <td><div class="st-team">
                <img class="st-logo" src="${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'">
                <span class="st-abbr">${t.abbr}</span>
                ${isPlayin ? '<span class="playin-mark">*</span>' : ''}
            </div></td>
            <td>${t.wins}-${t.losses}</td>
            <td>${t.pct}</td>
            <td class="lt-odds">${odds[0]}%</td>
            <td class="lt-odds">${odds[1]}%</td>
            <td class="lt-odds">${odds[2]}%</td>
            <td class="lt-odds">${odds[3]}%</td>
            <td class="lt-odds lt-odds-dim">${(100 - odds[0] - odds[1] - odds[2] - odds[3]).toFixed(1)}%</td>
        </tr>`;
    }).join('');

    el.innerHTML = `
        <table class="lt-table">
            <thead><tr>
                <th>#</th><th>Team</th><th>Record</th><th>PCT</th><th>#1</th><th>#2</th><th>#3</th><th>#4</th><th>#5+</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
        <div class="lottery-note">
            * Play-In teams (may enter lottery depending on results)<br>
            Projections based on current standings. Final order set after season ends.<br>
            Lottery odds per NBA official methodology (2019 reform). Reference:
            <a href="https://www.tankathon.com/pick_odds" target="_blank"
               style="color:var(--muted);text-decoration:underline">tankathon.com</a>
        </div>`;
}

/* ── Scoreboard ── */
async function fetchEvents(etDate) {
    const res = await fetch(`${ESPN_SCOREBOARD}?dates=${etDateStr(etDate)}&limit=25`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return (await res.json())?.events || [];
}

function hasResults(events) {
    return events.some(e => e.status.type.completed || e.status.type.state === 'in');
}

/* ── Streak helpers ── */
function streakBadge(streak) {
    if (!streak) return '';
    const m = streak.match(/^([WL])\s*(\d+)/);
    if (!m) return '';
    return `<span class="streak ${m[1] === 'W' ? 'w' : 'l'}">${m[1]}${m[2]}</span>`;
}

// ESPNのチームカラー（"1d428a" 形式）→ カード用CSS変数
function teamColorVars(color, alt) {
    const hex = c => /^[0-9a-f]{6}$/i.test(c || '') ? `#${c}` : null;
    const c1 = hex(color) || '#2a2a31';
    const c2 = hex(alt) || c1;
    const n = parseInt(c1.slice(1), 16);
    const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    return `--tc:${c1};--tc2:${c2};--tc-text:${lum > 0.6 ? '#111' : '#fff'}`;
}

/* ── Game render ── */
function renderGames(events, id) {
    const el = document.getElementById(id);
    if (!events?.length) { el.innerHTML = '<div class="msg">No games</div>'; return; }
    const statusPriority = e => {
        if (e.status.type.state === 'in') return 0;
        if (e.status.type.completed || e.status.type.state === 'post') return 2;
        return 1;
    };
    const sorted = [...events].sort((a, b) => statusPriority(a) - statusPriority(b));
    el.innerHTML = '';
    sorted.forEach(ev => el.appendChild(buildCard(ev)));
}

function buildCard(event) {
    const comp = event.competitions[0];
    const away = comp.competitors.find(c => c.homeAway === 'away') ?? comp.competitors[0];
    const home = comp.competitors.find(c => c.homeAway === 'home') ?? comp.competitors[1];

    const st = event.status;
    const isOver = !!st.type.completed || st.type.state === 'post';
    const isLive = !isOver && st.type.state === 'in';

    const awayScore = away.score != null ? String(away.score) : '';
    const homeScore = home.score != null ? String(home.score) : '';
    const awayNum = parseInt(awayScore);
    const homeNum = parseInt(homeScore);
    const awayWon = isOver && !isNaN(awayNum) && !isNaN(homeNum) && awayNum > homeNum;
    const homeWon = isOver && !isNaN(awayNum) && !isNaN(homeNum) && homeNum > awayNum;

    // Playoff series data
    const series = comp.series;
    const awaySeriesWins = series?.competitors?.find(c => c.id === away.team.id)?.wins ?? 0;
    const homeSeriesWins = series?.competitors?.find(c => c.id === home.team.id)?.wins ?? 0;
    const seriesNote = series
        ? (comp.notes?.find(n => n.headline && /series|game\s+\d+/i.test(n.headline))?.headline || '')
        : '';

    // Game number label (e.g. "Game 5") for playoff status bar
    let gameNumber = '';
    if (isPlayoffMode && series) {
        const allText = [st.type.shortDetail, ...(comp.notes || []).map(n => n.headline || '')].join(' ');
        const m = allText.match(/Game\s+\d+/i);
        if (m) gameNumber = m[0];
    }

    let statusLabel, statusClass;
    if (isOver) {
        statusLabel = (isPlayoffMode && gameNumber) ? `FINAL  •  ${gameNumber}` : 'FINAL';
        statusClass = 'final';
    } else if (isLive) {
        const tag = (isPlayoffMode && gameNumber) ? `  •  ${gameNumber}` : '';
        statusLabel = `LIVE  Q${st.period}  ${st.displayClock}${tag}`;
        statusClass = 'live';
    } else {
        const timeStr = new Date(event.date).toLocaleTimeString('en-US', {
            hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo'
        });
        const tag = (isPlayoffMode && gameNumber) ? `  •  ${gameNumber}` : '';
        statusLabel = `${timeStr} JST${tag}`;
        statusClass = 'sched';
    }

    function info(t, myWins, oppWins) {
        const rk  = rankMap[t.team.id];
        const rec = t.records?.find(r => r.type === 'total') ?? t.records?.[0];
        const base = {
            abbr:  normAbbr(t.team.abbreviation) || t.team.displayName,
            short: t.team.shortDisplayName || t.team.name || t.team.displayName,
            color: t.team.color,
            alt:   t.team.alternateColor
        };
        if (isPlayoffMode && series) {
            return { ...base, record: `${myWins}-${oppWins}`, rank: rk ? `#${rk.rank} Seed` : '', l10: '', streak: '' };
        }
        return {
            ...base,
            record: rec?.summary || '',
            rank:   rk ? `${rk.conf} #${rk.rank}` : '',
            l10:    rk?.l10 || '',
            streak: rk?.streak || ''
        };
    }

    const aw = info(away, awaySeriesWins, homeSeriesWins);
    const hw = info(home, homeSeriesWins, awaySeriesWins);
    const showScore = isOver || isLive;

    function teamRow(d, score, lose) {
        const meta = [d.record, d.rank, d.l10 ? `L10 ${d.l10}` : '', streakBadge(d.streak)]
            .filter(Boolean).join('<span class="g-dot">·</span>');
        return `
        <div class="g-team ${lose ? 'lose' : ''}" style="${teamColorVars(d.color, d.alt)}">
            <span class="g-chip">${d.abbr}</span>
            <div class="g-info">
                <div class="g-name">${d.short}</div>
                ${meta ? `<div class="g-meta">${meta}</div>` : ''}
            </div>
            ${showScore ? `<span class="g-score">${score || '-'}</span>` : ''}
        </div>`;
    }

    const card = document.createElement('div');
    card.className = 'card' + (isLive ? ' live' : '');
    if (showScore) {
        card.classList.add('clickable');
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.addEventListener('click', () => openBoxScoreModal(event));
        card.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBoxScoreModal(event); }
        });
    }
    card.innerHTML = `
        ${teamRow(aw, awayScore, homeWon)}
        ${teamRow(hw, homeScore, awayWon)}
        ${(isPlayoffMode && seriesNote) ? `<div class="g-series">${seriesNote}</div>` : ''}
        <div class="g-foot">
            <span class="g-status ${statusClass}">${statusLabel}</span>
            ${showScore ? '<span class="g-box">Box Score ›</span>' : ''}
        </div>`;
    return card;
}

/* ── Box Score / Top Players ── */
// 終了済み試合のみキャッシュ（ライブ中は毎回取り直す）
const boxScoreCache = new Map();

async function fetchBoxScore(eventId) {
    if (boxScoreCache.has(eventId)) return boxScoreCache.get(eventId);
    try {
        const res = await fetch(
            `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${eventId}`
        );
        if (!res.ok) return null;
        const data = await res.json();
        if (data?.header?.competitions?.[0]?.status?.type?.completed) boxScoreCache.set(eventId, data);
        return data;
    } catch { return null; }
}

/* ── Box Score modal ── */
const BOX_COLS = [
    ['MIN', 'MIN', 'min', 'minutes'],
    ['PTS', 'PTS', 'pts', 'points'],
    ['REB', 'REB', 'reb', 'rebounds'],
    ['AST', 'AST', 'ast', 'assists'],
    ['FG',  'FG',  'fg',  'fieldGoalsMade-fieldGoalsAttempted'],
    ['3PT', '3PT', '3pt', 'threePointFieldGoalsMade-threePointFieldGoalsAttempted'],
    ['FT',  'FT',  'ft',  'freeThrowsMade-freeThrowsAttempted'],
    ['STL', 'STL', 'stl', 'steals'],
    ['BLK', 'BLK', 'blk', 'blocks'],
    ['TO',  'TO',  'to',  'TOV', 'turnovers'],
    ['+/-', '+/-', 'plusMinus'],
];

// 追加指標（ボックススコアの数値から算出）
const ADV_COLS = ['TS%', 'eFG%', 'USG%', 'PIE'];
const BOX_RAW = {
    min: ['MIN', 'minutes'], pts: ['PTS', 'points'],
    fg: ['FG', 'fieldGoalsMade-fieldGoalsAttempted'],
    tp: ['3PT', 'threePointFieldGoalsMade-threePointFieldGoalsAttempted'],
    ft: ['FT', 'freeThrowsMade-freeThrowsAttempted'],
    oreb: ['OREB', 'offensiveRebounds'], dreb: ['DREB', 'defensiveRebounds'],
    ast: ['AST', 'assists'], stl: ['STL', 'steals'], blk: ['BLK', 'blocks'],
    to: ['TO', 'turnovers', 'TOV'], pf: ['PF', 'fouls'],
};

// 選手1行を数値に変換（出場していなければ null）
function parseBoxLine(sg, a) {
    if (a.didNotPlay || !a.stats?.length) return null;
    const names = sg.names || [], keys = sg.keys || [];
    const raw = k => { const i = getStatIdx(names, keys, ...BOX_RAW[k]); return i >= 0 ? String(a.stats[i] ?? '') : ''; };
    const num = v => parseInt(v) || 0;
    const pair = v => { const [m, x] = v.split('-'); return [num(m), num(x)]; };
    const [fgm, fga] = pair(raw('fg')), [tpm, tpa] = pair(raw('tp')), [ftm, fta] = pair(raw('ft'));
    return {
        min: num(raw('min')), pts: num(raw('pts')), fgm, fga, tpm, tpa, ftm, fta,
        oreb: num(raw('oreb')), dreb: num(raw('dreb')), ast: num(raw('ast')),
        stl: num(raw('stl')), blk: num(raw('blk')), to: num(raw('to')), pf: num(raw('pf')),
    };
}

const sumBoxLines = lines => lines.reduce((t, l) => {
    Object.keys(l).forEach(k => { t[k] = (t[k] || 0) + l[k]; });
    return t;
}, {});

const teamBoxTotals = teamData => {
    const sg = teamData.statistics?.[0];
    return sumBoxLines((sg?.athletes || []).map(a => parseBoxLine(sg, a)).filter(Boolean));
};

const pieNum = l => l.pts + l.fgm + l.ftm - l.fga - l.fta + l.dreb + 0.5 * l.oreb
    + l.ast + l.stl + 0.5 * l.blk - l.pf - l.to;

// tm: 自チーム合計 / game: 両チーム合計。分母が 0 の指標は null
function advStats(l, tm, game) {
    const pct = (n, d) => d > 0 ? (100 * n / d).toFixed(1) : null;
    const tsa = l.fga + 0.44 * l.fta;
    const tmPoss = tm.fga + 0.44 * tm.fta + tm.to;
    const gamePie = pieNum(game);
    return [
        pct(l.pts, 2 * tsa),
        pct(l.fgm + 0.5 * l.tpm, l.fga),
        l.min > 0 ? pct((tsa + l.to) * (tm.min / 5), l.min * tmPoss) : null,
        gamePie ? (100 * pieNum(l) / gamePie).toFixed(1) : null,
    ];
}

// Team Stats（boxscore.teams の statistics から）
// m: 自チーム / o: 相手チームの値を返す関数（数値は n, 表示用文字列は v）
// type: split = 件数を1本のバーで比率表示 / rate = 0〜100% の率 / plain = 数値のみ / shared = 両チーム共通の値
const tsPct = (n, d) => d > 0 ? 100 * n / d : null;
const tsFmt = x => x == null ? '-' : `${x.toFixed(1)}%`;
const TEAM_STATS = [
    ['Shooting', '', [
        { label: 'FG',  type: 'rate', num: m => m.n('fieldGoalPct'), val: m => m.v('fieldGoalsMade-fieldGoalsAttempted'), sub: m => `${m.v('fieldGoalPct')}%` },
        { label: '3PT', type: 'rate', num: m => m.n('threePointFieldGoalPct'), val: m => m.v('threePointFieldGoalsMade-threePointFieldGoalsAttempted'), sub: m => `${m.v('threePointFieldGoalPct')}%` },
        { label: 'FT',  type: 'rate', num: m => m.n('freeThrowPct'), val: m => m.v('freeThrowsMade-freeThrowsAttempted'), sub: m => `${m.v('freeThrowPct')}%` },
    ]],
    ['Rebounding', '', [
        { label: 'REB', type: 'split', num: m => m.n('totalRebounds'), val: m => m.v('totalRebounds'),
          sub: (m, o) => tsFmt(tsPct(m.n('totalRebounds'), m.n('totalRebounds') + o.n('totalRebounds'))) },
        { label: 'OREB%', type: 'rate', num: (m, o) => tsPct(m.n('offensiveRebounds'), m.n('offensiveRebounds') + o.n('defensiveRebounds')),
          val: (m, o) => tsFmt(tsPct(m.n('offensiveRebounds'), m.n('offensiveRebounds') + o.n('defensiveRebounds'))), sub: m => `OR ${m.v('offensiveRebounds')}` },
        { label: 'DREB%', type: 'rate', num: (m, o) => tsPct(m.n('defensiveRebounds'), m.n('defensiveRebounds') + o.n('offensiveRebounds')),
          val: (m, o) => tsFmt(tsPct(m.n('defensiveRebounds'), m.n('defensiveRebounds') + o.n('offensiveRebounds'))), sub: m => `DR ${m.v('defensiveRebounds')}` },
    ]],
    ['Ball Control', '', [
        { label: 'AST', type: 'split', num: m => m.n('assists') },
        { label: 'STL', type: 'split', num: m => m.n('steals') },
        { label: 'BLK', type: 'split', num: m => m.n('blocks') },
        { label: 'TO',  type: 'plain', num: m => m.n('turnovers'), lowerBetter: true },
        { label: 'PF',  type: 'plain', num: m => m.n('fouls'), lowerBetter: true },
    ]],
    ['Scoring', '', [
        { label: 'Paint Pts',  type: 'split', num: m => m.n('pointsInPaint') },
        { label: 'Fast Break', type: 'split', num: m => m.n('fastBreakPoints') },
        // ESPN の turnoverPoints は「自チームのTOから失った点」なので相手側の値を使う
        { label: 'Pts off TO', type: 'split', num: (m, o) => o.n('turnoverPoints'), has: (m, o) => o.v('turnoverPoints') !== '' },
    ]],
    ['Game Flow', '', [
        { label: 'Largest Lead', type: 'split', num: m => m.n('largestLead') },
        { label: 'Lead Changes', type: 'shared', num: m => m.n('leadChanges'), has: m => m.v('leadChanges') !== '' },
    ]],
];

function boxTeamStats(awayTeam, homeTeam) {
    if (!awayTeam?.statistics?.length || !homeTeam?.statistics?.length) return '<div class="msg">No team stats available</div>';
    const acc = t => {
        const v = name => t.statistics.find(x => x.name === name)?.displayValue ?? '';
        return { v, n: name => parseFloat(v(name)) || 0 };
    };
    const A = acc(awayTeam), H = acc(homeTeam);
    const abA = normAbbr(awayTeam.team?.abbreviation || ''), abH = normAbbr(homeTeam.team?.abbreviation || '');

    const row = r => {
        const nA = r.num(A, H), nH = r.num(H, A);
        const vA = r.val ? r.val(A, H) : String(nA), vH = r.val ? r.val(H, A) : String(nH);
        const subA = r.sub ? r.sub(A, H) : '', subH = r.sub ? r.sub(H, A) : '';
        const tip = `${r.label}: ${abA} ${vA}${subA ? ` (${subA})` : ''} / ${abH} ${vH}${subH ? ` (${subH})` : ''}`;
        if (r.type === 'shared') {
            return `<div class="ts-row" title="${tip}"><div class="ts-head">
                <span></span><span class="ts-lbl">${r.label} <span class="ts-val lead">${vA}</span></span><span></span>
            </div></div>`;
        }
        const leadA = nA != null && nH != null && (r.lowerBetter ? nA < nH : nA > nH);
        const leadH = nA != null && nH != null && (r.lowerBetter ? nH < nA : nH > nA);
        let chart = '';
        if (r.type === 'split') {
            const empty = !(nA + nH > 0);
            chart = `<div class="ts-bar ${empty ? 'empty' : ''}">
                <span class="ts-a" style="flex:${empty ? 1 : nA} 1 0"></span><span class="ts-h" style="flex:${empty ? 1 : nH} 1 0"></span>
            </div>`;
        } else if (r.type === 'rate') {
            const w = x => Math.max(0, Math.min(100, x ?? 0));
            chart = `<div class="ts-rate">
                <div class="ts-track"><span class="ts-a" style="width:${w(nA)}%"></span></div>
                <div class="ts-track"><span class="ts-h" style="width:${w(nH)}%"></span></div>
            </div>`;
        }
        return `<div class="ts-row" title="${tip}">
            <div class="ts-head">
                <span class="ts-val ${leadA ? 'lead' : ''}">${vA}${subA ? `<small>${subA}</small>` : ''}</span>
                <span class="ts-lbl">${r.label}</span>
                <span class="ts-val right ${leadH ? 'lead' : ''}">${subH ? `<small>${subH}</small>` : ''}${vH}</span>
            </div>${chart}
        </div>`;
    };

    const groups = TEAM_STATS.map(([title, note, rows]) => {
        const html = rows.filter(r => r.has ? r.has(A, H) : true).map(row).join('');
        return html ? `<div class="ts-group">${title}${note ? `<small>${note}</small>` : ''}</div>${html}` : '';
    }).join('');

    return `<div class="ts-legend">
        <span><i class="ts-sw a"></i>${abA}</span><span>${abH}<i class="ts-sw h"></i></span>
    </div>${groups}`;
}

function closeBoxScoreModal() {
    document.getElementById('box-modal').classList.remove('open');
    document.body.style.overflow = '';
}

function switchBoxTeam(idx) {
    document.querySelectorAll('.box-team-btn').forEach(b => b.classList.toggle('active', +b.dataset.idx === idx));
    document.querySelectorAll('.box-team-panel').forEach(p => p.classList.toggle('active', +p.dataset.idx === idx));

// ESPN の links 配列から rel に指定キーを含む href を取り出す
const espnLink = (links, rel) => (links || []).find(l => l.rel?.includes(rel))?.href || '';
const espnGameUrl = event => espnLink(event.links, 'summary') || `https://www.espn.com/nba/game/_/gameId/${event.id}`;
const espnPlayerUrl = athlete => espnLink(athlete?.links, 'playercard')
    || (athlete?.id ? `https://www.espn.com/nba/player/_/id/${athlete.id}` : '');

function boxTeamTable(teamData, gameTot) {
    const sg = teamData.statistics?.[0];
    if (!sg?.athletes?.length) return '<div class="msg">No stats available</div>';
    const tmTot = teamBoxTotals(teamData);
    const nCols = BOX_COLS.length + ADV_COLS.length;
    const names = sg.names || [];
    const keys  = sg.keys  || [];
    const idx = BOX_COLS.map(([, ...cands]) => getStatIdx(names, keys, ...cands));

    const row = a => {
        const pos = a.athlete?.position?.abbreviation || '';
        const name = a.athlete?.shortName || a.athlete?.displayName || '—';
        const url  = espnPlayerUrl(a.athlete);
        const nameCell = `<td class="box-name">${url ? `<a class="box-player-link" href="${url}" target="_blank" rel="noopener">${name}</a>` : name}
            ${pos ? `<span class="box-pos">${pos}</span>` : ''}</td>`;
        if (a.didNotPlay || !a.stats?.length) {
            return `<tr class="box-dnp">${nameCell}<td colspan="${nCols}">${a.reason || 'DNP'}</td></tr>`;
        }
        const cells = idx.map((i, c) => {
            const v = i >= 0 ? (a.stats[i] ?? '-') : '-';
            return `<td class="${BOX_COLS[c][0] === 'PTS' ? 'box-pts' : ''}">${v}</td>`;
        }).join('');
        const adv = advStats(parseBoxLine(sg, a), tmTot, gameTot).map(v => `<td>${v ?? '-'}</td>`).join('');
        return `<tr>${nameCell}${cells}${adv}</tr>`;
    };

    const starters = sg.athletes.filter(a => a.starter);
    const bench    = sg.athletes.filter(a => !a.starter);
    const head = `<tr><th class="box-name">Player</th>${BOX_COLS.map(c => `<th>${c[0]}</th>`).join('')}${ADV_COLS.map(c => `<th class="box-adv">${c}</th>`).join('')}</tr>`;
    const sep  = label => `<tr class="box-sep"><td colspan="${nCols + 1}">${label}</td></tr>`;

    return `<div class="box-table-wrap"><table class="box-table">
        <thead>${head}</thead>
        <tbody>
            ${starters.length ? sep('Starters') + starters.map(row).join('') : ''}
            ${bench.length ? sep('Bench') + bench.map(row).join('') : ''}
        </tbody>
    </table></div>`;
}

async function openBoxScoreModal(event) {
    const modal = document.getElementById('box-modal');
    const body  = document.getElementById('box-modal-body');
    const comp  = event.competitions[0];
    const away  = comp.competitors.find(c => c.homeAway === 'away') ?? comp.competitors[0];
    const home  = comp.competitors.find(c => c.homeAway === 'home') ?? comp.competitors[1];
    const st    = event.status;
    const isOver = !!st.type.completed || st.type.state === 'post';
    const statusText = isOver ? 'FINAL' : `● LIVE  Q${st.period}  ${st.displayClock}`;

    const abbr = t => normAbbr(t.team.abbreviation) || t.team.displayName;
    const awayNum = parseInt(away.score), homeNum = parseInt(home.score);

    // クォーター別スコア（OTがあれば列が増える）
    const periods = Math.max(away.linescores?.length || 0, home.linescores?.length || 0);
    const pLabel = i => i < 4 ? `Q${i + 1}` : (i === 4 ? 'OT' : `OT${i - 3}`);
    const lineRow = t => `<tr><td class="box-name">${abbr(t)}</td>
        ${Array.from({ length: periods }, (_, i) => `<td>${t.linescores?.[i]?.value ?? '-'}</td>`).join('')}
        <td class="box-pts">${t.score ?? '-'}</td></tr>`;
    const lineHTML = periods ? `<div class="box-table-wrap"><table class="box-table box-line">
        <thead><tr><th class="box-name"></th>${Array.from({ length: periods }, (_, i) => `<th>${pLabel(i)}</th>`).join('')}<th>T</th></tr></thead>
        <tbody>${lineRow(away)}${lineRow(home)}</tbody>
    </table></div>` : '';

    const teamHead = (t, won) => `<div class="box-team ${won ? 'winner' : ''}">
        <img src="${t.team.logo || ''}" alt="${abbr(t)}">
        <div class="box-team-abbr">${abbr(t)}</div>
    </div>`;

    body.innerHTML = `
        <div class="status ${isOver ? 'status-final' : 'status-live'}">${statusText}</div>
        <a class="box-scoreline" href="${espnGameUrl(event)}" target="_blank" rel="noopener">
            ${teamHead(away, isOver && awayNum > homeNum)}
            <div class="box-score">${away.score ?? '-'}<span>-</span>${home.score ?? '-'}</div>
            ${teamHead(home, isOver && homeNum > awayNum)}
        </a>
        ${lineHTML}
        <div id="box-players"><div class="msg">Loading box score...</div></div>`;

    modal.classList.add('open');
    document.body.style.overflow = 'hidden';

    const data = await fetchBoxScore(event.id);
    const el = document.getElementById('box-players');
    if (!modal.classList.contains('open') || !el) return;
    const teams = data?.boxscore?.players;
    if (!teams?.length) { el.innerHTML = '<div class="msg error">Failed to load box score</div>'; return; }

    // away → home の順に並べる
    const order = [away.team.id, home.team.id];
    teams.sort((a, b) => order.indexOf(a.team?.id) - order.indexOf(b.team?.id));
    const teamTotals = id => data.boxscore.teams?.find(x => x.team?.id === id);
    const gameTot = sumBoxLines(teams.map(teamBoxTotals));

    el.innerHTML = `
        <div class="conf-tabs box-team-tabs">
            <button class="conf-btn box-team-btn" data-idx="0" onclick="switchBoxTeam(0)">Team Stats</button>
            ${teams.map((t, i) => `<button class="conf-btn box-team-btn" data-idx="${i + 1}" onclick="switchBoxTeam(${i + 1})">${normAbbr(t.team?.abbreviation || '')}</button>`).join('')}
        </div>
        <div class="box-team-panel" data-idx="0">${boxTeamStats(teamTotals(away.team.id), teamTotals(home.team.id))}</div>
        ${teams.map((t, i) => `<div class="box-team-panel" data-idx="${i + 1}">${boxTeamTable(t, gameTot)}</div>`).join('')}`;
    switchBoxTeam(0);
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('box-modal').classList.contains('open')) closeBoxScoreModal();
});

function getStatIdx(names, keys, ...candidates) {
    for (const c of candidates) {
        let i = names.indexOf(c);
        if (i >= 0) return i;
        if (keys) { i = keys.indexOf(c); if (i >= 0) return i; }
    }
    return -1;
}

// チームロスターから選手ごとの NBA 経験年数を取得（athleteId → years）
const rosterExpCache = new Map();
function fetchTeamExperience(teamId) {
    if (!rosterExpCache.has(teamId)) {
        rosterExpCache.set(teamId, fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/${teamId}/roster`)
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(d => new Map((d.athletes || [])
                .filter(a => a.experience?.years != null)
                .map(a => [String(a.id), a.experience.years])))
            .catch(() => { rosterExpCache.delete(teamId); return new Map(); }));
    }
    return rosterExpCache.get(teamId);
}

// 新人は years が 0 または 1 で返るため両方 Rookie 扱い
const expClass = years => years == null ? null
    : years <= 1 ? 'rookie' : years === 2 ? 'sophomore' : 'veteran';

let topPlayersAll = [];
let topPlayersFilter = 'all';

async function extractTopPlayers(events) {
    const completed = events.filter(e =>
        e.status.type.completed || e.status.type.state === 'post'
    );
    if (!completed.length) return [];

    const summaries = await Promise.all(completed.map(e => fetchBoxScore(e.id)));
    const teamIds = [...new Set(summaries.flatMap(d => (d?.boxscore?.players || []).map(t => t.team?.id)).filter(Boolean))];
    const expMaps = new Map(await Promise.all(teamIds.map(async id => [id, await fetchTeamExperience(id)])));
    const players = [];

    summaries.forEach(data => {
        if (!data?.boxscore?.players) return;
        data.boxscore.players.forEach(teamData => {
            const teamAbbr = normAbbr(teamData.team?.abbreviation || '');
            const expMap = expMaps.get(teamData.team?.id);
            (teamData.statistics || []).forEach(sg => {
                const names = sg.names || [];
                const keys  = sg.keys  || [];
                const iP   = getStatIdx(names, keys, 'PTS',  'pts');
                const iR   = getStatIdx(names, keys, 'REB',  'reb');
                const iA   = getStatIdx(names, keys, 'AST',  'ast');
                const iFG  = getStatIdx(names, keys, 'FG',   'fg');
                const i3PT = getStatIdx(names, keys, '3PT',  '3pt');
                const iOR  = getStatIdx(names, keys, 'OREB', 'oreb');
                const iDR  = getStatIdx(names, keys, 'DREB', 'dreb');
                const iS   = getStatIdx(names, keys, 'STL',  'stl');
                const iB   = getStatIdx(names, keys, 'BLK',  'blk');
                const iTO  = getStatIdx(names, keys, 'TO',   'to', 'TOV', 'tov');
                const iPF  = getStatIdx(names, keys, 'PF',   'pf');
                const iPM  = getStatIdx(names, keys, '+/-',  'plusMinus');

                (sg.athletes || []).forEach(a => {
                    if (a.didNotPlay) return;
                    const s = a.stats;
                    if (!s?.length) return;
                    const get = i => (i >= 0 && s[i] != null) ? String(s[i]) : '0';
                    const pts = parseInt(get(iP)) || 0;
                    const reb = parseInt(get(iR)) || 0;
                    const ast = parseInt(get(iA)) || 0;
                    if (pts + reb + ast === 0) return;

                    players.push({
                        name:   a.athlete?.displayName || '—',
                        photo:  a.athlete?.headshot?.href || '',
                        team:   teamAbbr,
                        teamColor: teamData.team?.color || '',
                        exp:    expClass(expMap?.get(String(a.athlete?.id))),
                        pts, reb, ast,
                        total:  pts + reb + ast,
                        fg:     get(iFG),
                        threeP: get(i3PT),
                        oreb:   get(iOR),
                        dreb:   get(iDR),
                        stl:    get(iS),
                        blk:    get(iB),
                        tov:    get(iTO),
                        pf:     get(iPF),
                        pm:     get(iPM),
                    });
                });
            });
        });
    });

    return players.sort((a, b) => b.total - a.total);
}

    renderTopPlayers();
}

document.querySelectorAll('.tp-filter .conf-btn').forEach(btn =>

                    <span class="tp-chip">BLK <strong>${p.blk}</strong></span>
                    <span class="tp-chip">TOV <strong>${p.tov}</strong></span>
                    <span class="tp-chip">PF <strong>${p.pf}</strong></span>
                    <span class="tp-chip"><strong>${pmFmt}</strong></span>
                </div>
            </div>
        </div>`;
    }).join('');

/* ── Injury Report ── */
async function fetchInjuryPlayers(events) {
    if (!events?.length) return [];
    const summaries = await Promise.all(events.map(e => fetchBoxScore(e.id)));
    const seen = new Set();
    const players = [];

    summaries.forEach(data => {
        if (!data?.injuries) return;
        data.injuries.forEach(teamInj => {
            const teamAbbr = normAbbr(teamInj.team?.abbreviation || '');
            (teamInj.injuries || []).forEach(inj => {
                const pid = inj.athlete?.id;
                if (pid && seen.has(pid)) return;
                if (pid) seen.add(pid);

                const details = inj.details || {};
                const side    = (details.side   || '').replace('Not Specified', '').trim();
                const type    = (details.type   || '').trim();
                const detail  = (details.detail || '').trim();
                const reason  = [side, type || detail].filter(Boolean).join(' ') || '—';

                players.push({
                    name:   inj.athlete?.displayName || '?',
                    photo:  inj.athlete?.headshot?.href || '',
                    team:   teamAbbr,
                    status: inj.status || 'Out',
                    reason,
                });
            });
        });
    });

    // Sort: Out first, then Doubtful, Questionable, Day-To-Day; within each group by team
    const order = { 'Out': 0, 'Doubtful': 1, 'Questionable': 2, 'Day-To-Day': 3 };
    return players.sort((a, b) => {
        const so = (order[a.status] ?? 9) - (order[b.status] ?? 9);
        return so !== 0 ? so : a.team.localeCompare(b.team);
    });
}

function renderInjuryPlayers(players) {
    const el = document.getElementById('injury-players');
    if (!el) return;
    if (!players.length) {
        el.innerHTML = '<div class="msg">No injury report</div>';
        return;
    }

    const statusCfg = {
        'Out':        { cls: 'ip-out',  label: 'OUT'   },
        'Doubtful':   { cls: 'ip-d',    label: 'DOUBT' },
        'Questionable':{ cls: 'ip-q',   label: 'GTD'   },
        'Day-To-Day': { cls: 'ip-dtd',  label: 'D2D'   },
    };

    el.innerHTML = players.map(p => {
        const cfg = statusCfg[p.status] || { cls: 'ip-out', label: p.status.toUpperCase() };
        const photoEl = p.photo
            ? `<img class="ip-photo" src="${p.photo}" alt="${p.name}" onerror="this.style.display='none'">`
            : `<div class="ip-photo-placeholder">${p.name.charAt(0)}</div>`;
        return `
        <div class="ip-item">
            ${photoEl}
            <div class="ip-body">
                <div class="ip-name-row">
                    <span class="ip-name">${p.name}</span>
                    <span class="ip-team">${p.team}</span>
                </div>
                <div class="ip-reason">${p.reason}</div>
            </div>
            <span class="ip-status ${cfg.cls}">${cfg.label}</span>
        </div>`;
    }).join('');
}

/* ── Main ── */
async function init() {
    const btn = document.getElementById('refresh-btn');
    if (btn) { btn.disabled = true; btn.classList.add('spinning'); }

    const now = new Date();

    // 閲覧がJST環境のため、JST日付を基準にET日付を計算する
    // NBA試合は7pm+ ET = 翌日8am+ JST のため、JST今日の試合 = ET(JST今日-1日)
    const jstStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo' }).format(now);
    const [jy, jm, jd] = jstStr.split('-').map(Number);
    const etForJstToday     = new Date(Date.UTC(jy, jm - 1, jd - 1, 17, 0, 0));
    const etForJstTomorrow  = new Date(Date.UTC(jy, jm - 1, jd,     17, 0, 0));
    const etForJstYesterday = new Date(Date.UTC(jy, jm - 1, jd - 2, 17, 0, 0));

    document.getElementById('last-updated').textContent =
        'Updated: ' + now.toLocaleTimeString('en-US', { timeZone: 'Asia/Tokyo' });

    await loadStandings();
    renderStandingsTable('West');
    renderStandingsTable('East');
    renderLottery();

    try {
        const [todayEvents, scheduleEvents, yesterdayEvents] = await Promise.all([
            fetchEvents(etForJstToday),
            fetchEvents(etForJstTomorrow),
            fetchEvents(etForJstYesterday)
        ]);
        const resultsEvents = todayEvents;

        // Playoff auto-detection: competition.series is only present during playoffs
        isPlayoffMode = [...resultsEvents, ...scheduleEvents]
            .some(e => e.competitions?.[0]?.series != null);

        // Top Players: 当日完了済み試合があればその結果、なければ前日にフォールバック
        const todayCompleted = todayEvents.filter(e =>
            e.status.type.completed || e.status.type.state === 'post'
        );
        let topPlayerEvents, topPlayersDate;
        if (todayCompleted.length > 0) {
            topPlayerEvents = todayEvents;
            topPlayersDate  = now;
        } else {
            // 当日未開始またはライブ中のみ → 前日スタッツを表示
            topPlayerEvents = yesterdayEvents;
            topPlayersDate  = new Date(now.getTime() - 86400000);
        }

        document.getElementById('today-date').textContent       = resultsEvents.length  ? fmtJstDate(new Date(resultsEvents[0].date))  : fmtJstDate(now);
        document.getElementById('tomorrow-date').textContent    = scheduleEvents.length ? fmtJstDate(new Date(scheduleEvents[0].date)) : fmtJstDate(new Date(now.getTime() + 86400000));
        document.getElementById('yesterday-date').textContent   = yesterdayEvents.length ? fmtJstDate(new Date(yesterdayEvents[0].date)) : fmtJstDate(new Date(now.getTime() - 86400000));
        document.getElementById('top-players-date').textContent = fmtJstDate(topPlayersDate);
        document.getElementById('injury-date').textContent      = todayEvents.length    ? fmtJstDate(new Date(todayEvents[0].date))    : fmtJstDate(now);
        renderGames(resultsEvents,  'today-games');
        renderGames(scheduleEvents, 'tomorrow-games');
        renderGames(yesterdayEvents, 'yesterday-games');
        extractTopPlayers(topPlayerEvents).then(setTopPlayers);
        fetchInjuryPlayers(todayEvents).then(renderInjuryPlayers);

    } catch (err) {
        console.error(err);
        ['today-games', 'tomorrow-games', 'yesterday-games'].forEach(id => {
            document.getElementById(id).innerHTML =
                '<div class="msg error">Failed to load data</div>';
        });
    } finally {
        if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
    }

    if (document.querySelectorAll('.status-live').length > 0) {
        setTimeout(init, 5 * 60 * 1000);
    }
}

init();

</script>
