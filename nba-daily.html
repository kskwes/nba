    ['STL', 'STL', 'stl', 'steals'],
    ['BLK', 'BLK', 'blk', 'blocks'],
    ['TO',  'TO',  'to',  'TOV', 'turnovers'],
    ['PF',  'PF',  'pf',  'fouls'],
    ['+/-', '+/-', 'plusMinus'],
];

// 追加指標（ボックススコアの数値から算出）
const ADV_COLS = ['TS%', 'eFG%', 'USG%', 'PIE'];
const BOX_RAW = {
    min: ['MIN', 'minutes'], pts: ['PTS', 'points'],
    fg: ['FG', 'fieldGoalsMade-fieldGoalsAttempted'],
    tp: ['3PT', 'threePointFieldGoalsMade-threePointFieldGoalsAttempted'],
    ft: ['FT', 'freeThrowsMade-freeThrowsAttempted'],
    oreb: ['OREB', 'offensiveRebounds'], dreb: ['DREB', 'defensiveRebounds'],
    ast: ['AST', 'assists'], stl: ['STL', 'steals'], blk: ['BLK', 'blocks'],
    to: ['TO', 'turnovers', 'TOV'], pf: ['PF', 'fouls'],
};

// 選手1行を数値に変換（出場していなければ null）
function parseBoxLine(sg, a) {
    if (a.didNotPlay || !a.stats?.length) return null;
    const names = sg.names || [], keys = sg.keys || [];
    const raw = k => { const i = getStatIdx(names, keys, ...BOX_RAW[k]); return i >= 0 ? String(a.stats[i] ?? '') : ''; };
    const num = v => parseInt(v) || 0;
    const pair = v => { const [m, x] = v.split('-'); return [num(m), num(x)]; };
    const [fgm, fga] = pair(raw('fg')), [tpm, tpa] = pair(raw('tp')), [ftm, fta] = pair(raw('ft'));
    return {
        min: num(raw('min')), pts: num(raw('pts')), fgm, fga, tpm, tpa, ftm, fta,
        oreb: num(raw('oreb')), dreb: num(raw('dreb')), ast: num(raw('ast')),
        stl: num(raw('stl')), blk: num(raw('blk')), to: num(raw('to')), pf: num(raw('pf')),
    };
}

const sumBoxLines = lines => lines.reduce((t, l) => {
    Object.keys(l).forEach(k => { t[k] = (t[k] || 0) + l[k]; });
    return t;
}, {});

const teamBoxTotals = teamData => {
    const sg = teamData.statistics?.[0];
    return sumBoxLines((sg?.athletes || []).map(a => parseBoxLine(sg, a)).filter(Boolean));
};

const pieNum = l => l.pts + l.fgm + l.ftm - l.fga - l.fta + l.dreb + 0.5 * l.oreb
    + l.ast + l.stl + 0.5 * l.blk - l.pf - l.to;

// tm: 自チーム合計 / game: 両チーム合計。分母が 0 の指標は null
function advStats(l, tm, game) {
    const pct = (n, d) => d > 0 ? (100 * n / d).toFixed(1) : null;
    const tsa = l.fga + 0.44 * l.fta;
    const tmPoss = tm.fga + 0.44 * tm.fta + tm.to;
    const gamePie = pieNum(game);
    return [
        pct(l.pts, 2 * tsa),
        pct(l.fgm + 0.5 * l.tpm, l.fga),
        l.min > 0 ? pct((tsa + l.to) * (tm.min / 5), l.min * tmPoss) : null,
        gamePie ? (100 * pieNum(l) / gamePie).toFixed(1) : null,
    ];
}

// Team Stats（boxscore.teams の statistics から）
// m: 自チーム / o: 相手チームの値を返す関数（数値は n, 表示用文字列は v）
// type: split = 件数を1本のバーで比率表示 / rate = 0〜100% の率 / plain = 数値のみ / shared = 両チーム共通の値
const tsPct = (n, d) => d > 0 ? 100 * n / d : null;
const tsFmt = x => x == null ? '-' : `${x.toFixed(1)}%`;
const TEAM_STATS = [
    ['Shooting', '', [
        { label: 'FG',  type: 'rate', num: m => m.n('fieldGoalPct'), val: m => m.v('fieldGoalsMade-fieldGoalsAttempted'), sub: m => `${m.v('fieldGoalPct')}%` },
        { label: '3PT', type: 'rate', num: m => m.n('threePointFieldGoalPct'), val: m => m.v('threePointFieldGoalsMade-threePointFieldGoalsAttempted'), sub: m => `${m.v('threePointFieldGoalPct')}%` },
        { label: 'FT',  type: 'rate', num: m => m.n('freeThrowPct'), val: m => m.v('freeThrowsMade-freeThrowsAttempted'), sub: m => `${m.v('freeThrowPct')}%` },
    ]],
    ['Rebounding', '', [
        { label: 'REB', type: 'split', num: m => m.n('totalRebounds'), val: m => m.v('totalRebounds'),
          sub: (m, o) => tsFmt(tsPct(m.n('totalRebounds'), m.n('totalRebounds') + o.n('totalRebounds'))) },
        { label: 'OREB%', type: 'rate', num: (m, o) => tsPct(m.n('offensiveRebounds'), m.n('offensiveRebounds') + o.n('defensiveRebounds')),
          val: (m, o) => tsFmt(tsPct(m.n('offensiveRebounds'), m.n('offensiveRebounds') + o.n('defensiveRebounds'))), sub: m => `OR ${m.v('offensiveRebounds')}` },
        { label: 'DREB%', type: 'rate', num: (m, o) => tsPct(m.n('defensiveRebounds'), m.n('defensiveRebounds') + o.n('offensiveRebounds')),
          val: (m, o) => tsFmt(tsPct(m.n('defensiveRebounds'), m.n('defensiveRebounds') + o.n('offensiveRebounds'))), sub: m => `DR ${m.v('defensiveRebounds')}` },
    ]],
    ['Ball Control', '', [
        { label: 'AST', type: 'split', num: m => m.n('assists') },
        { label: 'STL', type: 'split', num: m => m.n('steals') },
        { label: 'BLK', type: 'split', num: m => m.n('blocks') },
        { label: 'TO',  type: 'plain', num: m => m.n('turnovers'), lowerBetter: true },
        { label: 'PF',  type: 'plain', num: m => m.n('fouls'), lowerBetter: true },
    ]],
    ['Scoring', '', [
        { label: 'Paint Pts',  type: 'split', num: m => m.n('pointsInPaint') },
        { label: 'Fast Break', type: 'split', num: m => m.n('fastBreakPoints') },
        // ESPN の turnoverPoints は「自チームのTOから失った点」なので相手側の値を使う
        { label: 'Pts off TO', type: 'split', num: (m, o) => o.n('turnoverPoints'), has: (m, o) => o.v('turnoverPoints') !== '' },
    ]],
    ['Game Flow', '', [
        { label: 'Largest Lead', type: 'split', num: m => m.n('largestLead') },
        { label: 'Lead Changes', type: 'shared', num: m => m.n('leadChanges'), has: m => m.v('leadChanges') !== '' },
    ]],
];

function boxTeamStats(awayTeam, homeTeam) {
    if (!awayTeam?.statistics?.length || !homeTeam?.statistics?.length) return '<div class="msg">No team stats available</div>';
    const acc = t => {
        const v = name => t.statistics.find(x => x.name === name)?.displayValue ?? '';
        return { v, n: name => parseFloat(v(name)) || 0 };
    };
    const A = acc(awayTeam), H = acc(homeTeam);
    const abA = normAbbr(awayTeam.team?.abbreviation || ''), abH = normAbbr(homeTeam.team?.abbreviation || '');

    const row = r => {
        const nA = r.num(A, H), nH = r.num(H, A);
        const vA = r.val ? r.val(A, H) : String(nA), vH = r.val ? r.val(H, A) : String(nH);
        const subA = r.sub ? r.sub(A, H) : '', subH = r.sub ? r.sub(H, A) : '';
        const tip = `${r.label}: ${abA} ${vA}${subA ? ` (${subA})` : ''} / ${abH} ${vH}${subH ? ` (${subH})` : ''}`;
        if (r.type === 'shared') {
            return `<div class="ts-row" title="${tip}"><div class="ts-head">
                <span></span><span class="ts-lbl">${r.label} <span class="ts-val lead">${vA}</span></span><span></span>
            </div></div>`;
        }
        const leadA = nA != null && nH != null && (r.lowerBetter ? nA < nH : nA > nH);
        const leadH = nA != null && nH != null && (r.lowerBetter ? nH < nA : nH > nA);
        let chart = '';
        if (r.type === 'split') {
            const empty = !(nA + nH > 0);
            chart = `<div class="ts-bar ${empty ? 'empty' : ''}">
                <span class="ts-a" style="flex:${empty ? 1 : nA} 1 0"></span><span class="ts-h" style="flex:${empty ? 1 : nH} 1 0"></span>
            </div>`;
        } else if (r.type === 'rate') {
            const w = x => Math.max(0, Math.min(100, x ?? 0));
            chart = `<div class="ts-rate">
                <div class="ts-track"><span class="ts-a" style="width:${w(nA)}%"></span></div>
                <div class="ts-track"><span class="ts-h" style="width:${w(nH)}%"></span></div>
            </div>`;
        }
        return `<div class="ts-row" title="${tip}">
            <div class="ts-head">
                <span class="ts-val ${leadA ? 'lead' : ''}">${vA}${subA ? `<small>${subA}</small>` : ''}</span>
                <span class="ts-lbl">${r.label}</span>
                <span class="ts-val right ${leadH ? 'lead' : ''}">${subH ? `<small>${subH}</small>` : ''}${vH}</span>
            </div>${chart}
        </div>`;
    };

    const groups = TEAM_STATS.map(([title, note, rows]) => {
        const html = rows.filter(r => r.has ? r.has(A, H) : true).map(row).join('');
        return html ? `<div class="ts-group">${title}${note ? `<small>${note}</small>` : ''}</div>${html}` : '';
    }).join('');

    return `<div class="ts-legend">
        <span><i class="ts-sw a"></i>${abA}</span><span>${abH}<i class="ts-sw h"></i></span>
    </div>${groups}`;
}

function closeBoxScoreModal() {
    document.getElementById('box-modal').classList.remove('open');
    stopFlowRefresh();
    document.body.style.overflow = '';
}

function switchBoxTeam(idx) {
    document.querySelectorAll('.box-team-btn').forEach(b => b.classList.toggle('active', +b.dataset.idx === idx));
    document.querySelectorAll('.box-team-panel').forEach(p => p.classList.toggle('active', +p.dataset.idx === idx));
    // Flow は表示中の幅で描くため、タブを開いたときに描画する
    if (idx === FLOW_IDX) renderFlow();
    if (idx === ROT_IDX) renderRotation();
}

// ESPN の links 配列から rel に指定キーを含む href を取り出す
const espnLink = (links, rel) => (links || []).find(l => l.rel?.includes(rel))?.href || '';
const espnGameUrl = event => espnLink(event.links, 'summary') || `https://www.espn.com/nba/game/_/gameId/${event.id}`;
const espnPlayerUrl = athlete => espnLink(athlete?.links, 'playercard')
    || (athlete?.id ? `https://www.espn.com/nba/player/_/id/${athlete.id}` : '');

function boxTeamTable(teamData, gameTot) {
    const sg = teamData.statistics?.[0];
    if (!sg?.athletes?.length) return '<div class="msg">No stats available</div>';
    const tmTot = teamBoxTotals(teamData);
    const nCols = BOX_COLS.length + ADV_COLS.length;
    const names = sg.names || [];
    const keys  = sg.keys  || [];
    const idx = BOX_COLS.map(([, ...cands]) => getStatIdx(names, keys, ...cands));

    const row = a => {
        const pos = a.athlete?.position?.abbreviation || '';
        const jersey = a.athlete?.jersey || '';
        const name = a.athlete?.shortName || a.athlete?.displayName || '—';
        const url  = espnPlayerUrl(a.athlete);
        const nameCell = `<td class="box-name">${url ? `<a class="box-player-link" href="${url}" target="_blank" rel="noopener">${name}</a>` : name}
            ${jersey ? `<span class="box-pos">#${jersey}</span>` : ''}
            ${pos ? `<span class="box-pos">${pos}</span>` : ''}</td>`;
        if (a.didNotPlay || !a.stats?.length) {
            return `<tr class="box-dnp">${nameCell}<td colspan="${nCols}">${a.reason || 'DNP'}</td></tr>`;
        }
        const cells = idx.map((i, c) => {
            const v = i >= 0 ? (a.stats[i] ?? '-') : '-';
            return `<td class="${BOX_COLS[c][0] === 'PTS' ? 'box-pts' : ''}">${v}</td>`;
        }).join('');
        const adv = advStats(parseBoxLine(sg, a), tmTot, gameTot).map(v => `<td>${v ?? '-'}</td>`).join('');
        return `<tr>${nameCell}${cells}${adv}</tr>`;
    };

    const starters = sg.athletes.filter(a => a.starter);
    const bench    = sg.athletes.filter(a => !a.starter);
    const head = `<tr><th class="box-name">Player</th>${BOX_COLS.map(c => `<th>${c[0]}</th>`).join('')}${ADV_COLS.map(c => `<th class="box-adv">${c}</th>`).join('')}</tr>`;
    const sep  = label => `<tr class="box-sep"><td colspan="${nCols + 1}">${label}</td></tr>`;

    return `<div class="box-table-wrap"><table class="box-table">
        <thead>${head}</thead>
        <tbody>
            ${starters.length ? sep('Starters') + starters.map(row).join('') : ''}
            ${bench.length ? sep('Bench') + bench.map(row).join('') : ''}
        </tbody>
    </table></div>`;
}

async function openBoxScoreModal(event) {
    const modal = document.getElementById('box-modal');
    const body  = document.getElementById('box-modal-body');
    const comp  = event.competitions[0];
    const away  = comp.competitors.find(c => c.homeAway === 'away') ?? comp.competitors[0];
    const home  = comp.competitors.find(c => c.homeAway === 'home') ?? comp.competitors[1];
    const st    = event.status;
    const isOver = !!st.type.completed || st.type.state === 'post';
    const statusText = isOver ? 'FINAL' : `● LIVE  Q${st.period}  ${st.displayClock}`;

    const abbr = t => normAbbr(t.team.abbreviation) || t.team.displayName;
    const awayNum = parseInt(away.score), homeNum = parseInt(home.score);

    // クォーター別スコア（OTがあれば列が増える）
    const periods = Math.max(away.linescores?.length || 0, home.linescores?.length || 0);
    const pLabel = i => i < 4 ? `Q${i + 1}` : (i === 4 ? 'OT' : `OT${i - 3}`);
    const lineRow = t => `<tr><td class="box-name">${abbr(t)}</td>
        ${Array.from({ length: periods }, (_, i) => `<td>${t.linescores?.[i]?.value ?? '-'}</td>`).join('')}
        <td class="box-pts">${t.score ?? '-'}</td></tr>`;
    const lineHTML = periods ? `<div class="box-table-wrap"><table class="box-table box-line">
        <thead><tr><th class="box-name"></th>${Array.from({ length: periods }, (_, i) => `<th>${pLabel(i)}</th>`).join('')}<th>T</th></tr></thead>
        <tbody>${lineRow(away)}${lineRow(home)}</tbody>
    </table></div>` : '';

    const teamHead = (t, won) => `<div class="box-team ${won ? 'winner' : ''}">
        <img src="${t.team.logo || ''}" alt="${abbr(t)}">
        <div class="box-team-abbr">${abbr(t)}</div>
    </div>`;

    body.innerHTML = `
        <div class="status ${isOver ? 'status-final' : 'status-live'}">${statusText}</div>
        <a class="box-scoreline" href="${espnGameUrl(event)}" target="_blank" rel="noopener">
            ${teamHead(away, isOver && awayNum > homeNum)}
            <div class="box-score">${away.score ?? '-'}<span>-</span>${home.score ?? '-'}</div>
            ${teamHead(home, isOver && homeNum > awayNum)}
        </a>
        ${lineHTML}
        <div id="box-players"><div class="msg">Loading box score...</div></div>`;

    modal.classList.add('open');
    document.body.style.overflow = 'hidden';

    const data = await fetchBoxScore(event.id);
    const el = document.getElementById('box-players');
    if (!modal.classList.contains('open') || !el) return;
    const teams = data?.boxscore?.players;
    if (!teams?.length) { el.innerHTML = '<div class="msg error">Failed to load box score</div>'; return; }

    // away → home の順に並べる
    const order = [away.team.id, home.team.id];
    teams.sort((a, b) => order.indexOf(a.team?.id) - order.indexOf(b.team?.id));
    const teamTotals = id => data.boxscore.teams?.find(x => x.team?.id === id);
    const gameTot = sumBoxLines(teams.map(teamBoxTotals));

    flow = data.plays?.length ? buildFlow(data, away, home, isOver) : null;
    rotation = buildRotation(data, away, home, isOver);
    rotCursor = null; rotSel = null;
    // タブ: Team Stats / Flow / Rotation / away / home
    el.innerHTML = `
        <div class="conf-tabs box-team-tabs">
            <button class="conf-btn box-team-btn" data-idx="0" onclick="switchBoxTeam(0)">Team Stats</button>
            <button class="conf-btn box-team-btn" data-idx="${FLOW_IDX}" onclick="switchBoxTeam(${FLOW_IDX})">Flow</button>
            <button class="conf-btn box-team-btn" data-idx="${ROT_IDX}" onclick="switchBoxTeam(${ROT_IDX})">Rotation</button>
            ${teams.map((t, i) => `<button class="conf-btn box-team-btn" data-idx="${i + 3}" onclick="switchBoxTeam(${i + 3})">${normAbbr(t.team?.abbreviation || '')}</button>`).join('')}
        </div>
        <div class="box-team-panel" data-idx="0">${boxTeamStats(teamTotals(away.team.id), teamTotals(home.team.id))}</div>
        <div class="box-team-panel" data-idx="${FLOW_IDX}">${flow ? flowPanelHTML() : '<div class="msg">No play-by-play data</div>'}</div>
        <div class="box-team-panel" data-idx="${ROT_IDX}">${rotation ? rotationPanelHTML() : '<div class="msg">No substitution data</div>'}</div>
        ${teams.map((t, i) => `<div class="box-team-panel" data-idx="${i + 3}">${boxTeamTable(t, gameTot)}</div>`).join('')}`;
    if (flow) bindFlowControls();
    if (rotation) bindRotationControls();
    switchBoxTeam(0);
    if (!isOver) startFlowRefresh(event, away, home);
}

/* ── Flow: 得点推移・連続得点・無得点・勝負の分かれ目 ── */
const FLOW_IDX = 1;                                  // モーダル内タブの位置（Team Stats の次）
const FL_HEX = { a: '#3987e5', h: '#d95926' };       // --ts-away / --ts-home と同じ色
const FL_ACCENT = '#F5B700';
const FL_REFRESH_MS = 5 * 60 * 1000;
let flow = null;          // 表示中の試合の Flow データ
let flowTimer = null;     // 試合中の自動更新
const flowOpts = { mode: 'score', runTh: 8, allow: 0, dryTh: 150 };

const flEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 経過秒（Q1-4: 12分、OT: 5分）
const flPeriodLen = p => p <= 4 ? 720 : 300;
const flPeriodStart = p => p <= 4 ? (p - 1) * 720 : 2880 + (p - 5) * 300;
const flClockSec = s => String(s).includes(':') ? (+s.split(':')[0]) * 60 + parseFloat(s.split(':')[1]) : parseFloat(s) || 0;
const flElapsed = (p, clock) => flPeriodStart(p) + flPeriodLen(p) - flClockSec(clock);
const flPLabel = p => p <= 4 ? `Q${p}` : (p === 5 ? 'OT' : `OT${p - 4}`);
const flDur = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const flOther = side => side === 'a' ? 'h' : 'a';
// 経過秒 → 「Q3 10:42」
function flAt(t) {
    let p = 1;
    while (p < flow.periods && t >= flPeriodStart(p + 1)) p++;
    const rem = flPeriodStart(p) + flPeriodLen(p) - t;
    return `${flPLabel(p)} ${rem >= 60 ? flDur(rem) : rem.toFixed(1)}`;
}
const flScore = (as, hs) => `${flow.abbr.a} ${as}-${hs} ${flow.abbr.h}`;

// ESPN の summary から Flow 用のデータを作る
function buildFlow(data, away, home, isOver) {
    const side = { [away.team.id]: 'a', [home.team.id]: 'h' };
    const wpMap = new Map((data.winprobability || []).map(w => [w.playId, w.homeWinPercentage]));
    const names = {};
    (data.boxscore?.players || []).forEach(t => (t.statistics?.[0]?.athletes || [])
        .forEach(a => { if (a.athlete?.id) names[a.athlete.id] = a.athlete.shortName || a.athlete.displayName; }));
    const all = [], plays = [], wp = [];
    (data.plays || []).forEach(x => {
        const p = x.period?.number || 1;
        const t = flElapsed(p, x.clock?.displayValue ?? '0');
        const s = side[x.team?.id] || '';
        const type = (x.type?.text || '').replace(/\n/g, ' ');
        const isFT = /Free Throw/.test(type);
        const c = x.coordinate;
        let wi = null;
        if (wpMap.has(x.id)) { wi = wp.length; wp.push({ t, h: wpMap.get(x.id), as: x.awayScore, hs: x.homeScore }); }
        const sh = !!x.shootingPlay && !isFT;
        all.push({ t, side: s, type, text: x.text || '', sc: !!x.scoringPlay, sh, val: x.scoreValue || 0, pa: x.pointsAttempted || 0,
            // 座標はフィート単位。リングは (25, 0)
            dist: sh && c && c.x >= 0 && c.y >= 0 ? Math.round(Math.hypot(c.x - 25, c.y)) : null,
            pid: x.participants?.[0]?.athlete?.id });
        if (x.scoringPlay && s) plays.push({ t, side: s, val: x.scoreValue || 0, as: x.awayScore, hs: x.homeScore, text: x.text || '', wi, ai: all.length - 1 });
    });
    if (!plays.length) return null;
    const periods = Math.max(4, data.header?.competitions?.[0]?.status?.period || 0, ...(data.plays || []).map(x => x.period?.number || 1));
    const end = flPeriodStart(periods) + flPeriodLen(periods);
    const last = plays.at(-1);
    return {
        abbr: { a: normAbbr(away.team.abbreviation), h: normAbbr(home.team.abbreviation) },
        plays, all, wp, names, periods, isOver,
        end,                                                 // 横軸の右端
        now: isOver ? end : Math.max(last.t, all.at(-1)?.t || 0), // 試合中は最新プレーまで
        winner: isOver ? (last.hs > last.as ? 'h' : 'a') : null,
    };
}

// 連続得点: あるチームの得点で始まり、そのチームの得点で終わる区間。
// 相手の得点は allow 点まで許す（0 なら完全な連続得点）
function flRuns(th, allow) {
    const { plays, wp } = flow;
    const cands = [];
    plays.forEach((p0, i) => {
        let mine = 0, opp = 0;
        for (let j = i; j < plays.length; j++) {
            const pl = plays[j];
            if (pl.side === p0.side) mine += pl.val;
            else if ((opp += pl.val) > allow) break;
            if (pl.side === p0.side && mine >= th) cands.push({ side: p0.side, pts: mine, opp, i, j });
        }
    });
    // 点差の大きい区間を優先し、重ならないように選ぶ
    cands.sort((a, b) => (b.pts - b.opp) - (a.pts - a.opp) || (a.j - a.i) - (b.j - b.i));
    const used = new Set(), runs = [];
    cands.forEach(c => {
        for (let k = c.i; k <= c.j; k++) if (used.has(k)) return;
        for (let k = c.i; k <= c.j; k++) used.add(k);
        const p0 = plays[c.i], p1 = plays[c.j];
        const before = p0.wi != null ? (wp[p0.wi - 1] ?? wp[0])?.h : null, after = p1.wi != null ? wp[p1.wi]?.h : null;
        runs.push({ ...c, t0: p0.t, t1: p1.t,
            // 内訳カードの対象範囲: 直前の得点の次のプレーから、ラン最後の得点まで
            a0: c.i > 0 ? plays[c.i - 1].ai + 1 : 0, a1: p1.ai,
            from: [p0.as - (p0.side === 'a' ? p0.val : 0), p0.hs - (p0.side === 'h' ? p0.val : 0)], to: [p1.as, p1.hs],
            // そのチームから見た勝率の変化（ポイント）
            wpGain: before != null && after != null ? 100 * (after - before) * (c.side === 'h' ? 1 : -1) : null });
    });
    return runs.sort((a, b) => a.i - b.i);
}

// 無得点: そのチームの得点と得点の間（試合開始・現在／試合終了も端として扱う）
function flDroughts(th) {
    const { plays, all, now } = flow;
    const out = [];
    ['a', 'h'].forEach(side => {
        const pts = [{ t: 0, ai: -1 }, ...plays.filter(p => p.side === side), { t: now, ai: all.length }];
        for (let i = 1; i < pts.length; i++) {
            if (pts[i].t - pts[i - 1].t >= th) out.push({ side, t0: pts[i - 1].t, t1: pts[i].t, open: i === pts.length - 1,
                a0: pts[i - 1].ai + 1, a1: pts[i].ai - 1 });
        }
    });
    return out;
}

// 勝負の分かれ目（試合終了後のみ）
// ▼ 勝ったチームの勝率が最も低かった時点（50% 未満のときだけ） / ● 最後にリードを奪った得点（スコアで判定）
// ✓ 勝率がそれ以降ずっと 90% 以上 / ★ 勝ったチームの勝率を最も押し上げた連続得点
// 勝率データがない試合は得点だけで代わりを出す（▼ 最大ビハインド / ★ 点差を最も動かした連続得点 / ✓ なし）
function flTurningPoints(runs) {
    const { wp, plays, winner, isOver } = flow;
    if (!isOver) return null;
    const lead = pl => winner === 'h' ? pl.hs - pl.as : pl.as - pl.hs;
    const tp = { hasWP: wp.length > 0 };
    const kLast = plays.findLastIndex(pl => lead(pl) <= 0);
    if (kLast >= 0 && kLast + 1 < plays.length) tp.ahead = plays[kLast + 1];
    const mine = runs.filter(r => r.side === winner);
    if (tp.hasWP) {
        const ww = wp.map(w => winner === 'h' ? w.h : 1 - w.h);
        const lo = ww.indexOf(Math.min(...ww));
        if (ww[lo] < 0.5) tp.low = { ...wp[lo], wp: ww[lo] };
        const k90 = ww.findLastIndex(v => v < 0.9);
        if (k90 + 1 < ww.length) tp.sealed = wp[k90 + 1];
        tp.run = mine.filter(r => r.wpGain > 0).sort((a, b) => b.wpGain - a.wpGain)[0];
    } else {
        const worst = plays.reduce((m, p) => lead(p) < lead(m) ? p : m, plays[0]);
        if (lead(worst) < 0) tp.low = worst;
        tp.run = mine.sort((a, b) => (b.pts - b.opp) - (a.pts - a.opp))[0];
    }
    return tp;
}

/* ── 受けた側の内訳 ── */
const FL_TO_JA = [[/Offensive Foul/, 'オフェンスファウル'], [/Bad Pass/, 'パスミス'], [/Lost Ball/, 'ボールロスト'], [/Step/, 'ラインクロス'],
    [/Travel/, 'トラベリング'], [/Shot Clock/, 'ショットクロック'], [/Second/, '時間違反'], [/.*/, 'その他']];
const flToJa = type => FL_TO_JA.find(([re]) => re.test(type))[1];
const flZone = p => p.pa === 3 ? '3P' : (p.dist != null && p.dist < 10 ? 'ゴール下' : 'ミドル');
const flIsTO = p => /Turnover/.test(p.type);
const flIsFT = p => /Free Throw/.test(p.type);
const flFg = list => `${list.filter(p => p.sc).length}/${list.length}`;
const flPct = list => list.length ? list.filter(p => p.sc).length / list.length : null;

function flAnalyze(R, a0, a1) {
    const { all, names } = flow;
    const X = flOther(R), start = Math.max(0, a0), win = all.slice(start, a1 + 1);
    const mine = win.filter(p => p.side === R);
    const shots = mine.filter(p => p.sh), threes = shots.filter(p => p.pa === 3);
    const ft = mine.filter(flIsFT), to = mine.filter(flIsTO);
    const zones = ['ゴール下', 'ミドル', '3P'].map(z => [z, shots.filter(p => flZone(p) === z)]);
    const toTypes = {};
    to.forEach(p => { const k = flToJa(p.type); toTypes[k] = (toTypes[k] || 0) + 1; });
    const shooters = {};
    shots.forEach(p => { (shooters[names[p.pid] || '?'] ||= []).push(p); });
    const oreb = mine.filter(p => p.type === 'Offensive Rebound').length;
    const oppOreb = win.filter(p => p.side === X && p.type === 'Offensive Rebound').length;
    // タイムアウト（受けた側）と、その後に相手が取った点
    const toIdx = win.findIndex(p => p.side === R && /Timeout/.test(p.type));
    const afterTO = toIdx < 0 ? null : win.slice(toIdx + 1).filter(p => p.side === X && p.sc).reduce((s, p) => s + p.val, 0);
    // 相手の得点源: 得点から遡って、その攻撃の始まりを調べる
    const src = { TO: 0, '2nd': 0, other: 0 };
    win.forEach((p, k) => {
        if (p.side !== X || !p.sc) return;
        let kind = 'other';
        for (let m = start + k - 1; m >= 0; m--) {
            const q = all[m];
            if (q.side === X && q.type === 'Offensive Rebound') { kind = '2nd'; break; }
            if (q.side === R && flIsTO(q)) { kind = 'TO'; break; }
            if ((q.side === X && q.type === 'Defensive Rebound') || (q.side === R && q.sc)) break;
        }
        src[kind] += p.val;
    });
    return { R, X, shots, threes, ft, to, zones, toTypes, shooters, oreb, oppOreb, toIdx, afterTO, src,
        poss: Math.max(0, Math.round(shots.length + 0.44 * ft.length - oreb + to.length)),
        gamePct: flPct(all.filter(p => p.side === R && p.sh)), rimAtt: zones[0][1].length };
}

// 一行説明（日本語）: 数値の組み合わせで定型文を選ぶ
function flRecvSentence(a, dur) {
    const A = flow.abbr;
    const m = a.shots.filter(p => p.sc).length, n = a.shots.length;
    const m3 = a.threes.filter(p => p.sc).length, ftm = a.ft.filter(p => p.sc).length;
    const head = `${A[a.R]} は ${dur} の間、FG ${m}/${n}（3P ${m3}/${a.threes.length}）、TO ${a.to.length}、FT ${ftm}/${a.ft.length}。`;
    const why = [];
    if (n >= 3 && m === 0 && a.threes.length / n >= 0.5) why.push('3P中心に打って1本も入らず');
    else if (n >= 4 && a.gamePct != null && flPct(a.shots) < a.gamePct - 0.2) why.push(`シュートが軒並み外れた（試合全体は ${Math.round(a.gamePct * 100)}%）`);
    if (a.to.length >= 3 || (a.to.length >= 2 && a.to.length >= n / 2)) why.push('TO が続いて攻撃回数そのものを失った');
    if (a.ft.length === 0 && a.rimAtt <= 1) why.push('ゴール下に迫れず、FTももらえていない');
    if (a.src.TO >= 4) why.push(`${A[a.X]} に TO から ${a.src.TO}点を許した`);
    if (a.toIdx >= 0) why.push(a.afterTO > 0 ? 'タイムアウト後も止められず' : 'タイムアウトで流れを止めた');
    // 理由は優先順に最大3つ。1文ずつ区切る
    return head + why.slice(0, 3).map(w => w + '。').join('');
}

function flRecvCard(e) {
    const A = flow.abbr;
    const a = flAnalyze(e.recv, e.a0, e.a1);
    const tile = (label, val, sub = '') => `<div class="fl-tile"><span>${label}</span><b>${val}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
    const zoneRows = a.zones.map(([z, list]) => `<div class="fl-zone"><span>${z}</span>
        <div class="fl-dots">${list.map(p => `<i class="${p.sc ? 'in' : ''}"></i>`).join('') || '<em>—</em>'}</div><b>${flFg(list)}</b></div>`).join('');
    const toChips = Object.entries(a.toTypes).map(([k, v]) => `<span class="fl-chip">${k}${v > 1 ? ` ×${v}` : ''}</span>`).join('') || '<span class="fl-none">なし</span>';
    const shooters = Object.entries(a.shooters).sort((x, y) => y[1].length - x[1].length)
        .map(([nm, l]) => `<span class="fl-chip">${flEsc(nm)} ${flFg(l)}</span>`).join('') || '<span class="fl-none">シュートなし</span>';
    const srcTotal = a.src.TO + a.src['2nd'] + a.src.other;
    const srcPart = (n, label) => n ? `<span style="flex:${n}">${label} ${n}</span>` : '';
    // この間コートにいた選手（Rotation と同じ再現データ）。途中で出入りした選手は出場時間を添える
    const oc = rtOnCourt(e.recv, e.w0, e.t1);
    const span = e.t1 - e.w0;
    const onCourtHTML = oc?.length ? `<div class="fl-sec">コートにいた選手 <small>時間付きは途中で出入り</small></div><div class="fl-chips">${oc.map(r =>
        `<span class="fl-chip">${flEsc(r.name)}${r.sec < span - 1 ? ` <span class="fl-chip-sub">${flDur(r.sec)}</span>` : ''}</span>`).join('')}</div>` : '';
    return `<div class="fl-card" style="--fl-c:${FL_HEX[a.R]}">
        <div class="fl-card-title">${A[a.R]} の攻撃（${e.kind}）<small>${e.w0 === 0 ? 'Tip-off' : flAt(e.w0)} → ${e.open ? (flow.isOver ? 'Final' : 'Now') : flAt(e.t1)}</small></div>
        <div class="fl-card-sum">${flRecvSentence(a, flDur(e.t1 - e.w0))}</div>
        <div class="fl-tiles">
            ${tile('FG', flFg(a.shots), a.gamePct != null ? `試合 ${Math.round(a.gamePct * 100)}%` : '')}
            ${tile('3P', flFg(a.threes))}
            ${tile('TO', a.to.length)}
            ${tile('FT', flFg(a.ft))}
            ${tile('OREB', `${a.oreb}<span class="fl-vs">vs</span>${a.oppOreb}`, `相手 ${A[a.X]}`)}
            ${tile('攻撃回数', `約${a.poss}`)}
        </div>
        ${onCourtHTML}
        <div class="fl-sec">エリア別シュート <small>● 成功 ○ 失敗</small></div>${zoneRows}
        <div class="fl-sec">ターンオーバー</div><div class="fl-chips">${toChips}</div>
        <div class="fl-sec">シュートを打った選手</div><div class="fl-chips">${shooters}</div>
        ${srcTotal ? `<div class="fl-sec">${A[a.X]} の得点源</div><div class="fl-src">
            ${srcPart(a.src.TO, 'TOから')}${srcPart(a.src['2nd'], '2nd')}${srcPart(a.src.other, 'その他')}</div>` : ''}
        ${a.toIdx >= 0 ? `<div class="fl-note">タイムアウト後に ${A[a.X]} が ${a.afterTO}点</div>` : ''}
    </div>`;
}

function flTurningPointsHTML(tp) {
    if (!flow.isOver) return '<div class="fl-msg">Turning points appear after the final buzzer</div>';
    const A = flow.abbr, Wn = A[flow.winner];
    const deficit = w => Math.abs(w.hs - w.as);
    const pct = v => Math.round(v * 100);
    // 要約文（日本語）
    const parts = [];
    if (tp.low) parts.push(tp.hasWP
        ? `${Wn} が勝率${pct(tp.low.wp)}%（${deficit(tp.low)}点ビハインド）から逆転。`
        : `${Wn} が最大${deficit(tp.low)}点ビハインドから逆転。`);
    else parts.push(tp.hasWP ? `${Wn} は勝率が一度も50%を下回らずに勝利。` : `${Wn} は一度もリードされずに勝利。`);
    if (tp.run) parts.push(`決め手は${flAt(tp.run.t0).split(' ')[0]}の ${tp.run.pts}-${tp.run.opp} ラン${tp.run.wpGain != null ? `（勝率 +${Math.round(tp.run.wpGain)}）` : ''}。`);
    if (tp.ahead) parts.push(`${flAt(tp.ahead.t)} の逆転（${flScore(tp.ahead.as, tp.ahead.hs)}）以降リードを譲らず`);
    if (tp.sealed) parts.push(`${tp.ahead ? '、' : ''}${flAt(tp.sealed.t)} でほぼ決着。`);
    else if (tp.ahead) parts.push('。');
    const rows = [
        tp.low && (tp.hasWP
            ? { t: tp.low.t, big: `${pct(tp.low.wp)}%`, icon: '▼', txt: `${Wn} lowest win prob.`, when: `${flAt(tp.low.t)}・${flScore(tp.low.as, tp.low.hs)}` }
            : { t: tp.low.t, big: `-${deficit(tp.low)}`, icon: '▼', txt: `${Wn} largest deficit`, when: `${flAt(tp.low.t)}・${flScore(tp.low.as, tp.low.hs)}` }),
        tp.run && { t: (tp.run.t0 + tp.run.t1) / 2, big: tp.run.wpGain != null ? `+${Math.round(tp.run.wpGain)}` : `${tp.run.pts}-${tp.run.opp}`, icon: '★',
            txt: `Decisive run ${tp.run.pts}-${tp.run.opp}`, when: `${flAt(tp.run.t0)} → ${flAt(tp.run.t1)}${tp.run.wpGain != null ? `・win prob. +${Math.round(tp.run.wpGain)} pts` : ''}` },
        tp.ahead && { t: tp.ahead.t, big: `${tp.ahead.as}-${tp.ahead.hs}`, icon: '●', txt: `${Wn} ahead for good`, when: `${flAt(tp.ahead.t)}・${flEsc(tp.ahead.text)}` },
        tp.sealed && { t: tp.sealed.t, big: '90%', icon: '✓', txt: 'Sealed', when: `${flAt(tp.sealed.t)}・${flScore(tp.sealed.as, tp.sealed.hs)}・${Wn} win prob. stays 90%+` },
    ].filter(Boolean);
    return `<div class="fl-sum">${parts.join('')}</div>` + rows.map(r =>
        `<div class="fl-ev" data-t="${r.t}"><span class="fl-big" style="color:${FL_ACCENT}">${r.big}</span>
            <span>${r.txt} <span class="fl-when">${r.when}</span></span><span class="fl-tag tp">${r.icon}</span></div>`).join('');
}

// パネルの骨組み（選択欄の状態は flowOpts から復元）
function flowPanelHTML() {
    const sel = (id, opts, cur) => `<select id="${id}">${opts.map(([v, l]) => `<option value="${v}" ${+v === cur ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
    return `<div class="fl-controls">
            <div class="fl-seg" id="fl-mode">
                <button data-mode="score" class="${flowOpts.mode === 'score' ? 'active' : ''}">Score</button>
                <button data-mode="margin" class="${flowOpts.mode === 'margin' ? 'active' : ''}">Margin</button>
            </div>
            <div class="fl-th">
                <label>Run ${sel('fl-run-th', [[6, 6], [8, 8], [10, 10]], flowOpts.runTh)}+ pts</label>
                <label>Allow opp. ${sel('fl-run-allow', [[0, 0], [2, 2], [4, 4]], flowOpts.allow)} pts</label>
                <label>Drought ${sel('fl-dry-th', [[120, '2:00'], [150, '2:30'], [180, '3:00']], flowOpts.dryTh)}+</label>
            </div>
        </div>
        <div class="fl-legend" id="fl-legend"></div>
        <div class="fl-chart-wrap"><svg id="fl-chart"></svg><div class="fl-tip" id="fl-tip"></div></div>
        <div class="ts-group">Turning Points</div><div id="fl-tps"></div>
        <div class="ts-group">Runs &amp; Droughts</div><div id="fl-events"></div>`;
}

function bindFlowControls() {
    const rerender = () => { flHideTip(); renderFlow(); };
    document.querySelectorAll('#fl-mode button').forEach(b => b.addEventListener('click', () => {
        flowOpts.mode = b.dataset.mode;
        document.querySelectorAll('#fl-mode button').forEach(x => x.classList.toggle('active', x === b));
        rerender();
    }));
    document.getElementById('fl-run-th')?.addEventListener('change', e => { flowOpts.runTh = +e.target.value; rerender(); });
    // 相手の得点を許すときは、基準も 10 点以上を初期値にする（その後の手動変更は自由）
    document.getElementById('fl-run-allow')?.addEventListener('change', e => {
        flowOpts.allow = +e.target.value;
        flowOpts.runTh = flowOpts.allow >= 2 ? 10 : 8;
        document.getElementById('fl-run-th').value = flowOpts.runTh;
        rerender();
    });
    document.getElementById('fl-dry-th')?.addEventListener('change', e => { flowOpts.dryTh = +e.target.value; rerender(); });
}

// グラフの寸法（実際の表示幅で描く。縮小すると文字が読めなくなるため）
const FL = { W: 720, CH: 220, PAD_L: 34, PAD_R: 10, TOP: 22, LANE_H: 14 };
const flX = t => FL.PAD_L + (FL.W - FL.PAD_L - FL.PAD_R) * t / flow.end;

function renderFlow() {
    const svg = document.getElementById('fl-chart');
    if (!svg || !flow || !svg.parentElement.clientWidth) return;
    const A = flow.abbr, HEX = FL_HEX, { plays, periods, now, winner } = flow;
    FL.W = Math.max(300, svg.parentElement.clientWidth);
    FL.CH = FL.W < 500 ? 180 : 220;
    const { W, CH, PAD_L, PAD_R, TOP, LANE_H } = FL;
    const LANE_Y = TOP + CH + 30;
    svg.setAttribute('viewBox', `0 0 ${W} ${LANE_Y + LANE_H * 2 + 10}`);

    const runs = flRuns(flowOpts.runTh, flowOpts.allow);
    const tp = flTurningPoints(runs);
    const dry = flDroughts(flowOpts.dryTh);
    const last = plays.at(-1);
    const series = [{ t: 0, as: 0, hs: 0 }, ...plays, { t: now, as: last.as, hs: last.hs }];
    const x = flX;
    let yMin, yMax;
    if (flowOpts.mode === 'score') {
        yMin = 0; yMax = Math.max(20, Math.ceil(Math.max(last.as, last.hs) / 20) * 20);
    } else {
        const m = Math.max(...series.map(s => Math.abs(s.hs - s.as)));
        yMax = Math.ceil((m + 2) / 5) * 5; yMin = -yMax;
    }
    const y = v => TOP + CH - CH * (v - yMin) / (yMax - yMin);

    let g = '';
    // 連続得点の帯（★ = 決定的な流れ）
    runs.forEach(r => {
        const star = tp?.run === r;
        const rx = x(r.t0) - 2, rw = Math.max(4, x(r.t1) - x(r.t0) + 4);
        g += `<rect x="${rx}" y="${TOP}" width="${rw}" height="${CH}" fill="${HEX[r.side]}" opacity=".16"/>`;
        if (star) g += `<rect x="${rx}" y="${TOP}" width="${rw}" height="${CH}" fill="none" stroke="${FL_ACCENT}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
        g += `<text x="${(x(r.t0) + x(r.t1)) / 2}" y="${TOP - 6}" text-anchor="middle" font-size="11" font-weight="700" fill="${star ? FL_ACCENT : HEX[r.side]}" font-family="Oswald, sans-serif">${star ? '★' : ''}${r.pts}-${r.opp}</text>`;
    });
    // 目盛り（0 を基準に振る）
    const step = flowOpts.mode === 'score' ? 20 : (yMax > 20 ? 10 : 5);
    for (let v = Math.ceil(yMin / step) * step; v <= yMax; v += step) {
        g += `<line x1="${PAD_L}" x2="${W - PAD_R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 && flowOpts.mode === 'margin' ? '#55555f' : '#1f1f25'}"/>`;
        g += `<text x="${PAD_L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#8b8b95">${Math.abs(v)}</text>`;
    }
    // クォーター境界
    for (let p = 1; p <= periods; p++) {
        if (p > 1) g += `<line x1="${x(flPeriodStart(p))}" x2="${x(flPeriodStart(p))}" y1="${TOP}" y2="${LANE_Y + LANE_H * 2 + 6}" stroke="#33333b" stroke-dasharray="3 3"/>`;
        g += `<text x="${x(flPeriodStart(p) + flPeriodLen(p) / 2)}" y="${TOP + CH + 16}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8b8b95">${flPLabel(p)}</text>`;
    }
    // 線
    const stepPath = val => series.map((s, i) => i === 0 ? `M${x(s.t)},${y(val(s))}` : `H${x(s.t)}V${y(val(s))}`).join('');
    if (flowOpts.mode === 'score') {
        g += `<path d="${stepPath(s => s.as)}" fill="none" stroke="${HEX.a}" stroke-width="2"/>`;
        g += `<path d="${stepPath(s => s.hs)}" fill="none" stroke="${HEX.h}" stroke-width="2"/>`;
    } else {
        // 点差: 上 = home リード / 下 = away リード
        g += `<clipPath id="fl-up"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath>`;
        g += `<clipPath id="fl-dn"><rect x="0" y="${y(0)}" width="${W}" height="${CH}"/></clipPath>`;
        const area = stepPath(s => s.hs - s.as) + `H${x(now)}V${y(0)}H${x(0)}Z`;
        g += `<path d="${area}" fill="${HEX.h}" opacity=".35" clip-path="url(#fl-up)"/><path d="${area}" fill="${HEX.a}" opacity=".35" clip-path="url(#fl-dn)"/>`;
        g += `<path d="${stepPath(s => s.hs - s.as)}" fill="none" stroke="#f2f2f4" stroke-width="1.5"/>`;
        g += `<text x="${PAD_L + 4}" y="${TOP + 12}" font-size="10.5" font-weight="700" fill="${HEX.h}">${A.h} lead ▲</text>`;
        g += `<text x="${PAD_L + 4}" y="${TOP + CH - 5}" font-size="10.5" font-weight="700" fill="${HEX.a}">${A.a} lead ▼</text>`;
    }
    // 無得点レーン（チームごとに1段）
    g += `<defs><pattern id="fl-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#2a2a31"/><line x1="0" y1="0" x2="0" y2="5" stroke="#5a5a64" stroke-width="2"/></pattern></defs>`;
    ['a', 'h'].forEach((side, i) => {
        const ly = LANE_Y + i * (LANE_H + 4);
        g += `<text x="${PAD_L - 6}" y="${ly + LANE_H - 3}" text-anchor="end" font-size="10" font-weight="700" fill="${HEX[side]}">${A[side]}</text>`;
        g += `<rect x="${PAD_L}" y="${ly}" width="${W - PAD_L - PAD_R}" height="${LANE_H}" fill="#18181c" rx="2"/>`;
        dry.filter(d => d.side === side).forEach(d => {
            const w = x(d.t1) - x(d.t0);
            g += `<rect x="${x(d.t0)}" y="${ly}" width="${w}" height="${LANE_H}" fill="url(#fl-hatch)" rx="2"/>`;
            if (w > 26) g += `<text x="${x(d.t0) + w / 2}" y="${ly + LANE_H - 3}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#f2f2f4">${flDur(d.t1 - d.t0)}</text>`;
        });
    });
    // 勝負の分かれ目の印: 線上の点＋縦の点線＋グラフ下端のラベル（横に重なるときは1段ずつ上へ）
    if (tp) {
        const valAt = w => flowOpts.mode === 'score' ? (winner === 'h' ? w.hs : w.as) : w.hs - w.as;
        const marks = [
            tp.low && { w: tp.low, label: tp.hasWP ? `▼ ${Math.round(tp.low.wp * 100)}%` : `▼ -${Math.abs(tp.low.hs - tp.low.as)}` },
            tp.ahead && { w: tp.ahead, label: '● Ahead' },
            tp.sealed && { w: tp.sealed, label: '✓ 90%+' },
        ].filter(Boolean);
        const placed = [];
        marks.forEach(m => {
            const mx = x(m.w.t), my = y(valAt(m.w));
            const lx = Math.min(W - PAD_R - 30, Math.max(PAD_L + 30, mx));
            let lv = 0;
            while (placed.some(p => p.lv === lv && Math.abs(p.lx - lx) < 64)) lv++;
            placed.push({ lx, lv });
            const ly = TOP + CH - 17 - lv * 19;
            g += `<line x1="${mx}" x2="${mx}" y1="${my}" y2="${ly + 15}" stroke="${FL_ACCENT}" stroke-width="1" stroke-dasharray="2 3" opacity=".8"/>`;
            g += `<rect x="${lx - 30}" y="${ly}" width="60" height="15" rx="3" fill="#141418" stroke="${FL_ACCENT}" stroke-width=".8"/>`;
            g += `<text x="${lx}" y="${ly + 11}" text-anchor="middle" font-size="10" font-weight="700" fill="${FL_ACCENT}">${m.label}</text>`;
            g += `<circle cx="${mx}" cy="${my}" r="4.5" fill="${FL_ACCENT}" stroke="#141418" stroke-width="2"/>`;
        });
    }
    // カーソルとタップ判定
    g += `<line id="fl-cursor" y1="${TOP}" y2="${TOP + CH}" stroke="${FL_ACCENT}" stroke-width="1" visibility="hidden"/>`;
    g += `<rect id="fl-hit" x="${PAD_L}" y="0" width="${W - PAD_L - PAD_R}" height="${LANE_Y + LANE_H * 2 + 6}" fill="transparent"/>`;
    svg.innerHTML = g;

    const runLegend = flowOpts.allow ? `Run (opp. ≤${flowOpts.allow})` : 'Run (unanswered)';
    const sw = (bg, label, extra = '') => `<span><i style="background:${bg};${extra}"></i>${label}</span>`;
    document.getElementById('fl-legend').innerHTML = flowOpts.mode === 'score'
        ? sw(HEX.a, A.a) + sw(HEX.h, A.h) + sw('#888', runLegend, 'opacity:.4') + sw('repeating-linear-gradient(45deg,#5a5a64 0 2px,#2a2a31 2px 5px)', 'Scoreless')
        : sw(HEX.h, `${A.h} lead`, 'opacity:.6') + sw(HEX.a, `${A.a} lead`, 'opacity:.6') + sw('#888', runLegend, 'opacity:.4');

    // Turning Points
    const tpsEl = document.getElementById('fl-tps');
    tpsEl.innerHTML = flTurningPointsHTML(tp);
    tpsEl.querySelectorAll('.fl-ev[data-t]').forEach(el => el.addEventListener('click', () => flShowAt(+el.dataset.t)));

    // 一覧（時系列）
    const evs = [
        ...runs.map(r => ({ t: r.t0, t0: r.t0, t1: r.t1, recv: flOther(r.side), kind: `${A[r.side]} の ${r.pts}-${r.opp} を受けた間`,
            w0: flow.all[r.a0]?.t ?? r.t0, a0: r.a0, a1: r.a1,
            html: `<span class="fl-big" style="color:${HEX[r.side]}">${r.pts}-${r.opp}</span>
            <span>${A[r.side]} run <span class="fl-when">${flAt(r.t0)} → ${flAt(r.t1)}・${flScore(...r.from)} → ${r.to[0]}-${r.to[1]}${r.wpGain != null ? `・Win% ${r.wpGain >= 0 ? '+' : ''}${Math.round(r.wpGain)}` : ''}</span></span>
            <span class="fl-tag run" style="background:${HEX[r.side]}">RUN</span>` })),
        ...dry.map(d => ({ t: d.t0, t0: d.t0, t1: d.t1, recv: d.side, kind: '無得点の間', w0: d.t0, a0: d.a0, a1: d.a1, open: d.open,
            html: `<span class="fl-big">${flDur(d.t1 - d.t0)}</span>
            <span>${A[d.side]} no points <span class="fl-when">${d.t0 === 0 ? 'Tip-off' : flAt(d.t0)} → ${d.open ? (flow.isOver ? 'Final' : 'Now') : flAt(d.t1)}</span></span>
            <span class="fl-tag dry">DRY</span>` })),
    ].sort((a, b) => a.t - b.t);
    const evEl = document.getElementById('fl-events');
    evEl.innerHTML = evs.map((e, i) => `<div class="fl-ev" data-i="${i}">${e.html}</div><div class="fl-rc" id="fl-rc-${i}"></div>`).join('')
        || '<div class="fl-msg">No runs or droughts at these thresholds</div>';
    // 行をタップ: グラフ上の位置を示し、内訳カードを開閉
    evEl.querySelectorAll('.fl-ev[data-i]').forEach(el => el.addEventListener('click', () => {
        const i = +el.dataset.i, e = evs[i], card = document.getElementById(`fl-rc-${i}`);
        flShowAt((e.t0 + e.t1) / 2);
        const open = !card.classList.contains('open');
        evEl.querySelectorAll('.fl-rc.open').forEach(c => { c.classList.remove('open'); c.innerHTML = ''; });
        evEl.querySelectorAll('.fl-ev.sel').forEach(c => c.classList.remove('sel'));
        if (open) { card.innerHTML = flRecvCard(e); card.classList.add('open'); el.classList.add('sel'); }
    }));

    const hit = document.getElementById('fl-hit');
    const move = ev => {
        const r = svg.getBoundingClientRect();
        const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
        flShowAt(Math.max(0, Math.min(now, (px * W / r.width - PAD_L) / (W - PAD_L - PAD_R) * flow.end)));
    };
    hit.addEventListener('mousemove', move);
    hit.addEventListener('touchstart', move, { passive: true });
    hit.addEventListener('touchmove', move, { passive: true });
    hit.addEventListener('mouseleave', flHideTip);
}

// その時点のスコアと直前の得点プレー
function flShowAt(t) {
    const svg = document.getElementById('fl-chart'), tip = document.getElementById('fl-tip'), c = document.getElementById('fl-cursor');
    if (!svg || !tip || !c) return;
    const A = flow.abbr;
    const last = [...flow.plays].reverse().find(p => p.t <= t);
    c.setAttribute('x1', flX(t)); c.setAttribute('x2', flX(t)); c.setAttribute('visibility', 'visible');
    tip.innerHTML = `<div class="t">${flAt(t)}</div>
        <b style="color:${FL_HEX.a}">${A.a} ${last?.as ?? 0}</b> – <b style="color:${FL_HEX.h}">${last?.hs ?? 0} ${A.h}</b>
        ${last ? `<div class="p">Last: ${flEsc(last.text)}</div>` : ''}`;
    tip.style.display = 'block';
    const r = svg.getBoundingClientRect();
    const px = flX(t) * r.width / FL.W;
    tip.style.left = `${Math.min(r.width - tip.offsetWidth, Math.max(0, px + (px > r.width / 2 ? -tip.offsetWidth - 10 : 10)))}px`;
}
function flHideTip() {
    const tip = document.getElementById('fl-tip');
    if (tip) tip.style.display = 'none';
    document.getElementById('fl-cursor')?.setAttribute('visibility', 'hidden');
}

const flowPanelActive = () => document.querySelector(`.box-team-panel[data-idx="${FLOW_IDX}"]`)?.classList.contains('active');
let flowResizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(flowResizeTimer);
    flowResizeTimer = setTimeout(() => { if (flowPanelActive()) { flHideTip(); renderFlow(); } }, 150);
});

// 試合中: モーダルを開いている間は 5 分ごとに取り直して描き直す
function startFlowRefresh(event, away, home) {
    stopFlowRefresh();
    flowTimer = setInterval(async () => {
        if (!document.getElementById('box-modal').classList.contains('open')) return stopFlowRefresh();
        const data = await fetchBoxScore(event.id);
        if (!data?.plays) return;
        const over = !!data.header?.competitions?.[0]?.status?.type?.completed;
        const nextRot = buildRotation(data, away, home, over);
        if (nextRot) {
            rotation = nextRot;
            const rp = document.querySelector(`.box-team-panel[data-idx="${ROT_IDX}"]`);
            if (rp && !document.getElementById('rt-grid')) { rp.innerHTML = rotationPanelHTML(); bindRotationControls(); }
            if (rp?.classList.contains('active')) renderRotation();
        }
        const next = buildFlow(data, away, home, over);
        if (!next) return;
        flow = next;
        // 開いた時点でプレーがなく骨組みを作っていなかった場合
        const panel = document.querySelector(`.box-team-panel[data-idx="${FLOW_IDX}"]`);
        if (panel && !document.getElementById('fl-chart')) { panel.innerHTML = flowPanelHTML(); bindFlowControls(); }
        if (flowPanelActive()) { flHideTip(); renderFlow(); }
        if (over) stopFlowRefresh();
    }, FL_REFRESH_MS);
}
function stopFlowRefresh() { clearInterval(flowTimer); flowTimer = null; }

/* ── Rotation: 交代記録から再現した出場時間 ── */
const ROT_IDX = 2;                 // モーダル内タブの位置（Flow の次）
let rotation = null;               // { a, h, periods, end, now, plays, abbr }
const rotOpts = { team: 'a', color: 'team' };
let rotCursor = null, rotSel = null;

// フリースローの途中の交代は、+/- の区切りをその一連のフリースローの最後にずらす
// （NBA の +/- はファウルの時点でコートにいた選手にフリースローの得点を数えるため）
const RT_FT_RE = /Free Throw - (?:Flagrant )?\d of \d/;
function rtFtTripEnd(plays, i) {
    const t = plays[i].t;
    let end = i;
    for (let j = i + 1; j < plays.length && plays[j].t === t; j++) {
        if (/Foul/.test(plays[j].type) && !RT_FT_RE.test(plays[j].type)) break;   // 交代の後の新しいファウルは別のフリースロー
        if (RT_FT_RE.test(plays[j].type)) end = j;
    }
    return end;
}

// 各クォーターの開始時の5人: そのクォーターで「交代で入る」より先に何かのプレーに登場した選手、
// または交代で「下がる」側で先に登場した選手。足りなければ前のクォーター終了時にいた選手で補う
function rtBuildTeam(side, teamData, plays, periods, now) {
    const sg = teamData?.statistics?.[0];
    if (!sg?.athletes?.length) return null;
    const names = sg.names || [], keys = sg.keys || [];
    const iMin = getStatIdx(names, keys, 'MIN', 'minutes'), iPm = getStatIdx(names, keys, '+/-', 'plusMinus');
    const roster = sg.athletes.map(a => ({
        id: a.athlete?.id, name: a.athlete?.shortName || a.athlete?.displayName || '—', starter: !!a.starter,
        min: iMin >= 0 ? a.stats?.[iMin] ?? '' : '', pm: iPm >= 0 ? a.stats?.[iPm] ?? '' : '', stints: [],
    })).filter(r => r.id);
    const byId = Object.fromEntries(roster.map(r => [r.id, r]));
    const scoreAfter = i => i >= 0 ? [plays[i].as, plays[i].hs] : [0, 0];
    const mine = side === 'a' ? 0 : 1, opp = 1 - mine;
    const start = {};
    const close = (q, t1, i1) => {
        const s = start[q];
        if (!s || !byId[q]) return;
        const s0 = scoreAfter(s.i), s1 = scoreAfter(i1);
        const pf = s1[mine] - s0[mine], pa = s1[opp] - s0[opp];
        if (t1 > s.t) byId[q].stints.push({ t0: s.t, t1, pf, pa, pm: pf - pa });
        delete start[q];
    };
    let on = new Set(roster.filter(r => r.starter).map(r => r.id)), prevEnd = on;
    for (let per = 1; per <= periods; per++) {
        const pp = plays.filter(x => x.p === per);
        if (!pp.length) continue;
        if (per > 1) {
            const seen = {};
            pp.forEach(x => {
                if (x.type === 'Substitution' && x.side === side) {
                    const [i, o] = x.ids;
                    if (!(i in seen)) seen[i] = 'in';
                    if (!(o in seen)) seen[o] = 'on';
                } else x.ids.forEach(q => { if (byId[q] && !(q in seen)) seen[q] = 'on'; });
            });
            on = new Set(Object.keys(seen).filter(q => seen[q] === 'on'));
            for (const q of prevEnd) { if (on.size >= 5) break; if (!(q in seen)) on.add(q); }
        }
        on.forEach(q => { start[q] = { t: flPeriodStart(per), i: pp[0].i - 1 }; });
        pp.forEach(x => {
            if (x.type !== 'Substitution' || x.side !== side) return;
            const [inId, outId] = x.ids;
            const bi = rtFtTripEnd(plays, x.i);
            if (on.has(outId)) { close(outId, x.t, bi); on.delete(outId); }
            on.add(inId); start[inId] = { t: x.t, i: bi };
        });
        // 試合中の最終クォーターは最新プレーまで
        const pend = Math.min(flPeriodStart(per) + flPeriodLen(per), now);
        on.forEach(q => close(q, pend, pp.at(-1).i));
        prevEnd = new Set(on);
    }
    roster.forEach(r => {
        r.sec = r.stints.reduce((s, x) => s + x.t1 - x.t0, 0);
        const boxMin = parseInt(r.min);
        // 交代記録とボックススコアの出場時間が 1 分を超えてずれる選手（記録の抜けや誤り）
        r.mismatch = !isNaN(boxMin) && Math.abs(r.sec / 60 - boxMin) > 1;
    });
    return roster;
}

function buildRotation(data, away, home, isOver) {
    const side = { [away.team.id]: 'a', [home.team.id]: 'h' };
    const plays = (data.plays || []).map((x, i) => ({
        i, p: x.period?.number || 1, t: flElapsed(x.period?.number || 1, x.clock?.displayValue ?? '0'),
        side: side[x.team?.id] || '', type: (x.type?.text || '').replace(/\n/g, ' '),
        as: x.awayScore ?? 0, hs: x.homeScore ?? 0, ids: (x.participants || []).map(q => q.athlete?.id),
    }));
    if (!plays.some(x => x.type === 'Substitution')) return null;
    const periods = Math.max(4, ...plays.map(x => x.p));
    const end = flPeriodStart(periods) + flPeriodLen(periods);
    const now = isOver ? end : plays.at(-1).t;
    const teamData = id => data.boxscore?.players?.find(t => t.team?.id === id);
    const a = rtBuildTeam('a', teamData(away.team.id), plays, periods, now);
    const h = rtBuildTeam('h', teamData(home.team.id), plays, periods, now);
    if (!a || !h) return null;
    return { a, h, plays, periods, end, now, abbr: { a: normAbbr(away.team.abbreviation), h: normAbbr(home.team.abbreviation) } };
}

// 区間 [t0, t1) にコートにいた選手と、その間の出場秒数（Flow の内訳カード用）
function rtOnCourt(side, t0, t1) {
    const R = rotation?.[side];
    if (!R) return null;
    return R.map(r => ({ name: r.name, sec: r.stints.reduce((s, x) => s + Math.max(0, Math.min(x.t1, t1) - Math.max(x.t0, t0)), 0) }))
        .filter(r => r.sec > 0).sort((x, y) => y.sec - x.sec);
}

const rtSigned = v => v > 0 ? `+${v}` : `${v}`;
const rtCls = v => v > 0 ? 'rt-pos' : v < 0 ? 'rt-neg' : '';
const rtPmColor = pm => {
    if (pm === 0) return 'rgba(139,139,149,.55)';
    const a = Math.min(1, 0.35 + Math.abs(pm) / 12);
    return pm > 0 ? `rgba(61,220,132,${a})` : `rgba(255,107,97,${a})`;
};

function rotationPanelHTML() {
    const A = rotation.abbr;
    return `<div class="rt-controls">
            <div class="fl-seg" id="rt-team">${['a', 'h'].map(s => `<button data-t="${s}" class="${s === rotOpts.team ? 'active' : ''}">${A[s]}</button>`).join('')}</div>
            <div><span class="rt-seg-label">Bar color</span><div class="fl-seg" id="rt-color">
                <button data-c="team" class="${rotOpts.color === 'team' ? 'active' : ''}">On court</button>
                <button data-c="pm" class="${rotOpts.color === 'pm' ? 'active' : ''}">+/-</button>
            </div></div>
        </div>
        <div class="fl-legend" id="rt-legend"></div>
        <div class="rt-info" id="rt-info"></div>
        <div class="rt-grid" id="rt-grid"></div>
        <div class="rt-hint">MIN・+/- はボックススコアの値。バーの +/- は交代記録から再現した目安で、記録の順序により数点ずれることがあります。</div>`;
}

function bindRotationControls() {
    document.querySelectorAll('#rt-team button').forEach(b => b.addEventListener('click', () => {
        rotOpts.team = b.dataset.t; rotSel = null;
        document.querySelectorAll('#rt-team button').forEach(x => x.classList.toggle('active', x === b));
        renderRotation();
    }));
    document.querySelectorAll('#rt-color button').forEach(b => b.addEventListener('click', () => {
        rotOpts.color = b.dataset.c;
        document.querySelectorAll('#rt-color button').forEach(x => x.classList.toggle('active', x === b));
        renderRotation();
    }));
    document.getElementById('rt-grid')?.addEventListener('click', e => {
        const bar = e.target.closest('.rt-bar');
        if (bar) { rotSel = rotSel === bar.dataset.bar ? null : bar.dataset.bar; rotCursor = null; renderRotation(); return; }
        const track = e.target.closest('.rt-track');
        if (!track) return;
        const r = track.getBoundingClientRect();
        rotCursor = Math.max(0, Math.min(rotation.now, (e.clientX - r.left) / r.width * rotation.end));
        rotSel = null; renderRotation();
    });
}

// 点差の帯（選んだチームのリードが上）
function rtMarginSVG(team) {
    const { plays, end, now } = rotation;
    const pts = [[0, 0], ...plays.map(x => [x.t, team === 'a' ? x.as - x.hs : x.hs - x.as])];
    pts.push([now, pts.at(-1)[1]]);
    const m = Math.max(5, ...pts.map(p => Math.abs(p[1])));
    const X = t => t / end * 1000, Y = v => 23 - 21 * v / m;
    const d = pts.map((p, i) => i === 0 ? `M${X(p[0])},${Y(p[1])}` : `H${X(p[0])}V${Y(p[1])}`).join('');
    const area = d + `H${X(now)}V23H0Z`;
    const c = FL_HEX[team], o = FL_HEX[flOther(team)];
    return `<svg viewBox="0 0 1000 46" preserveAspectRatio="none">
        <clipPath id="rt-mu"><rect x="0" y="0" width="1000" height="23"/></clipPath><clipPath id="rt-md"><rect x="0" y="23" width="1000" height="23"/></clipPath>
        <path d="${area}" fill="${c}" opacity=".45" clip-path="url(#rt-mu)"/><path d="${area}" fill="${o}" opacity=".45" clip-path="url(#rt-md)"/>
        <line x1="0" x2="1000" y1="23" y2="23" stroke="#55555f" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <path d="${d}" fill="none" stroke="#f2f2f4" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    </svg>`;
}

function renderRotation() {
    const grid = document.getElementById('rt-grid');
    if (!grid || !rotation) return;
    const team = rotOpts.team, R = rotation[team], A = rotation.abbr, { end, periods } = rotation;
    const played = R.filter(r => r.stints.length);
    const starters = played.filter(r => r.starter);
    const bench = played.filter(r => !r.starter).sort((a, b) => b.sec - a.sec);
    const dnp = R.filter(r => !r.stints.length);
    const onNow = new Set(rotCursor == null ? [] : R.filter(r => r.stints.some(s => rotCursor >= s.t0 && rotCursor < s.t1)).map(r => r.id));
    // 延長があれば列（区切り線）も増やす
    const qLines = Array.from({ length: periods - 1 }, (_, k) => 100 * flPeriodStart(k + 2) / end);
    const qBg = qLines.map(p => `linear-gradient(to right, transparent calc(${p}% - 1px), #33333b calc(${p}% - 1px), #33333b ${p}%, transparent ${p}%)`).join(',');
    const qLabels = Array.from({ length: periods }, (_, k) => {
        const p = k + 1;
        return `<span style="left:${100 * (flPeriodStart(p) + flPeriodLen(p) / 2) / end}%">${flPLabel(p)}</span>`;
    }).join('');

    const bar = (r, s, k) => {
        const left = 100 * s.t0 / end, w = 100 * (s.t1 - s.t0) / end;
        const bg = rotOpts.color === 'pm' ? rtPmColor(s.pm) : FL_HEX[team];
        const label = rotOpts.color === 'pm' && w > 4.5 ? rtSigned(s.pm) : '';
        const key = `${r.id}:${k}`;
        return `<div class="rt-bar ${rotSel === key ? 'sel' : ''}" data-bar="${key}" style="left:${left}%;width:${w}%;background:${bg}">${label}</div>`;
    };
    const row = r => {
        const pm = parseInt(r.pm);
        return `<div class="rt-row ${onNow.has(r.id) ? 'hl' : ''} ${r.stints.length ? '' : 'dnp'}">
            <div class="rt-name">${flEsc(r.name)}${r.mismatch ? '<span class="rt-warn" title="交代記録とボックススコアの出場時間がずれています">⚠</span>' : ''}</div>
            <div class="rt-track" style="background-image:${qBg}">${r.stints.map((s, k) => bar(r, s, k)).join('')}</div>
            <div class="rt-stat"><span>${r.min || '-'}</span><span class="${rtCls(pm)}">${isNaN(pm) ? '-' : rtSigned(pm)}</span></div>
        </div>`;
    };
    const sep = label => `<div class="rt-row sep"><div class="rt-name">${label}</div><div></div><div></div></div>`;
    grid.innerHTML = `
        <div class="rt-row head"><div class="rt-name"></div><div class="rt-qlabels">${qLabels}</div><div class="rt-stat"><span>MIN</span><span>+/-</span></div></div>
        <div class="rt-row"><div class="rt-name rt-lead">${A[team]} lead ▲</div><div class="rt-track rt-margin" style="background-image:${qBg}">${rtMarginSVG(team)}</div><div></div></div>
        ${sep('Starters')}${starters.map(row).join('')}
        ${sep('Bench')}${bench.map(row).join('')}
        ${dnp.length ? sep('DNP') + dnp.map(row).join('') : ''}
        <div class="rt-cursor" id="rt-cursor"></div>`;

    document.getElementById('rt-legend').innerHTML = rotOpts.color === 'pm'
        ? `<span><i style="background:rgba(61,220,132,.9)"></i>出場中にリードを広げた</span><span><i style="background:rgba(255,107,97,.9)"></i>縮められた</span><span><i style="background:rgba(139,139,149,.55)"></i>±0</span>`
        : `<span><i style="background:${FL_HEX[team]}"></i>コートにいた時間</span>`;

    // 選んだ時点／出場区間の情報
    const info = document.getElementById('rt-info');
    if (rotSel) {
        const [id, k] = rotSel.split(':');
        const r = R.find(x => x.id === id), s = r?.stints[+k];
        info.innerHTML = s ? `<b>${flEsc(r.name)}</b> ${flAtR(s.t0)} → ${flAtR(s.t1)}（${flDur(s.t1 - s.t0)}）<br>出場中 <b>${s.pf}-${s.pa}</b> <span class="${rtCls(s.pm)}">${rtSigned(s.pm)}</span>` : '';
    } else if (rotCursor != null) {
        const last = [...rotation.plays].reverse().find(x => x.t <= rotCursor);
        const names = R.filter(r => onNow.has(r.id)).map(r => flEsc(r.name)).join('・');
        info.innerHTML = `<b>${flAtR(rotCursor)}</b>　${A.a} ${last?.as ?? 0}-${last?.hs ?? 0} ${A.h}<br>On court: ${names || '—'}`;
    } else {
        info.innerHTML = '<span class="rt-muted">グラフをタップすると、その時点でコートにいた5人を表示します。バーをタップすると、その出場区間の得失点を表示します</span>';
    }
    rtPlaceCursor();
}

// Flow と同じ書式（Q3 10:42）。Flow を開いていない試合でも使えるよう rotation の期数で数える
function flAtR(t) {
    let p = 1;
    while (p < rotation.periods && t >= flPeriodStart(p + 1)) p++;
    const rem = flPeriodStart(p) + flPeriodLen(p) - t;
    return `${flPLabel(p)} ${rem >= 60 ? flDur(rem) : rem.toFixed(1)}`;
}

function rtPlaceCursor() {
    const c = document.getElementById('rt-cursor'), track = document.querySelector('#rt-grid .rt-track');
    if (!c || !track || rotCursor == null) return;
    const g = document.getElementById('rt-grid').getBoundingClientRect(), tr = track.getBoundingClientRect();
    c.style.left = `${tr.left - g.left + tr.width * rotCursor / rotation.end}px`;
    c.style.display = 'block';
}
window.addEventListener('resize', rtPlaceCursor);

document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('box-modal').classList.contains('open')) closeBoxScoreModal();
});

function getStatIdx(names, keys, ...candidates) {
    for (const c of candidates) {
        let i = names.indexOf(c);
        if (i >= 0) return i;
        if (keys) { i = keys.indexOf(c); if (i >= 0) return i; }
    }
    return -1;
}

// チームロスターから選手ごとの NBA 経験年数を取得（athleteId → years）
const rosterExpCache = new Map();
function fetchTeamExperience(teamId) {
    if (!rosterExpCache.has(teamId)) {
        rosterExpCache.set(teamId, fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/${teamId}/roster`)
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(d => new Map((d.athletes || [])
                .filter(a => a.experience?.years != null)
                .map(a => [String(a.id), a.experience.years])))
            .catch(() => { rosterExpCache.delete(teamId); return new Map(); }));
    }
    return rosterExpCache.get(teamId);
}

// 新人は years が 0 または 1 で返るため両方 Rookie 扱い
const expClass = years => years == null ? null
    : years <= 1 ? 'rookie' : years === 2 ? 'sophomore' : 'veteran';

let topPlayersAll = [];
// 経験年数の絞り込み状態（Top 10 / Off Nights で別々に持つ）
const playerListFilter = { top: 'all', off: 'all' };
// Top 10 の並び順。AST/TO は TO=0 のとき AST をそのまま比率として扱う
const TOP_SORTS = {
    pra: p => p.total,
    pts: p => p.pts,
    ast: p => p.ast,
    reb: p => p.reb,
    tpm: p => parseInt(p.threeP) || 0,
    stl: p => parseInt(p.stl) || 0,
    blk: p => parseInt(p.blk) || 0,
    ato: p => p.ast ? p.ast / Math.max(parseInt(p.tov) || 0, 1) : 0,
};
let topSort = 'pra';
const OFF_NIGHTS_MIN = 20;

async function extractTopPlayers(events) {
    const completed = events.filter(e =>
        e.status.type.completed || e.status.type.state === 'post'
    );
    if (!completed.length) return [];

    const summaries = await Promise.all(completed.map(e => fetchBoxScore(e.id)));
    const teamIds = [...new Set(summaries.flatMap(d => (d?.boxscore?.players || []).map(t => t.team?.id)).filter(Boolean))];
    const expMaps = new Map(await Promise.all(teamIds.map(async id => [id, await fetchTeamExperience(id)])));
    const players = [];

    summaries.forEach(data => {
        if (!data?.boxscore?.players) return;
        const gamePie = pieNum(sumBoxLines(data.boxscore.players.map(teamBoxTotals)));
        data.boxscore.players.forEach(teamData => {
            const teamAbbr = normAbbr(teamData.team?.abbreviation || '');
            const expMap = expMaps.get(teamData.team?.id);
            (teamData.statistics || []).forEach(sg => {
                const names = sg.names || [];
                const keys  = sg.keys  || [];
                const iP   = getStatIdx(names, keys, 'PTS',  'pts');
                const iR   = getStatIdx(names, keys, 'REB',  'reb');
                const iA   = getStatIdx(names, keys, 'AST',  'ast');
                const iFG  = getStatIdx(names, keys, 'FG',   'fg');
                const i3PT = getStatIdx(names, keys, '3PT',  '3pt');
                const iOR  = getStatIdx(names, keys, 'OREB', 'oreb');
                const iDR  = getStatIdx(names, keys, 'DREB', 'dreb');
                const iS   = getStatIdx(names, keys, 'STL',  'stl');
                const iB   = getStatIdx(names, keys, 'BLK',  'blk');
                const iTO  = getStatIdx(names, keys, 'TO',   'to', 'TOV', 'tov');
                const iPF  = getStatIdx(names, keys, 'PF',   'pf');
                const iPM  = getStatIdx(names, keys, '+/-',  'plusMinus');

                (sg.athletes || []).forEach(a => {
                    if (a.didNotPlay) return;
                    const s = a.stats;
                    if (!s?.length) return;
                    const get = i => (i >= 0 && s[i] != null) ? String(s[i]) : '0';
                    const pts = parseInt(get(iP)) || 0;
                    const reb = parseInt(get(iR)) || 0;
                    const ast = parseInt(get(iA)) || 0;
                    const line = parseBoxLine(sg, a);

                    players.push({
                        name:   a.athlete?.displayName || '—',
                        jersey: a.athlete?.jersey || '',
                        photo:  a.athlete?.headshot?.href || '',
                        team:   teamAbbr,
                        teamColor: teamData.team?.color || '',
                        exp:    expClass(expMap?.get(String(a.athlete?.id))),
                        pts, reb, ast,
                        total:  pts + reb + ast,
                        fg:     get(iFG),
                        threeP: get(i3PT),
                        oreb:   get(iOR),
                        dreb:   get(iDR),
                        stl:    get(iS),
                        blk:    get(iB),
                        tov:    get(iTO),
                        pf:     get(iPF),
                        pm:     get(iPM),
                        min:    line?.min ?? 0,
                        pie:    line && gamePie ? 100 * pieNum(line) / gamePie : null,
                    });
                });
            });
        });
    });

    return players.sort((a, b) => b.total - a.total);
}

function setTopPlayers(players) {
    topPlayersAll = players;
    renderPlayerLists();
}

document.querySelectorAll('.tp-filter[data-list]').forEach(group =>
    group.querySelectorAll('.conf-btn').forEach(btn =>
        btn.addEventListener('click', () => {
            playerListFilter[group.dataset.list] = btn.dataset.exp;
            group.querySelectorAll('.conf-btn').forEach(b => b.classList.toggle('active', b === btn));
            renderPlayerLists();
        })
    )
);

document.getElementById('top-sort')?.addEventListener('change', e => {
    topSort = e.target.value;
    renderPlayerLists();
});

const byExp = list => p => playerListFilter[list] === 'all' || p.exp === playerListFilter[list];

function renderPlayerLists() {
    // Top 10: 選んだスタッツの多い順（その値が 0 の選手は除外）。同値は AST → PTS+REB+AST の多い順
    const key = TOP_SORTS[topSort];
    renderPlayerList('top-players', topPlayersAll
        .filter(p => key(p) > 0)
        .filter(byExp('top'))
        .sort((a, b) => key(b) - key(a)
            || (topSort === 'ato' ? b.ast - a.ast : 0)
            || b.total - a.total)
        .slice(0, 10), 'top');
    // Off Nights: 20分以上出場した選手を PIE の低い順
    renderPlayerList('off-nights', topPlayersAll
        .filter(p => p.min >= OFF_NIGHTS_MIN && p.pie != null)
        .filter(byExp('off'))
        .sort((a, b) => a.pie - b.pie)
        .slice(0, 10), 'off');
}

function renderPlayerList(elId, players, mode) {
    const el = document.getElementById(elId);
    if (!el) return;
    if (!players.length) {
        el.innerHTML = '<div class="msg">No data</div>';
        return;
    }

    el.innerHTML = players.map((p, i) => {
        const pmRaw = String(p.pm).replace(/^\+/, '');
        const pmFmt = pmRaw.startsWith('-') ? pmRaw : (pmRaw === '0' ? '±0' : `+${pmRaw}`);
        const orebN = parseInt(p.oreb) || 0;
        const drebN = parseInt(p.dreb) || 0;
        const rebDetail = (orebN || drebN) ? `${orebN}-${drebN}` : String(p.reb);
        const fgFmt    = String(p.fg).replace('-', '/');
        const threeFmt = String(p.threeP).replace('-', '/');
        const photoEl = p.photo
            ? `<img class="tp-photo" src="${p.photo}" alt="${p.name}" onerror="this.style.display='none'">`
            : `<div class="tp-photo-placeholder">${p.name.charAt(0)}</div>`;

        // Top 10 は並び替えに使ったスタッツを先頭に大きく出し、残りの PTS/REB/AST を続ける
        const base = ['pts', 'reb', 'ast'].map(k => [k, p[k]]);
        const extra = {
            tpm: [parseInt(p.threeP) || 0, '3pm'],
            stl: [p.stl, 'stl'],
            blk: [p.blk, 'blk'],
            ato: [TOP_SORTS.ato(p).toFixed(1), 'ast/to'],
        }[topSort];
        const leadKey = extra ? null : topSort === 'pra' ? 'pts' : topSort;
        const [leadVal, leadLbl] = extra || [p[leadKey], leadKey];
        const rest = base.filter(([k]) => k !== leadKey);
        // Off Nights は PIE と出場時間を主役に、低評価の理由になる数字をチップで添える
        const mainStats = mode === 'off'
            ? `<span class="tp-stat-lbl">PIE</span> <span class="off-pie">${p.pie.toFixed(1)}</span>
                    <span class="tp-stat-sep">/</span>
                    <span class="tp-stat-lbl">${p.min} min</span>
                    <span class="tp-stat-sep">/</span>
                    <span class="tp-stat-lbl">${p.pts} pts · ${p.reb} reb · ${p.ast} ast</span>`
            : `<span class="tp-pts-val">${leadVal}</span><span class="tp-stat-lbl">${leadLbl}</span>
                    ${rest.map(([k, v]) => `<span class="tp-stat-sep">/</span>
                    <span class="tp-reb-val">${v}</span><span class="tp-stat-lbl">${k}</span>`).join('')}`;
        const chips = mode === 'off'
            ? `<span class="tp-chip"><strong>${fgFmt}</strong> FG</span>
                    <span class="tp-chip"><strong>${threeFmt}</strong> 3P</span>
                    <span class="tp-chip">TOV <strong>${p.tov}</strong></span>
                    <span class="tp-chip">PF <strong>${p.pf}</strong></span>
                    <span class="tp-chip"><strong>${pmFmt}</strong></span>`
            : `<span class="tp-chip"><strong>${fgFmt}</strong> FG</span>
                    <span class="tp-chip"><strong>${threeFmt}</strong> 3P</span>
                    <span class="tp-chip">REB <strong>${rebDetail}</strong></span>
                    <span class="tp-chip">STL <strong>${p.stl}</strong></span>
                    <span class="tp-chip">BLK <strong>${p.blk}</strong></span>
                    <span class="tp-chip">TOV <strong>${p.tov}</strong></span>
                    <span class="tp-chip">PF <strong>${p.pf}</strong></span>
                    <span class="tp-chip"><strong>${pmFmt}</strong></span>`;

        return `
        <div class="tp-item" style="${/^[0-9a-f]{6}$/i.test(p.teamColor) ? `--tc:#${p.teamColor}` : ''}">
            <div class="tp-rank">${i + 1}</div>
            ${photoEl}
            <div class="tp-body">
                <div class="tp-name-row">
                    <span class="tp-name">${p.name}</span>
                    ${p.jersey ? `<span class="tp-team">#${p.jersey}</span>` : ''}
                    <span class="tp-team">${p.team}</span>
                </div>
                <div class="tp-main-stats">
                    ${mainStats}
                </div>
                <div class="tp-detail-row">
                    ${chips}
                </div>
            </div>
        </div>`;
    }).join('');
}

/* ── Injury Report ── */
async function fetchInjuryPlayers(events) {
    if (!events?.length) return [];
    const summaries = await Promise.all(events.map(e => fetchBoxScore(e.id)));
    const seen = new Set();
    const players = [];

    summaries.forEach(data => {
        if (!data?.injuries) return;
        data.injuries.forEach(teamInj => {
            const teamAbbr = normAbbr(teamInj.team?.abbreviation || '');
            (teamInj.injuries || []).forEach(inj => {
                const pid = inj.athlete?.id;
                if (pid && seen.has(pid)) return;
                if (pid) seen.add(pid);

                const details = inj.details || {};
                const side    = (details.side   || '').replace('Not Specified', '').trim();
                const type    = (details.type   || '').trim();
                const detail  = (details.detail || '').trim();
                const reason  = [side, type || detail].filter(Boolean).join(' ') || '—';

                players.push({
                    name:   inj.athlete?.displayName || '?',
                    jersey: inj.athlete?.jersey || '',
                    photo:  inj.athlete?.headshot?.href || '',
                    team:   teamAbbr,
                    status: inj.status || 'Out',
                    reason,
                });
            });
        });
    });

    // Sort: Out first, then Doubtful, Questionable, Day-To-Day; within each group by team
    const order = { 'Out': 0, 'Doubtful': 1, 'Questionable': 2, 'Day-To-Day': 3 };
    return players.sort((a, b) => {
        const so = (order[a.status] ?? 9) - (order[b.status] ?? 9);
        return so !== 0 ? so : a.team.localeCompare(b.team);
    });
}

function renderInjuryPlayers(players) {
    const el = document.getElementById('injury-players');
    if (!el) return;
    if (!players.length) {
        el.innerHTML = '<div class="msg">No injury report</div>';
        return;
    }

    const statusCfg = {
        'Out':        { cls: 'ip-out',  label: 'OUT'   },
        'Doubtful':   { cls: 'ip-d',    label: 'DOUBT' },
        'Questionable':{ cls: 'ip-q',   label: 'GTD'   },
        'Day-To-Day': { cls: 'ip-dtd',  label: 'D2D'   },
    };

    el.innerHTML = players.map(p => {
        const cfg = statusCfg[p.status] || { cls: 'ip-out', label: p.status.toUpperCase() };
        const photoEl = p.photo
            ? `<img class="ip-photo" src="${p.photo}" alt="${p.name}" onerror="this.style.display='none'">`
            : `<div class="ip-photo-placeholder">${p.name.charAt(0)}</div>`;
        return `
        <div class="ip-item">
            ${photoEl}
            <div class="ip-body">
                <div class="ip-name-row">
                    <span class="ip-name">${p.name}</span>
                    ${p.jersey ? `<span class="ip-team">#${p.jersey}</span>` : ''}
                    <span class="ip-team">${p.team}</span>
                </div>
                <div class="ip-reason">${p.reason}</div>
            </div>
            <span class="ip-status ${cfg.cls}">${cfg.label}</span>
        </div>`;
    }).join('');
}

/* ── Main ── */
async function init() {
    const btn = document.getElementById('refresh-btn');
    if (btn) { btn.disabled = true; btn.classList.add('spinning'); }

    const now = new Date();

    // 閲覧がJST環境のため、JST日付を基準にET日付を計算する
    // NBA試合は7pm+ ET = 翌日8am+ JST のため、JST今日の試合 = ET(JST今日-1日)
    const jstStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo' }).format(now);
    const [jy, jm, jd] = jstStr.split('-').map(Number);
    const etForJstToday     = new Date(Date.UTC(jy, jm - 1, jd - 1, 17, 0, 0));
    const etForJstTomorrow  = new Date(Date.UTC(jy, jm - 1, jd,     17, 0, 0));
    const etForJstYesterday = new Date(Date.UTC(jy, jm - 1, jd - 2, 17, 0, 0));

    document.getElementById('last-updated').textContent =
        'Updated: ' + now.toLocaleTimeString('en-US', { timeZone: 'Asia/Tokyo' });

    await loadStandings();
    renderStandingsTable('West');
    renderStandingsTable('East');
    renderLottery();

    try {
        const [todayEvents, scheduleEvents, yesterdayEvents] = await Promise.all([
            fetchEvents(etForJstToday),
            fetchEvents(etForJstTomorrow),
            fetchEvents(etForJstYesterday)
        ]);
        const resultsEvents = todayEvents;

        // Playoff auto-detection: competition.series is only present during playoffs
        isPlayoffMode = [...resultsEvents, ...scheduleEvents]
            .some(e => e.competitions?.[0]?.series != null);

        // Top Players: 当日完了済み試合があればその結果、なければ前日にフォールバック
        const todayCompleted = todayEvents.filter(e =>
            e.status.type.completed || e.status.type.state === 'post'
        );
        let topPlayerEvents, topPlayersDate;
        if (todayCompleted.length > 0) {
            topPlayerEvents = todayEvents;
            topPlayersDate  = now;
        } else {
            // 当日未開始またはライブ中のみ → 前日スタッツを表示
            topPlayerEvents = yesterdayEvents;
            topPlayersDate  = new Date(now.getTime() - 86400000);
        }

        document.getElementById('today-date').textContent       = resultsEvents.length  ? fmtJstDate(new Date(resultsEvents[0].date))  : fmtJstDate(now);
        document.getElementById('tomorrow-date').textContent    = scheduleEvents.length ? fmtJstDate(new Date(scheduleEvents[0].date)) : fmtJstDate(new Date(now.getTime() + 86400000));
        document.getElementById('yesterday-date').textContent   = yesterdayEvents.length ? fmtJstDate(new Date(yesterdayEvents[0].date)) : fmtJstDate(new Date(now.getTime() - 86400000));
        document.getElementById('top-players-date').textContent = fmtJstDate(topPlayersDate);
        document.getElementById('off-nights-date').textContent  = fmtJstDate(topPlayersDate);
        document.getElementById('injury-date').textContent      = todayEvents.length    ? fmtJstDate(new Date(todayEvents[0].date))    : fmtJstDate(now);
        renderGames(resultsEvents,  'today-games');
        renderGames(scheduleEvents, 'tomorrow-games');
        renderGames(yesterdayEvents, 'yesterday-games');
        extractTopPlayers(topPlayerEvents).then(setTopPlayers);
        fetchInjuryPlayers(todayEvents).then(renderInjuryPlayers);

    } catch (err) {
        console.error(err);
        ['today-games', 'tomorrow-games', 'yesterday-games'].forEach(id => {
            document.getElementById(id).innerHTML =
                '<div class="msg error">Failed to load data</div>';
        });
    } finally {
        if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
    }

    if (document.querySelectorAll('.status-live').length > 0) {
        setTimeout(init, 5 * 60 * 1000);
    }
}

init();

</script>
