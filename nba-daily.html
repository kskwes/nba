<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Daily</title>
    <link rel="stylesheet" href="nba-common.css">
    <style>
        /* ─── Refresh button ─── */
        .header-right {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .refresh-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-size: 15px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, transform 0.3s;
            flex-shrink: 0;
            padding: 0;
            line-height: 1;
        }

        .refresh-btn:hover:not(:disabled) { color: #fff; border-color: var(--blue); }
        .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .refresh-btn.spinning { animation: spin 0.8s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Section (game results) ─── */
        .section { margin-bottom: 36px; }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .section-bar { width: 4px; height: 26px; background: var(--red); border-radius: 2px; flex-shrink: 0; }

        .section-header h2 { font-size: 18px; font-weight: 800; }

        .date-badge {
            font-size: 10px;
            color: var(--muted);
            background: var(--surface2);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        /* ─── Game Grid / Card ─── */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 14px;
        }

        .card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: var(--surface);
            border-radius: 16px;
            padding: 18px 20px 20px;
            border: 1px solid var(--border);
            transition: transform 0.15s, border-color 0.15s;
            cursor: pointer;
        }

        .card { cursor: default; }
        .card.clickable { cursor: pointer; }
        .card.clickable:hover { transform: translateY(-2px); border-color: var(--blue); }
        .card.clickable:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

        .status {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 4px 0;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .status-final { background: rgba(201,8,42,.15); color: var(--red); }
        .status-live  { background: rgba(76,175,80,.15); color: #4caf50; animation: blink 1.6s ease-in-out infinite; }
        .status-sched { background: rgba(122,133,163,.1); color: var(--muted); }

        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.5} }

        .matchup { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

        .team { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }

        .logo { width: 60px; height: 60px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }

        .team-name { font-size: 12.5px; font-weight: 700; line-height: 1.3; color: #cdd5ef; }
        .team.winner .team-name { color: #fff; }
        .team-record { font-size: 11.5px; color: var(--muted); }
        .team-rank {
            font-size: 11px; font-weight: 700; color: var(--red);
            background: rgba(201,8,42,.12); padding: 1px 8px; border-radius: 10px;
        }
        .team-l10-row {
            display: flex; align-items: center; gap: 5px; margin-top: 2px;
        }
        .team-l10 {
            font-size: 10.5px; color: var(--muted);
        }
        .team-streak-badge {
            font-size: 8px; line-height: 1;
        }

        .center {
            display: flex; align-items: center; gap: 4px;
            min-width: 96px; justify-content: center; flex-shrink: 0; align-self: center;
        }

        .score { font-size: 28px; font-weight: 900; color: var(--muted); min-width: 38px; text-align: center; line-height: 1; }
        .score.win { color: #fff; }
        .dash { font-size: 20px; color: #4a5270; font-weight: 300; }
        .vs { font-size: 16px; font-weight: 800; color: var(--muted); letter-spacing: 2px; }

        .series-note {
            text-align: center;
            font-size: 10.5px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-top: 8px;
        }


        /* ─── Conf sub-tabs ─── */
        .conf-tabs { display: flex; gap: 8px; margin-bottom: 20px; }

        .conf-btn {
            padding: 6px 22px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--muted);
            font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.15s;
            text-decoration: none;
        }

        .conf-btn.active { background: var(--red); color: #fff; border-color: var(--red); }

        .conf-panel { display: none; }
        .conf-panel.active { display: block; }

        /* ─── Standings table ─── */
        .standings-wrap { overflow-x: auto; }

        .st-table { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }

        .st-table th {
            color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: 0.5px;
            padding: 7px 10px; text-align: right; border-bottom: 2px solid var(--border);
        }

        .st-table th:nth-child(1) { text-align: center; width: 30px; }
        .st-table th:nth-child(2) { text-align: left; }

        .st-table td {
            padding: 8px 10px; text-align: right;
            border-bottom: 1px solid rgba(37,45,74,0.5);
        }

        .st-table td:nth-child(1) { text-align: center; color: var(--muted); font-size: 11px; }
        .st-table td:nth-child(2) { text-align: left; }

        .st-team { display: flex; align-items: center; gap: 8px; }

        .st-logo { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }

        .st-abbr { font-weight: 700; }

.st-table tr.edge-playoff td { border-bottom: 2px solid var(--red); }
        .st-table tr.edge-playin td  { border-bottom: 1px dashed rgba(122,133,163,0.35); }

        /* ─── Standings + Lottery side-by-side ─── */
        .standings-lottery-wrap {
            display: flex;
            gap: 28px;
            align-items: flex-start;
        }

        .standings-col { flex: 1; min-width: 0; }

        /* ─── Lottery section ─── */
        .lottery-section {
            flex: 1;
            min-width: 0;
        }

        .lottery-section h3 { font-size: 18px; font-weight: 800; margin-bottom: 20px; }

        .lottery-sub { font-size: 11px; color: var(--muted); margin-top: 12px; }

        .lt-table { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }

        .lt-table th {
            color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: 0.5px;
            padding: 7px 10px; text-align: right; border-bottom: 2px solid var(--border);
        }

        .lt-table th:nth-child(1) { text-align: center; width: 30px; }
        .lt-table th:nth-child(2) { text-align: left; }

        .lt-table td {
            padding: 8px 10px; text-align: right;
            border-bottom: 1px solid rgba(37,45,74,0.5);
        }

        .lt-table td:nth-child(1) { text-align: center; color: var(--muted); font-size: 11px; }
        .lt-table td:nth-child(2) { text-align: left; }

        .lt-odds { color: #4caf50; font-weight: 700; }
        .lt-odds-dim { color: var(--muted); font-weight: 600; }
        .playin-mark { color: var(--muted); font-size: 10px; margin-left: 2px; }
        .lottery-note { font-size: 10.5px; color: var(--muted); margin-top: 12px; line-height: 1.6; }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .standings-lottery-wrap { flex-direction: column; align-items: stretch; }
            .lottery-section { border-top: 1px solid var(--border); padding-top: 28px; margin-top: 28px; }
            #lottery-list { overflow-x: auto; }
        }

        @media (max-width: 600px) {
            .section-header { flex-wrap: wrap; gap: 8px; }
            .conf-tabs {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                flex-wrap: nowrap;
            }
            .conf-tabs::-webkit-scrollbar { display: none; }
            .conf-btn { white-space: nowrap; flex-shrink: 0; }
        }

        @media (max-width: 480px) {
            .games-grid { grid-template-columns: 1fr; }
            header h1 { font-size: 22px; }
            .logo { width: 48px; height: 48px; }
            .score { font-size: 22px; }
            .team-name { font-size: 11px; }
            .center { min-width: 76px; }
            .tab-btn { padding: 9px 14px; font-size: 13px; }
            .conf-btn { font-size: 12px; padding: 5px 14px; }
        }

        /* ─── Games layout (左: 試合一覧 / 右: Top Players・Injury) ─── */
        .games-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .games-main { flex: 1 1 0; min-width: 0; }
        .games-side { flex: 0 0 360px; min-width: 0; }

        .games-main .games-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        /* カードを3列幅に合わせてスケールダウン */
        .games-main .card { padding: 12px 10px 14px; }
        .games-main .logo { width: 44px; height: 44px; }
        .games-main .score { font-size: 22px; min-width: 30px; }
        .games-main .center { min-width: 76px; }
        .games-main .team-name { font-size: 11px; }
        .games-main .team-record { font-size: 10px; }
        .games-main .team-rank { font-size: 10px; padding: 1px 5px; }
        .games-main .team-l10 { font-size: 10px; }
        .games-main .matchup { gap: 4px; }

        .top-players-col {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .tp-subtitle {
            font-size: 10px;
            color: var(--muted);
            background: rgba(122,133,163,0.1);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .tp-item {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(37,45,74,0.5);
        }

        .tp-item:last-child { border-bottom: none; }

        .tp-rank {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            background: var(--surface2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: var(--muted);
            margin-top: 3px;
        }

        .tp-item:nth-child(-n+3) .tp-rank { background: var(--blue); color: #fff; }

        .tp-photo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--surface2);
            border: 1px solid var(--border);
        }

        .tp-photo-placeholder {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
        }

        .tp-body { flex: 1; min-width: 0; }

        .tp-name-row {
            display: flex;
            align-items: baseline;
            gap: 5px;
            margin-bottom: 2px;
        }

        .tp-name {
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tp-team { font-size: 10px; color: var(--muted); flex-shrink: 0; }

        .tp-main-stats {
            display: flex;
            align-items: baseline;
            gap: 3px;
            margin-bottom: 5px;
        }

        .tp-pts-val { font-size: 14px; font-weight: 900; color: #fff; }
        .tp-reb-val { font-size: 12px; font-weight: 700; color: #64b5f6; }
        .tp-ast-val { font-size: 12px; font-weight: 700; color: #81c784; }
        .tp-stat-sep { font-size: 10px; color: #4a5270; margin: 0 1px; }
        .tp-stat-lbl { font-size: 9px; color: var(--muted); }

        .tp-total-badge {
            margin-left: 5px;
            font-size: 10px;
            font-weight: 700;
            color: var(--red);
            background: rgba(201,8,42,0.12);
            padding: 1px 6px;
            border-radius: 8px;
        }

        .tp-detail-row { display: flex; flex-wrap: wrap; gap: 3px; }

        .tp-chip {
            font-size: 9.5px;
            color: var(--muted);
            background: rgba(37,45,74,0.8);
            padding: 1px 5px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .tp-chip strong { color: #c8cfe8; }

        .injury-players-col {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .ip-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 14px;
            border-bottom: 1px solid rgba(37,45,74,0.5);
        }
        .ip-item:last-child { border-bottom: none; }

        .ip-photo {
            width: 30px; height: 30px;
            border-radius: 50%; object-fit: cover; flex-shrink: 0;
            background: var(--surface2); border: 1px solid var(--border);
        }
        .ip-photo-placeholder {
            width: 30px; height: 30px;
            border-radius: 50%; flex-shrink: 0;
            background: var(--surface2); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: var(--muted);
        }

        .ip-body { flex: 1; min-width: 0; }
        .ip-name-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 1px; }
        .ip-name {
            font-size: 11.5px; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ip-team { font-size: 10px; color: var(--muted); flex-shrink: 0; }
        .ip-reason { font-size: 10px; color: var(--muted); }

        .ip-status {
            flex-shrink: 0; font-size: 10px; font-weight: 800;
            padding: 2px 6px; border-radius: 5px; letter-spacing: 0.5px;
        }
        .ip-out  { background: rgba(201,8,42,0.15);   color: var(--red); }
        .ip-q    { background: rgba(255,193,7,0.15);   color: #ffc107; }
        .ip-d    { background: rgba(255,152,0,0.15);   color: #ff9800; }
        .ip-dtd  { background: rgba(122,133,163,0.15); color: var(--muted); }

        @media (max-width: 1060px) {
            .games-layout { flex-direction: column; align-items: stretch; }
            .games-main, .games-side { flex: none; width: 100%; }
        }

        @media (max-width: 700px) {
            .games-main .games-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .games-main .games-grid { grid-template-columns: 1fr; }
        }

        /* ─── Mobile: Top 10 / Injury をメインタブに分離 ─── */
        .tab-btn.mobile-only { display: none; }
        @media (max-width: 768px) {
            .tab-btn.mobile-only { display: inline-block; }
            .tabs-nav { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
            .tabs-nav::-webkit-scrollbar { display: none; }
            .tab-btn { white-space: nowrap; flex-shrink: 0; }
            #tab-games[data-view="games"] .games-side,
            #tab-games[data-view="top"] .games-main,
            #tab-games[data-view="top"] .injury-players-wrap,
            #tab-games[data-view="injury"] .games-main,
            #tab-games[data-view="injury"] .top-players-wrap { display: none; }
        }

        /* ─── Box score modal ─── */
        .box-modal {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.7);
            align-items: center; justify-content: center; padding: 16px;
        }
        .box-modal.open { display: flex; }
        .box-modal-dialog {
            position: relative; width: 100%; max-width: 760px; max-height: 90vh;
            overflow-y: auto; background: var(--surface);
            border: 1px solid var(--border); border-radius: 16px;
            padding: 20px 20px 24px;
        }
        .box-modal-close {
            position: absolute; top: 10px; right: 12px;
            background: none; border: none; color: var(--muted);
            font-size: 26px; line-height: 1; cursor: pointer; padding: 4px 8px;
        }
        .box-modal-close:hover { color: var(--text); }
        .box-modal .status { margin: 0 36px 16px; }
        .box-scoreline { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 18px; }
        .box-team { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: .6; }
        .box-team.winner, .box-modal .status-live ~ .box-scoreline .box-team { opacity: 1; }
        .box-team img { width: 52px; height: 52px; object-fit: contain; }
        .box-team-abbr { font-size: 13px; font-weight: 800; letter-spacing: 1px; }
        .box-score { font-size: 30px; font-weight: 900; display: flex; gap: 10px; }
        .box-score span { color: var(--muted); font-weight: 400; }
        .box-team-tabs { margin: 18px 0 10px; }
        .box-team-panel { display: none; }
        .box-team-panel.active { display: block; }
        .box-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .box-table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
        .box-table th, .box-table td { padding: 6px 7px; text-align: center; border-bottom: 1px solid var(--border); }
        .box-table th { color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .5px; }
        .box-table .box-name {
            text-align: left; position: sticky; left: 0; background: var(--surface);
            font-weight: 600; min-width: 120px;
        }
        .box-pos { color: var(--muted); font-size: 10px; margin-left: 4px; font-weight: 400; }
        .box-pts { font-weight: 800; color: var(--gold); }
        .box-sep td {
            text-align: left; color: var(--muted); font-size: 10px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; background: var(--surface2);
            position: sticky; left: 0;
        }
        .box-dnp td { color: var(--muted); }
        .box-dnp td:not(.box-name) { text-align: left; font-style: italic; }
        .box-line { margin-bottom: 4px; }
        .box-line .box-name { min-width: 60px; }
        #box-players .msg { padding: 30px 20px; }

        @media (max-width: 480px) {
            .box-modal { padding: 8px; }
            .box-modal-dialog { padding: 16px 12px 20px; max-height: 94vh; }
            .box-scoreline { gap: 14px; }
            .box-team img { width: 40px; height: 40px; }
            .box-score { font-size: 24px; }
        }
    </style>
</head>
<body>

<header>
    <h1>NBA <em>Daily</em></h1>
    <div class="header-right">
        <div class="last-updated" id="last-updated"></div>
        <button class="refresh-btn" id="refresh-btn" aria-label="Refresh">↻</button>
    </div>
    <div class="hamburger-wrap" id="hamburger-wrap">
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="hamburger-menu">
            <a href="nba-playoff.html" target="_blank">Playoffs</a>
            <a href="nba-player.html" target="_blank">Player Stats</a>
            <a href="nba-salary.html" target="_blank">Salary</a>
        </nav>
    </div>
</header>

<div class="main-wrap">

    <!-- Main tab nav -->
    <div class="tabs-nav">
        <button class="tab-btn active" data-tab="games">Games</button>
        <button class="tab-btn" data-tab="standings">Standings</button>
        <button class="tab-btn mobile-only" data-tab="top">Top 10</button>
        <button class="tab-btn mobile-only" data-tab="injury">Injury</button>
    </div>

    <!-- ① 試合結果タブ -->
    <div class="tab-panel active" id="tab-games" data-view="games">
        <div class="games-layout">
            <div class="games-main">
                <section class="section">
                    <div class="section-header">
                        <div class="section-bar"></div>
                        <h2>Today's Games</h2>
                        <span class="date-badge" id="today-date"></span>
                    </div>
                    <div class="games-grid" id="today-games">
                        <div class="msg">Loading<span class="spinner"></span></div>
                    </div>
                </section>
                <section class="section">
                    <div class="section-header">
                        <div class="section-bar"></div>
                        <h2>Tomorrow's Schedule</h2>
                        <span class="date-badge" id="tomorrow-date"></span>
                    </div>
                    <div class="games-grid" id="tomorrow-games">
                        <div class="msg">Loading<span class="spinner"></span></div>
                    </div>
                </section>
                <section class="section">
                    <div class="section-header">
                        <div class="section-bar"></div>
                        <h2>Yesterday's Games</h2>
                        <span class="date-badge" id="yesterday-date"></span>
                    </div>
                    <div class="games-grid" id="yesterday-games">
                        <div class="msg">Loading<span class="spinner"></span></div>
                    </div>
                </section>
            </div>
            <aside class="games-side">
                <section class="section top-players-wrap">
                    <div class="section-header">
                        <div class="section-bar"></div>
                        <h2>Top 10 Players</h2>
                        <span class="date-badge" id="top-players-date"></span>
                    </div>
                    <div class="top-players-col">
                        <div id="top-players">
                            <div class="msg">Loading<span class="spinner"></span></div>
                        </div>
                    </div>
                </section>
                <section class="section injury-players-wrap">
                    <div class="section-header">
                        <div class="section-bar"></div>
                        <h2>Today's Injury Report</h2>
                        <span class="date-badge" id="injury-date"></span>
                    </div>
                    <div class="injury-players-col">
                        <div id="injury-players">
                            <div class="msg">Loading<span class="spinner"></span></div>
                        </div>
                    </div>
                </section>
            </aside>
        </div>
    </div>

    <!-- ② 順位タブ -->
    <div class="tab-panel" id="tab-standings">

        <div class="standings-lottery-wrap">

            <!-- 順位 -->
            <div class="standings-col">
                <!-- East / West conf sub-tabs -->
                <div class="conf-tabs">
                    <button class="conf-btn active" data-conf="west">West</button>
                    <button class="conf-btn" data-conf="east">East</button>
                    <a class="conf-btn" href="https://www.nba.com/standings" target="_blank" rel="noopener">NBA Standings</a>
                </div>

                <div class="conf-panel active" id="conf-west">
                    <div class="msg">Loading<span class="spinner"></span></div>
                </div>
                <div class="conf-panel" id="conf-east">
                    <div class="msg">Loading<span class="spinner"></span></div>
                </div>
            </div><!-- /standings-col -->

            <!-- Lottery section -->
            <div class="lottery-section">
            <h3>Draft Lottery Projections</h3>
            <div id="lottery-list">
                <div class="msg">Loading<span class="spinner"></span></div>
            </div>
        </div><!-- /lottery-section -->

        </div><!-- /standings-lottery-wrap -->

    </div><!-- /tab-standings -->

    <div class="box-modal" id="box-modal" onclick="if (event.target === this) closeBoxScoreModal()">
        <div class="box-modal-dialog" role="dialog" aria-modal="true" aria-label="Box score">
            <button class="box-modal-close" onclick="closeBoxScoreModal()" aria-label="Close">&times;</button>
            <div id="box-modal-body"></div>
        </div>
    </div>

</div><!-- /main-wrap -->

<script>
const ESPN_SCOREBOARD = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
const ESPN_STANDINGS  = 'https://site.api.espn.com/apis/v2/sports/basketball/nba/standings';

const rankMap = {};
const standingsData = { East: [], West: [] };
let isPlayoffMode = false;

// ESPN略称 → 標準3文字略称
const ABBR_MAP = { NY: 'NYK', GS: 'GSW', NO: 'NOP', SA: 'SAS', UTAH: 'UTA' };
function normAbbr(a) { return ABBR_MAP[a] || a; }

// NBA lottery odds for #1 pick (2019 reform, 14 teams)
const LOTTERY_ODDS = [
    [14.0, 13.4, 12.7, 12.0],
    [14.0, 13.4, 12.7, 12.0],
    [14.0, 13.4, 12.7, 12.0],
    [12.5, 12.3, 11.9, 10.0],
    [10.5, 10.5, 10.5,  8.1],
    [ 9.0,  9.1,  9.2,  6.7],
    [ 7.5,  7.7,  7.8,  5.4],
    [ 6.0,  6.2,  6.3,  4.3],
    [ 4.5,  4.7,  4.9,  3.2],
    [ 3.0,  3.2,  3.3,  2.3],
    [ 2.0,  2.1,  2.3,  1.5],
    [ 1.5,  1.6,  1.8,  1.1],
    [ 1.0,  1.1,  1.2,  0.7],
    [ 0.5,  0.6,  0.6,  0.3],
];

/* ── ET date helpers (America/New_York, handles DST automatically) ── */
function etDateStr(utcDate) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' })
        .format(utcDate).replace(/-/g, '');
}

function etDateShift(utcDate, days) {
    const s = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(utcDate);
    const [y, m, d] = s.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + days, 17, 0, 0));
}

function fmtJstDate(utcDate) {
    const datePart = new Intl.DateTimeFormat('ja-JP', {
        year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Tokyo'
    }).format(utcDate);
    const weekday = new Intl.DateTimeFormat('en-US', {
        weekday: 'short', timeZone: 'Asia/Tokyo'
    }).format(utcDate);
    return `${datePart} (${weekday})`;
}

/* ── Tab / conf switching ── */
function switchTab(tab) {
    // Top 10 / Injury はスマホ用タブ。中身は Games パネル内の右カラムを表示切替する
    const panel = (tab === 'top' || tab === 'injury') ? 'games' : tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${panel}`));
    document.getElementById('tab-games').dataset.view = tab;
}

function switchConf(conf) {
    document.querySelectorAll('.conf-btn[data-conf]').forEach(b => b.classList.toggle('active', b.dataset.conf === conf));
    document.querySelectorAll('.conf-panel').forEach(p => p.classList.toggle('active', p.id === `conf-${conf}`));
}

document.querySelectorAll('.tab-btn').forEach(btn =>
    btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

// PC幅に戻ったらスマホ専用タブは存在しないので Games に戻す
window.matchMedia('(min-width: 769px)').addEventListener('change', e => {
    const view = document.getElementById('tab-games').dataset.view;
    if (e.matches && (view === 'top' || view === 'injury')) switchTab('games');
});
document.querySelectorAll('.conf-btn[data-conf]').forEach(btn =>
    btn.addEventListener('click', () => switchConf(btn.dataset.conf)));
document.getElementById('refresh-btn').addEventListener('click', () => init());

/* ── API ── */
async function loadStandings() {
    standingsData.East = [];
    standingsData.West = [];
    try {
        const d = await fetch(ESPN_STANDINGS).then(r => r.json());
        (d.children || []).forEach(conf => {
            const isEast = conf.name.toLowerCase().includes('east');
            const confKey = isEast ? 'East' : 'West';
            (conf.standings?.entries || []).forEach(e => {
                const get = name => e.stats?.find(s => s.name === name)?.displayValue ?? '';
                const rank = parseInt(get('playoffSeed'));
                if (!rank) return;
                rankMap[e.team.id] = { rank, conf: confKey, l10: get('Last Ten Games'), streak: get('streak') };
                standingsData[confKey].push({
                    rank,
                    id:     e.team.id,
                    abbr:   normAbbr(e.team.abbreviation || ''),
                    logo:   e.team.logos?.[0]?.href || '',
                    wins:   parseInt(get('wins'))   || 0,
                    losses: parseInt(get('losses')) || 0,
                    pct:    get('winPercent'),
                    gb:     get('gamesBehind'),
                    home:   get('Home'),
                    road:   get('Road'),
                    conf:   get('vs. Conf.'),
                    l10:    get('Last Ten Games'),
                    streak: get('streak'),
                });
            });
            standingsData[confKey].sort((a, b) => a.rank - b.rank);
        });
    } catch (e) { console.warn('standings:', e); }
}

/* ── Standings table render ── */
function renderStandingsTable(conf) {
    const el = document.getElementById(`conf-${conf.toLowerCase()}`);
    const teams = standingsData[conf];
    if (!el || !teams.length) return;

    const rows = teams.map(t => {
        let cls = '';
        if (t.rank === 6)  cls = 'edge-playoff';
        if (t.rank === 10) cls = 'edge-playin';

        return `<tr class="${cls}">
            <td>${t.rank}</td>
            <td><div class="st-team">
                <img class="st-logo" src="${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'">
                <span class="st-abbr">${t.abbr}</span>
            </div></td>
            <td>${t.wins}</td>
            <td>${t.losses}</td>
            <td>${t.pct}</td>
            <td>${t.gb || '-'}</td>
            <td>${t.home}</td>
            <td>${t.road}</td>
            <td>${t.conf}</td>
            <td>${t.l10}</td>
            <td>${t.streak}</td>
        </tr>`;
    }).join('');

    el.innerHTML = `
        <div class="standings-wrap">
            <table class="st-table">
                <thead><tr>
                    <th>#</th><th>Team</th>
                    <th>W</th><th>L</th><th>PCT</th><th>GB</th>
                    <th>Home</th><th>Away</th><th>Conf</th><th>L10</th><th>Strk</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

/* ── Lottery render ── */
function renderLottery() {
    const el = document.getElementById('lottery-list');
    if (!el) return;

    // 全30チームを成績順（勝率昇順）に並べ、プレーオフ確定(rank 1-6)以外を抽出
    const all = [...standingsData.West, ...standingsData.East]
        .filter(t => t.rank > 6)
        .sort((a, b) => {
            const pctA = a.wins / (a.wins + a.losses || 1);
            const pctB = b.wins / (b.wins + b.losses || 1);
            if (pctA !== pctB) return pctA - pctB; // 勝率昇順（悪い順）
            return b.losses - a.losses;             // 負け数が多い方が上
        })
        .slice(0, 14); // 上位14チーム

    if (!all.length) { el.innerHTML = '<div class="msg">No data</div>'; return; }

    const rows = all.map((t, i) => {
        const odds    = LOTTERY_ODDS[i] ?? ['-','-','-','-'];
        const isPlayin = t.rank <= 10;
        return `<tr>
            <td>${i + 1}</td>
            <td><div class="st-team">
                <img class="st-logo" src="${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'">
                <span class="st-abbr">${t.abbr}</span>
                ${isPlayin ? '<span class="playin-mark">*</span>' : ''}
            </div></td>
            <td>${t.wins}-${t.losses}</td>
            <td>${t.pct}</td>
            <td class="lt-odds">${odds[0]}%</td>
            <td class="lt-odds">${odds[1]}%</td>
            <td class="lt-odds">${odds[2]}%</td>
            <td class="lt-odds">${odds[3]}%</td>
            <td class="lt-odds lt-odds-dim">${(100 - odds[0] - odds[1] - odds[2] - odds[3]).toFixed(1)}%</td>
        </tr>`;
    }).join('');

    el.innerHTML = `
        <table class="lt-table">
            <thead><tr>
                <th>#</th><th>Team</th><th>Record</th><th>PCT</th><th>#1</th><th>#2</th><th>#3</th><th>#4</th><th>#5+</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
        <div class="lottery-note">
            * Play-In teams (may enter lottery depending on results)<br>
            Projections based on current standings. Final order set after season ends.<br>
            Lottery odds per NBA official methodology (2019 reform). Reference:
            <a href="https://www.tankathon.com/pick_odds" target="_blank"
               style="color:var(--muted);text-decoration:underline">tankathon.com</a>
        </div>`;
}

/* ── Scoreboard ── */
async function fetchEvents(etDate) {
    const res = await fetch(`${ESPN_SCOREBOARD}?dates=${etDateStr(etDate)}&limit=25`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return (await res.json())?.events || [];
}

function hasResults(events) {
    return events.some(e => e.status.type.completed || e.status.type.state === 'in');
}

/* ── Streak helpers ── */
function streakBadge(streak) {
    if (!streak) return '';
    const m = streak.match(/^([WL])\s*(\d+)/);
    if (!m) return '';
    const type = m[1], count = parseInt(m[2]);
    if (type === 'W' && count >= 1) return `<span class="team-streak-badge">[${count}] 🔥</span>`;
    if (type === 'L' && count >= 1) return `<span class="team-streak-badge">[${count}] 🥶</span>`;
    return '';
}

/* ── Game render ── */
function renderGames(events, id) {
    const el = document.getElementById(id);
    if (!events?.length) { el.innerHTML = '<div class="msg">No games</div>'; return; }
    const statusPriority = e => {
        if (e.status.type.state === 'in') return 0;
        if (e.status.type.completed || e.status.type.state === 'post') return 2;
        return 1;
    };
    const sorted = [...events].sort((a, b) => statusPriority(a) - statusPriority(b));
    el.innerHTML = '';
    sorted.forEach(ev => el.appendChild(buildCard(ev)));
}

function buildCard(event) {
    const comp = event.competitions[0];
    const away = comp.competitors.find(c => c.homeAway === 'away') ?? comp.competitors[0];
    const home = comp.competitors.find(c => c.homeAway === 'home') ?? comp.competitors[1];

    const st = event.status;
    const isOver = !!st.type.completed || st.type.state === 'post';
    const isLive = !isOver && st.type.state === 'in';

    const awayScore = away.score != null ? String(away.score) : '';
    const homeScore = home.score != null ? String(home.score) : '';
    const awayNum = parseInt(awayScore);
    const homeNum = parseInt(homeScore);
    const awayWon = isOver && !isNaN(awayNum) && !isNaN(homeNum) && awayNum > homeNum;
    const homeWon = isOver && !isNaN(awayNum) && !isNaN(homeNum) && homeNum > awayNum;

    // Playoff series data
    const series = comp.series;
    const awaySeriesWins = series?.competitors?.find(c => c.id === away.team.id)?.wins ?? 0;
    const homeSeriesWins = series?.competitors?.find(c => c.id === home.team.id)?.wins ?? 0;
    const seriesNote = series
        ? (comp.notes?.find(n => n.headline && /series|game\s+\d+/i.test(n.headline))?.headline || '')
        : '';

    // Game number label (e.g. "Game 5") for playoff status bar
    let gameNumber = '';
    if (isPlayoffMode && series) {
        const allText = [st.type.shortDetail, ...(comp.notes || []).map(n => n.headline || '')].join(' ');
        const m = allText.match(/Game\s+\d+/i);
        if (m) gameNumber = m[0];
    }

    let statusLabel, statusClass;
    if (isOver) {
        statusLabel = (isPlayoffMode && gameNumber) ? `FINAL  •  ${gameNumber}` : 'FINAL';
        statusClass = 'status-final';
    } else if (isLive) {
        const tag = (isPlayoffMode && gameNumber) ? `  •  ${gameNumber}` : '';
        statusLabel = `● LIVE  Q${st.period}  ${st.displayClock}${tag}`;
        statusClass = 'status-live';
    } else {
        const timeStr = new Date(event.date).toLocaleTimeString('en-US', {
            hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo'
        });
        const tag = (isPlayoffMode && gameNumber) ? `  •  ${gameNumber}` : '';
        statusLabel = `${timeStr} JST${tag}`;
        statusClass = 'status-sched';
    }

    function info(t, myWins, oppWins) {
        const rk  = rankMap[t.team.id];
        const rec = t.records?.find(r => r.type === 'total') ?? t.records?.[0];
        if (isPlayoffMode && series) {
            return {
                logo:   t.team.logo || '',
                name:   normAbbr(t.team.abbreviation) || t.team.displayName,
                record: `${myWins}-${oppWins}`,
                rank:   rk ? `#${rk.rank} Seed` : '',
                l10:    '',
                streak: ''
            };
        }
        return {
            logo:   t.team.logo || '',
            name:   normAbbr(t.team.abbreviation) || t.team.displayName,
            record: rec?.summary || '',
            rank:   rk ? `${rk.conf} #${rk.rank}` : '',
            l10:    rk?.l10 || '',
            streak: rk?.streak || ''
        };
    }

    const aw = info(away, awaySeriesWins, homeSeriesWins);
    const hw = info(home, homeSeriesWins, awaySeriesWins);

    const centerHTML = (isOver || isLive)
        ? `<div class="score ${awayWon ? 'win' : ''}">${awayScore || '-'}</div>
           <div class="dash">-</div>
           <div class="score ${homeWon ? 'win' : ''}">${homeScore || '-'}</div>`
        : `<div class="vs">VS</div>`;

    function teamBlock(d, won) {
        const l10Row = (d.l10 || d.streak)
            ? `<div class="team-l10-row">
                   ${d.l10 ? `<span class="team-l10">L10: ${d.l10}</span>` : ''}
                   ${streakBadge(d.streak)}
               </div>`
            : '';
        return `
        <div class="team ${won ? 'winner' : ''}">
            <img class="logo" src="${d.logo}" alt="${d.name}"
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2278%22>🏀</text></svg>'">
            <div class="team-name">${d.name}</div>
            <div class="team-record">${d.record}</div>
            ${d.rank ? `<div class="team-rank">${d.rank}</div>` : ''}
            ${l10Row}
        </div>`;
    }

    const card = document.createElement('div');
    card.className = 'card';
    if (isOver || isLive) {
        card.classList.add('clickable');
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.addEventListener('click', () => openBoxScoreModal(event));
        card.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBoxScoreModal(event); }
        });
    }
    card.innerHTML = `
        <div class="status ${statusClass}">${statusLabel}</div>
        <div class="matchup">
            ${teamBlock(aw, awayWon)}
            <div class="center">${centerHTML}</div>
            ${teamBlock(hw, homeWon)}
        </div>
        ${(isPlayoffMode && seriesNote) ? `<div class="series-note">${seriesNote}</div>` : ''}`;
    return card;
}

/* ── Box Score / Top Players ── */
// 終了済み試合のみキャッシュ（ライブ中は毎回取り直す）
const boxScoreCache = new Map();

async function fetchBoxScore(eventId) {
    if (boxScoreCache.has(eventId)) return boxScoreCache.get(eventId);
    try {
        const res = await fetch(
            `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${eventId}`
        );
        if (!res.ok) return null;
        const data = await res.json();
        if (data?.header?.competitions?.[0]?.status?.type?.completed) boxScoreCache.set(eventId, data);
        return data;
    } catch { return null; }
}

/* ── Box Score modal ── */
const BOX_COLS = [
    ['MIN', 'MIN', 'min', 'minutes'],
    ['PTS', 'PTS', 'pts', 'points'],
    ['REB', 'REB', 'reb', 'rebounds'],
    ['AST', 'AST', 'ast', 'assists'],
    ['FG',  'FG',  'fg',  'fieldGoalsMade-fieldGoalsAttempted'],
    ['3PT', '3PT', '3pt', 'threePointFieldGoalsMade-threePointFieldGoalsAttempted'],
    ['FT',  'FT',  'ft',  'freeThrowsMade-freeThrowsAttempted'],
    ['STL', 'STL', 'stl', 'steals'],
    ['BLK', 'BLK', 'blk', 'blocks'],
    ['TO',  'TO',  'to',  'TOV', 'turnovers'],
    ['+/-', '+/-', 'plusMinus'],
];

function closeBoxScoreModal() {
    document.getElementById('box-modal').classList.remove('open');
    document.body.style.overflow = '';
}

function switchBoxTeam(idx) {
    document.querySelectorAll('.box-team-btn').forEach(b => b.classList.toggle('active', +b.dataset.idx === idx));
    document.querySelectorAll('.box-team-panel').forEach(p => p.classList.toggle('active', +p.dataset.idx === idx));
}

function boxTeamTable(teamData) {
    const sg = teamData.statistics?.[0];
    if (!sg?.athletes?.length) return '<div class="msg">No stats available</div>';
    const names = sg.names || [];
    const keys  = sg.keys  || [];
    const idx = BOX_COLS.map(([, ...cands]) => getStatIdx(names, keys, ...cands));

    const row = a => {
        const pos = a.athlete?.position?.abbreviation || '';
        const nameCell = `<td class="box-name">${a.athlete?.shortName || a.athlete?.displayName || '—'}
            ${pos ? `<span class="box-pos">${pos}</span>` : ''}</td>`;
        if (a.didNotPlay || !a.stats?.length) {
            return `<tr class="box-dnp">${nameCell}<td colspan="${BOX_COLS.length}">${a.reason || 'DNP'}</td></tr>`;
        }
        const cells = idx.map((i, c) => {
            const v = i >= 0 ? (a.stats[i] ?? '-') : '-';
            return `<td class="${BOX_COLS[c][0] === 'PTS' ? 'box-pts' : ''}">${v}</td>`;
        }).join('');
        return `<tr>${nameCell}${cells}</tr>`;
    };

    const starters = sg.athletes.filter(a => a.starter);
    const bench    = sg.athletes.filter(a => !a.starter);
    const head = `<tr><th class="box-name">Player</th>${BOX_COLS.map(c => `<th>${c[0]}</th>`).join('')}</tr>`;
    const sep  = label => `<tr class="box-sep"><td colspan="${BOX_COLS.length + 1}">${label}</td></tr>`;

    return `<div class="box-table-wrap"><table class="box-table">
        <thead>${head}</thead>
        <tbody>
            ${starters.length ? sep('Starters') + starters.map(row).join('') : ''}
            ${bench.length ? sep('Bench') + bench.map(row).join('') : ''}
        </tbody>
    </table></div>`;
}

async function openBoxScoreModal(event) {
    const modal = document.getElementById('box-modal');
    const body  = document.getElementById('box-modal-body');
    const comp  = event.competitions[0];
    const away  = comp.competitors.find(c => c.homeAway === 'away') ?? comp.competitors[0];
    const home  = comp.competitors.find(c => c.homeAway === 'home') ?? comp.competitors[1];
    const st    = event.status;
    const isOver = !!st.type.completed || st.type.state === 'post';
    const statusText = isOver ? 'FINAL' : `● LIVE  Q${st.period}  ${st.displayClock}`;

    const abbr = t => normAbbr(t.team.abbreviation) || t.team.displayName;
    const awayNum = parseInt(away.score), homeNum = parseInt(home.score);

    // クォーター別スコア（OTがあれば列が増える）
    const periods = Math.max(away.linescores?.length || 0, home.linescores?.length || 0);
    const pLabel = i => i < 4 ? `Q${i + 1}` : (i === 4 ? 'OT' : `OT${i - 3}`);
    const lineRow = t => `<tr><td class="box-name">${abbr(t)}</td>
        ${Array.from({ length: periods }, (_, i) => `<td>${t.linescores?.[i]?.value ?? '-'}</td>`).join('')}
        <td class="box-pts">${t.score ?? '-'}</td></tr>`;
    const lineHTML = periods ? `<div class="box-table-wrap"><table class="box-table box-line">
        <thead><tr><th class="box-name"></th>${Array.from({ length: periods }, (_, i) => `<th>${pLabel(i)}</th>`).join('')}<th>T</th></tr></thead>
        <tbody>${lineRow(away)}${lineRow(home)}</tbody>
    </table></div>` : '';

    const teamHead = (t, won) => `<div class="box-team ${won ? 'winner' : ''}">
        <img src="${t.team.logo || ''}" alt="${abbr(t)}">
        <div class="box-team-abbr">${abbr(t)}</div>
    </div>`;

    body.innerHTML = `
        <div class="status ${isOver ? 'status-final' : 'status-live'}">${statusText}</div>
        <div class="box-scoreline">
            ${teamHead(away, isOver && awayNum > homeNum)}
            <div class="box-score">${away.score ?? '-'}<span>-</span>${home.score ?? '-'}</div>
            ${teamHead(home, isOver && homeNum > awayNum)}
        </div>
        ${lineHTML}
        <div id="box-players"><div class="msg">Loading box score...</div></div>`;

    modal.classList.add('open');
    document.body.style.overflow = 'hidden';

    const data = await fetchBoxScore(event.id);
    const el = document.getElementById('box-players');
    if (!modal.classList.contains('open') || !el) return;
    const teams = data?.boxscore?.players;
    if (!teams?.length) { el.innerHTML = '<div class="msg error">Failed to load box score</div>'; return; }

    // away → home の順に並べる
    const order = [away.team.id, home.team.id];
    teams.sort((a, b) => order.indexOf(a.team?.id) - order.indexOf(b.team?.id));

    el.innerHTML = `
        <div class="conf-tabs box-team-tabs">
            ${teams.map((t, i) => `<button class="conf-btn box-team-btn" data-idx="${i}" onclick="switchBoxTeam(${i})">${normAbbr(t.team?.abbreviation || '')}</button>`).join('')}
        </div>
        ${teams.map((t, i) => `<div class="box-team-panel" data-idx="${i}">${boxTeamTable(t)}</div>`).join('')}`;
    switchBoxTeam(0);
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('box-modal').classList.contains('open')) closeBoxScoreModal();
});

function getStatIdx(names, keys, ...candidates) {
    for (const c of candidates) {
        let i = names.indexOf(c);
        if (i >= 0) return i;
        if (keys) { i = keys.indexOf(c); if (i >= 0) return i; }
    }
    return -1;
}

async function extractTopPlayers(events) {
    const completed = events.filter(e =>
        e.status.type.completed || e.status.type.state === 'post'
    );
    if (!completed.length) return [];

    const summaries = await Promise.all(completed.map(e => fetchBoxScore(e.id)));
    const players = [];

    summaries.forEach(data => {
        if (!data?.boxscore?.players) return;
        data.boxscore.players.forEach(teamData => {
            const teamAbbr = normAbbr(teamData.team?.abbreviation || '');
            (teamData.statistics || []).forEach(sg => {
                const names = sg.names || [];
                const keys  = sg.keys  || [];
                const iP   = getStatIdx(names, keys, 'PTS',  'pts');
                const iR   = getStatIdx(names, keys, 'REB',  'reb');
                const iA   = getStatIdx(names, keys, 'AST',  'ast');
                const iFG  = getStatIdx(names, keys, 'FG',   'fg');
                const i3PT = getStatIdx(names, keys, '3PT',  '3pt');
                const iOR  = getStatIdx(names, keys, 'OREB', 'oreb');
                const iDR  = getStatIdx(names, keys, 'DREB', 'dreb');
                const iS   = getStatIdx(names, keys, 'STL',  'stl');
                const iB   = getStatIdx(names, keys, 'BLK',  'blk');
                const iTO  = getStatIdx(names, keys, 'TO',   'to', 'TOV', 'tov');
                const iPF  = getStatIdx(names, keys, 'PF',   'pf');
                const iPM  = getStatIdx(names, keys, '+/-',  'plusMinus');

                (sg.athletes || []).forEach(a => {
                    if (a.didNotPlay) return;
                    const s = a.stats;
                    if (!s?.length) return;
                    const get = i => (i >= 0 && s[i] != null) ? String(s[i]) : '0';
                    const pts = parseInt(get(iP)) || 0;
                    const reb = parseInt(get(iR)) || 0;
                    const ast = parseInt(get(iA)) || 0;
                    if (pts + reb + ast === 0) return;

                    players.push({
                        name:   a.athlete?.displayName || '—',
                        photo:  a.athlete?.headshot?.href || '',
                        team:   teamAbbr,
                        pts, reb, ast,
                        total:  pts + reb + ast,
                        fg:     get(iFG),
                        threeP: get(i3PT),
                        oreb:   get(iOR),
                        dreb:   get(iDR),
                        stl:    get(iS),
                        blk:    get(iB),
                        tov:    get(iTO),
                        pf:     get(iPF),
                        pm:     get(iPM),
                    });
                });
            });
        });
    });

    return players.sort((a, b) => b.total - a.total).slice(0, 10);
}

function renderTopPlayers(players) {
    const el = document.getElementById('top-players');
    if (!el) return;
    if (!players.length) {
        el.innerHTML = '<div class="msg">No data</div>';
        return;
    }

    el.innerHTML = players.map((p, i) => {
        const pmRaw = String(p.pm).replace(/^\+/, '');
        const pmFmt = pmRaw.startsWith('-') ? pmRaw : (pmRaw === '0' ? '±0' : `+${pmRaw}`);
        const orebN = parseInt(p.oreb) || 0;
        const drebN = parseInt(p.dreb) || 0;
        const rebDetail = (orebN || drebN) ? `${orebN}-${drebN}` : String(p.reb);
        const fgFmt    = String(p.fg).replace('-', '/');
        const threeFmt = String(p.threeP).replace('-', '/');
        const photoEl = p.photo
            ? `<img class="tp-photo" src="${p.photo}" alt="${p.name}" onerror="this.style.display='none'">`
            : `<div class="tp-photo-placeholder">${p.name.charAt(0)}</div>`;

        return `
        <div class="tp-item">
            <div class="tp-rank">${i + 1}</div>
            ${photoEl}
            <div class="tp-body">
                <div class="tp-name-row">
                    <span class="tp-name">${p.name}</span>
                    <span class="tp-team">${p.team}</span>
                </div>
                <div class="tp-main-stats">
                    <span class="tp-pts-val">${p.pts}</span><span class="tp-stat-lbl">pts</span>
                    <span class="tp-stat-sep">/</span>
                    <span class="tp-reb-val">${p.reb}</span><span class="tp-stat-lbl">reb</span>
                    <span class="tp-stat-sep">/</span>
                    <span class="tp-ast-val">${p.ast}</span><span class="tp-stat-lbl">ast</span>
                </div>
                <div class="tp-detail-row">
                    <span class="tp-chip"><strong>${fgFmt}</strong> FG</span>
                    <span class="tp-chip"><strong>${threeFmt}</strong> 3P</span>
                    <span class="tp-chip">REB <strong>${rebDetail}</strong></span>
                    <span class="tp-chip">STL <strong>${p.stl}</strong></span>
                    <span class="tp-chip">BLK <strong>${p.blk}</strong></span>
                    <span class="tp-chip">TOV <strong>${p.tov}</strong></span>
                    <span class="tp-chip">PF <strong>${p.pf}</strong></span>
                    <span class="tp-chip"><strong>${pmFmt}</strong></span>
                </div>
            </div>
        </div>`;
    }).join('');
}

/* ── Injury Report ── */
async function fetchInjuryPlayers(events) {
    if (!events?.length) return [];
    const summaries = await Promise.all(events.map(e => fetchBoxScore(e.id)));
    const seen = new Set();
    const players = [];

    summaries.forEach(data => {
        if (!data?.injuries) return;
        data.injuries.forEach(teamInj => {
            const teamAbbr = normAbbr(teamInj.team?.abbreviation || '');
            (teamInj.injuries || []).forEach(inj => {
                const pid = inj.athlete?.id;
                if (pid && seen.has(pid)) return;
                if (pid) seen.add(pid);

                const details = inj.details || {};
                const side    = (details.side   || '').replace('Not Specified', '').trim();
                const type    = (details.type   || '').trim();
                const detail  = (details.detail || '').trim();
                const reason  = [side, type || detail].filter(Boolean).join(' ') || '—';

                players.push({
                    name:   inj.athlete?.displayName || '?',
                    photo:  inj.athlete?.headshot?.href || '',
                    team:   teamAbbr,
                    status: inj.status || 'Out',
                    reason,
                });
            });
        });
    });

    // Sort: Out first, then Doubtful, Questionable, Day-To-Day; within each group by team
    const order = { 'Out': 0, 'Doubtful': 1, 'Questionable': 2, 'Day-To-Day': 3 };
    return players.sort((a, b) => {
        const so = (order[a.status] ?? 9) - (order[b.status] ?? 9);
        return so !== 0 ? so : a.team.localeCompare(b.team);
    });
}

function renderInjuryPlayers(players) {
    const el = document.getElementById('injury-players');
    if (!el) return;
    if (!players.length) {
        el.innerHTML = '<div class="msg">No injury report</div>';
        return;
    }

    const statusCfg = {
        'Out':        { cls: 'ip-out',  label: 'OUT'   },
        'Doubtful':   { cls: 'ip-d',    label: 'DOUBT' },
        'Questionable':{ cls: 'ip-q',   label: 'GTD'   },
        'Day-To-Day': { cls: 'ip-dtd',  label: 'D2D'   },
    };

    el.innerHTML = players.map(p => {
        const cfg = statusCfg[p.status] || { cls: 'ip-out', label: p.status.toUpperCase() };
        const photoEl = p.photo
            ? `<img class="ip-photo" src="${p.photo}" alt="${p.name}" onerror="this.style.display='none'">`
            : `<div class="ip-photo-placeholder">${p.name.charAt(0)}</div>`;
        return `
        <div class="ip-item">
            ${photoEl}
            <div class="ip-body">
                <div class="ip-name-row">
                    <span class="ip-name">${p.name}</span>
                    <span class="ip-team">${p.team}</span>
                </div>
                <div class="ip-reason">${p.reason}</div>
            </div>
            <span class="ip-status ${cfg.cls}">${cfg.label}</span>
        </div>`;
    }).join('');
}

/* ── Main ── */
async function init() {
    const btn = document.getElementById('refresh-btn');
    if (btn) { btn.disabled = true; btn.classList.add('spinning'); }

    const now = new Date();

    // 閲覧がJST環境のため、JST日付を基準にET日付を計算する
    // NBA試合は7pm+ ET = 翌日8am+ JST のため、JST今日の試合 = ET(JST今日-1日)
    const jstStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo' }).format(now);
    const [jy, jm, jd] = jstStr.split('-').map(Number);
    const etForJstToday     = new Date(Date.UTC(jy, jm - 1, jd - 1, 17, 0, 0));
    const etForJstTomorrow  = new Date(Date.UTC(jy, jm - 1, jd,     17, 0, 0));
    const etForJstYesterday = new Date(Date.UTC(jy, jm - 1, jd - 2, 17, 0, 0));

    document.getElementById('last-updated').textContent =
        'Updated: ' + now.toLocaleTimeString('en-US', { timeZone: 'Asia/Tokyo' });

    await loadStandings();
    renderStandingsTable('West');
    renderStandingsTable('East');
    renderLottery();

    try {
        const [todayEvents, scheduleEvents, yesterdayEvents] = await Promise.all([
            fetchEvents(etForJstToday),
            fetchEvents(etForJstTomorrow),
            fetchEvents(etForJstYesterday)
        ]);
        const resultsEvents = todayEvents;

        // Playoff auto-detection: competition.series is only present during playoffs
        isPlayoffMode = [...resultsEvents, ...scheduleEvents]
            .some(e => e.competitions?.[0]?.series != null);

        // Top Players: 当日完了済み試合があればその結果、なければ前日にフォールバック
        const todayCompleted = todayEvents.filter(e =>
            e.status.type.completed || e.status.type.state === 'post'
        );
        let topPlayerEvents, topPlayersDate;
        if (todayCompleted.length > 0) {
            topPlayerEvents = todayEvents;
            topPlayersDate  = now;
        } else {
            // 当日未開始またはライブ中のみ → 前日スタッツを表示
            topPlayerEvents = yesterdayEvents;
            topPlayersDate  = new Date(now.getTime() - 86400000);
        }

        document.getElementById('today-date').textContent       = resultsEvents.length  ? fmtJstDate(new Date(resultsEvents[0].date))  : fmtJstDate(now);
        document.getElementById('tomorrow-date').textContent    = scheduleEvents.length ? fmtJstDate(new Date(scheduleEvents[0].date)) : fmtJstDate(new Date(now.getTime() + 86400000));
        document.getElementById('yesterday-date').textContent   = yesterdayEvents.length ? fmtJstDate(new Date(yesterdayEvents[0].date)) : fmtJstDate(new Date(now.getTime() - 86400000));
        document.getElementById('top-players-date').textContent = fmtJstDate(topPlayersDate);
        document.getElementById('injury-date').textContent      = todayEvents.length    ? fmtJstDate(new Date(todayEvents[0].date))    : fmtJstDate(now);
        renderGames(resultsEvents,  'today-games');
        renderGames(scheduleEvents, 'tomorrow-games');
        renderGames(yesterdayEvents, 'yesterday-games');
        extractTopPlayers(topPlayerEvents).then(renderTopPlayers);
        fetchInjuryPlayers(todayEvents).then(renderInjuryPlayers);

    } catch (err) {
        console.error(err);
        ['today-games', 'tomorrow-games', 'yesterday-games'].forEach(id => {
            document.getElementById(id).innerHTML =
                '<div class="msg error">Failed to load data</div>';
        });
    } finally {
        if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
    }

    if (document.querySelectorAll('.status-live').length > 0) {
        setTimeout(init, 5 * 60 * 1000);
    }
}

init();
