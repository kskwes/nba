<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 個人用サイトのため検索エンジンに載せない -->
    <meta name="robots" content="noindex, nofollow">
    <title>NBA Daily</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="nba-common.css">
    <style>
        /* ─── Refresh button ─── */
        .header-right {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .refresh-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-size: 15px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, transform 0.3s;
            flex-shrink: 0;
            padding: 0;
            line-height: 1;
        }

        .refresh-btn:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
        .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .refresh-btn.spinning { animation: spin 0.8s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Section ─── */
        .section { margin-bottom: 32px; }

        .section-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 12px;
        }

        .section-header h2 {
            font-family: var(--font-score); font-size: 17px; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
        }

        .date-badge {
            font-family: var(--font-score); font-size: 12px; letter-spacing: 1px;
            color: var(--muted); text-transform: uppercase;
        }

        /* ─── Game Grid / Card（放送スコアボード風） ─── */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.15s, border-color 0.15s;
        }
        .card.clickable { cursor: pointer; }
        .card.clickable:hover { transform: translateY(-2px); border-color: #3a3a44; }
        .card.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .card.live {
            border-color: var(--live);
            box-shadow: 0 0 0 1px rgba(255,77,66,.35), 0 0 18px rgba(255,77,66,.18);
        }

        .g-team { display: flex; align-items: center; gap: 10px; padding-right: 12px; min-height: 48px; }
        .g-team + .g-team { border-top: 1px solid var(--line-soft); }
        .g-team.lose { opacity: .45; }

        /* --tc / --tc2 / --tc-text は JS でチームカラーから設定 */
        .g-chip {
            width: 48px; align-self: stretch; flex-shrink: 0;
            display: grid; place-items: center;
            background: var(--tc, var(--surface2));
            box-shadow: inset 0 -3px 0 var(--tc2, transparent);
            color: var(--tc-text, #fff);
            font-family: var(--font-score); font-weight: 600; font-size: 13px; letter-spacing: .5px;
        }

        .g-info { flex: 1; min-width: 0; padding: 6px 0; }
        .g-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .g-meta {
            display: flex; flex-wrap: wrap; gap: 0 5px;
            font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
        }
        .g-dot { color: var(--border); }
        .streak { font-weight: 700; }
        .streak.w { color: var(--pos); }
        .streak.l { color: var(--neg); }

        .g-score {
            font-family: var(--font-score); font-weight: 600; font-size: 28px; line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .g-series {
            padding: 4px 12px; font-size: 10.5px; color: var(--muted);
            border-top: 1px solid var(--line-soft);
        }

        .g-foot {
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            padding: 5px 12px; background: var(--surface-deep); border-top: 1px solid var(--line-soft);
            font-family: var(--font-score); font-size: 11.5px; letter-spacing: 1px;
            text-transform: uppercase; color: var(--muted); white-space: pre;
        }
        .g-status.final { color: var(--text-dim); }
        .g-status.live { color: var(--live); }
        .g-status.live::before {
            content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: var(--live); margin-right: 6px; vertical-align: 2px;
            animation: pulse 1.4s ease-in-out infinite;
        }
        .g-box { transition: color .15s; }
        .card.clickable:hover .g-box { color: var(--accent); }

        @keyframes pulse { 50% { opacity: .25; } }
        @media (prefers-reduced-motion: reduce) {
            .g-status.live::before { animation: none; }
            .card.clickable:hover { transform: none; }
        }

        /* ステータス帯（ボックススコアのモーダルで使用） */
        .status {
            text-align: center;
            font-family: var(--font-score);
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 3px 0;
            border-radius: 4px;
            margin-bottom: 14px;
            white-space: pre;
        }
        .status-final { background: var(--surface2); color: var(--text-dim); }
        .status-live  { background: rgba(255,77,66,.14); color: var(--live); }

        /* ─── Conf sub-tabs ─── */
        .conf-tabs { display: flex; gap: 8px; margin-bottom: 20px; }

        .conf-btn {
            padding: 6px 22px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.15s;
            text-decoration: none;
        }

        .conf-btn.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

        .conf-panel { display: none; }
        .conf-panel.active { display: block; }

        /* ─── Standings table ─── */
        .standings-wrap { overflow-x: auto; }

        .st-table { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }

        .st-table th {
            color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: 0.5px;
            padding: 7px 10px; text-align: right; border-bottom: 2px solid var(--border);
        }

        .st-table th:nth-child(1) { text-align: center; width: 30px; }
        .st-table th:nth-child(2) { text-align: left; }

        .st-table td {
            padding: 8px 10px; text-align: right;
            border-bottom: 1px solid var(--line-soft);
        }

        .st-table td:nth-child(1) { text-align: center; color: var(--muted); font-size: 11px; }
        .st-table td:nth-child(2) { text-align: left; }

        .st-team { display: flex; align-items: center; gap: 8px; }

        .st-logo { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }

        .st-abbr { font-weight: 700; }

        .st-table tr.edge-playoff td { border-bottom: 2px solid var(--accent); }
        .st-table tr.edge-playin td  { border-bottom: 1px dashed var(--border); }

        /* ─── Standings + Lottery side-by-side ─── */
        /* 左右を同じグリッド行に置き、Standings 表とロッタリー表の高さをそろえる
           （1行目: 切替ボタン / 見出し、2行目: 表、3行目: ロッタリーの説明） */
        .standings-lottery-wrap {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            column-gap: 28px;
        }
        .standings-col, .lottery-section { display: contents; }
        .standings-col > .conf-tabs { grid-column: 1; grid-row: 1; }
        .standings-col > .conf-panel { grid-column: 1; grid-row: 2; }
        .lottery-section > h3 { grid-column: 2; grid-row: 1; }
        #lottery-list { grid-column: 2; grid-row: 2; }
        #lottery-note { grid-column: 2; grid-row: 3; }
        /* 低い方の表は行が伸びて、高い方に合わせる */
        .conf-panel > .standings-wrap, .conf-panel .st-table, #lottery-list .lt-table { height: 100%; }

        /* ─── Lottery section ─── */
        .lottery-section h3 {
            font-family: var(--font-score); font-size: 17px; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 20px;
            align-self: center;
        }

        /* ルールの要点 */
        .lt-rules { list-style: none; display: grid; gap: 6px; margin-top: 14px; font-size: 12px; line-height: 1.6; color: var(--text-dim); }
        .lt-rules li { padding-left: 14px; position: relative; }
        .lt-rules li::before { content: ''; position: absolute; left: 0; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
        .lt-rules b { color: var(--text); }

        .lt-table { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
        .lt-table th {
            color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: 0.5px;
            padding: 7px 8px; text-align: right; border-bottom: 2px solid var(--border);
        }
        .lt-table td {
            padding: 5px 8px; text-align: right; font-variant-numeric: tabular-nums;
            border-bottom: 1px solid var(--line-soft);
        }
        .lt-table .lt-l { text-align: left; }
        /* 区分の見出し行（ボール数の理由を兼ねる） */
        .lt-table .lt-grp td {
            text-align: left; padding: 10px 8px 4px; border-bottom: 1px solid var(--border);
            font-size: 11.5px; font-weight: 700; color: var(--text-dim); white-space: normal;
        }
        .lt-grp-sub { color: var(--muted); font-weight: 600; margin-left: 4px; }
        .lt-seed { color: var(--muted); font-size: 10px; font-weight: 600; }
        .lt-dots { display: inline-flex; gap: 3px; vertical-align: middle; }
        .lt-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
        .lt-dot.off { background: none; box-shadow: inset 0 0 0 1.5px var(--border); }
        .lt-pct { color: var(--pos); font-weight: 700; }
        .lt-zero { color: var(--muted); font-weight: 600; }
        .lt-flag { font-size: 9.5px; font-weight: 700; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; }
        .lottery-note { font-size: 10.5px; color: var(--muted); margin-top: 12px; line-height: 1.6; }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .standings-lottery-wrap { grid-template-columns: minmax(0, 1fr); }
            .standings-col > .conf-tabs, .standings-col > .conf-panel, .lottery-section > h3,
            #lottery-list, #lottery-note { grid-column: auto; grid-row: auto; }
            .lottery-section > h3 { border-top: 1px solid var(--border); padding-top: 28px; margin-top: 28px; }
            #lottery-list { overflow-x: auto; }
        }
        @media (max-width: 420px) {
            .lt-table { font-size: 12px; }
            .lt-table th, .lt-table td { padding-left: 4px; padding-right: 4px; }
            .lt-table .st-logo { width: 17px; height: 17px; }
            .lt-table .st-team { gap: 5px; }
            .lt-flag { display: none; }
            .lt-seed { font-size: 9px; }
        }

        @media (max-width: 600px) {
            .section-header { flex-wrap: wrap; gap: 8px; }
            .conf-tabs {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                flex-wrap: nowrap;
            }
            .conf-tabs::-webkit-scrollbar { display: none; }
            .conf-btn { white-space: nowrap; flex-shrink: 0; }
        }

        @media (max-width: 480px) {
            .games-grid { grid-template-columns: 1fr; }
            .tab-btn { padding: 9px 14px; font-size: 13px; }
            .conf-btn { font-size: 12px; padding: 5px 14px; }
        }

        /* ─── Games layout (左: 試合一覧 / 右: Top Players・Injury) ─── */
        .games-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .games-main { flex: 1 1 0; min-width: 0; }
        .games-side { flex: 0 0 360px; min-width: 0; }

        .games-main .games-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .top-players-col {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .tp-subtitle {
            font-size: 10px;
            color: var(--muted);
            background: var(--surface2);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        /* 経験年数の絞り込み（セグメント）と並び順（セレクト）を1行にまとめる */
        .tp-controls {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 8px; margin: 0 14px 10px;
        }
        .tp-filter {
            display: inline-flex; gap: 2px; margin: 0; padding: 2px;
            background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
        }
        .tp-sort { display: inline-flex; align-items: center; gap: 6px; position: relative; }
        .tp-sort-lbl { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
        .tp-sort select {
            appearance: none; -webkit-appearance: none;
            background: var(--surface2); color: var(--text);
            border: 1px solid var(--border); border-radius: 7px;
            font: inherit; font-size: 11px; font-weight: 700;
            padding: 4px 22px 4px 9px; cursor: pointer;
        }
        .tp-sort select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        .tp-sort::after {
            content: ''; position: absolute; right: 9px; top: 50%; margin-top: -2px;
            border: 4px solid transparent; border-top-color: var(--muted); border-bottom: 0;
            pointer-events: none;
        }
        .off-nights-wrap .tp-item:nth-child(-n+3) .tp-rank { background: var(--surface2); color: var(--muted); }
        .off-pie { font-family: var(--font-score); font-size: 15px; font-weight: 600; color: var(--text); }
        .tp-filter .conf-btn { padding: 3px 10px; font-size: 11px; border: 0; border-radius: 5px; background: transparent; }
        .tp-filter .conf-btn.active { background: var(--accent); color: var(--on-accent); }

        .tp-item {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--line-soft);
            box-shadow: inset 3px 0 0 var(--tc, transparent);
        }

        .tp-item:last-child { border-bottom: none; }

        .tp-rank {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            background: var(--surface2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-score);
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            margin-top: 3px;
        }

        .tp-item:nth-child(-n+3) .tp-rank { background: var(--accent); color: var(--on-accent); }

        .tp-photo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--surface2);
            border: 1px solid var(--border);
        }

        .tp-photo-placeholder {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
        }

        .tp-body { flex: 1; min-width: 0; }

        .tp-name-row {
            display: flex;
            align-items: baseline;
            gap: 5px;
            margin-bottom: 2px;
        }

        .tp-name {
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tp-team { font-size: 10px; color: var(--muted); flex-shrink: 0; }

        .tp-main-stats {
            display: flex;
            align-items: baseline;
            gap: 3px;
            margin-bottom: 5px;
        }

        .tp-pts-val { font-family: var(--font-score); font-size: 19px; font-weight: 600; line-height: 1; color: var(--accent); }
        .tp-reb-val, .tp-ast-val { font-family: var(--font-score); font-size: 14px; font-weight: 500; color: var(--text); }
        .tp-stat-sep { font-size: 10px; color: var(--border); margin: 0 2px; }
        .tp-stat-lbl { font-size: 9px; color: var(--muted); }

        .tp-total-badge {
            margin-left: 5px;
            font-size: 10px;
            font-weight: 700;
            color: var(--accent);
            background: rgba(245,183,0,0.12);
            padding: 1px 6px;
            border-radius: 8px;
        }

        .tp-detail-row { display: flex; flex-wrap: wrap; gap: 3px; }

        .tp-chip {
            font-size: 9.5px;
            color: var(--muted);
            background: var(--surface2);
            padding: 1px 5px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .tp-chip strong { color: var(--text-dim); }

        .injury-players-col {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .ip-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 14px;
            border-bottom: 1px solid var(--line-soft);
        }
        .ip-item:last-child { border-bottom: none; }

        .ip-photo {
            width: 30px; height: 30px;
            border-radius: 50%; object-fit: cover; flex-shrink: 0;
            background: var(--surface2); border: 1px solid var(--border);
        }
        .ip-photo-placeholder {
            width: 30px; height: 30px;
            border-radius: 50%; flex-shrink: 0;
            background: var(--surface2); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: var(--muted);
        }

        .ip-body { flex: 1; min-width: 0; }
        .ip-name-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 1px; }
        .ip-name {
            font-size: 11.5px; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ip-team { font-size: 10px; color: var(--muted); flex-shrink: 0; }
        .ip-reason { font-size: 10px; color: var(--muted); }

        .ip-status {
            flex-shrink: 0; font-size: 10px; font-weight: 800;
            padding: 2px 6px; border-radius: 5px; letter-spacing: 0.5px;
        }
        .ip-out  { background: rgba(255,77,66,0.14);  color: var(--live); }
        .ip-q    { background: rgba(255,193,7,0.15);   color: #ffc107; }
        .ip-d    { background: rgba(255,152,0,0.15);   color: #ff9800; }
        .ip-dtd  { background: rgba(122,133,163,0.15); color: var(--muted); }

        @media (max-width: 1060px) {
            .games-layout { flex-direction: column; align-items: stretch; }
            .games-main, .games-side { flex: none; width: 100%; }
        }

        @media (max-width: 700px) {
            .games-main .games-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .games-main .games-grid { grid-template-columns: 1fr; }
        }

        /* ─── Mobile: Top 10 / Injury をメインタブに分離 ─── */
        .tab-btn.mobile-only { display: none; }
        @media (max-width: 768px) {
            .tab-btn.mobile-only { display: inline-block; }
            .tabs-nav { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
            .tabs-nav::-webkit-scrollbar { display: none; }
            .tab-btn { white-space: nowrap; flex-shrink: 0; }
            #tab-games[data-view="games"] .games-side,
            #tab-games[data-view="top"] .games-main,
            #tab-games[data-view="top"] .injury-players-wrap,
            #tab-games[data-view="top"] .off-nights-wrap,
            #tab-games[data-view="off"] .games-main,
            #tab-games[data-view="off"] .top-players-wrap,
            #tab-games[data-view="off"] .injury-players-wrap,
            #tab-games[data-view="injury"] .games-main,
            #tab-games[data-view="injury"] .top-players-wrap,
            #tab-games[data-view="injury"] .off-nights-wrap { display: none; }
        }

        /* ─── Box score modal ─── */
        .box-modal {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.7);
            align-items: center; justify-content: center; padding: 16px;
        }
        .box-modal.open { display: flex; }
        .box-modal-dialog {
            position: relative; width: 100%; max-width: 760px; max-height: 90vh;
            overflow-y: auto; background: var(--surface);
            border: 1px solid var(--border); border-radius: 10px;
            padding: 20px 20px 24px;
        }
        .box-modal-close {
            position: absolute; top: 10px; right: 12px;
            background: none; border: none; color: var(--muted);
            font-size: 26px; line-height: 1; cursor: pointer; padding: 4px 8px;
        }
        .box-modal-close:hover { color: var(--text); }
        .box-modal .status { margin: 0 36px 16px; }
        .box-scoreline { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 18px; color: inherit; text-decoration: none; }
        .box-scoreline:hover .box-score { color: var(--accent); }
        .box-team { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: .6; }
        .box-team.winner, .box-modal .status-live ~ .box-scoreline .box-team { opacity: 1; }
        .box-team img { width: 52px; height: 52px; object-fit: contain; }
        .box-team-abbr { font-family: var(--font-score); font-size: 14px; font-weight: 600; letter-spacing: 1px; }

<script>
const ESPN_SCOREBOARD = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
const ESPN_STANDINGS  = 'https://site.api.espn.com/apis/v2/sports/basketball/nba/standings';

const rankMap = {};
const standingsData = { East: [], West: [] };
let isPlayoffMode = false;

// ESPN略称 → 標準3文字略称
const ABBR_MAP = { NY: 'NYK', GS: 'GSW', NO: 'NOP', SA: 'SAS', UTAH: 'UTA', WSH: 'WAS' };
function normAbbr(a) { return ABBR_MAP[a] || a; }

// 3-2-1 Lottery（2027〜2029年ドラフト）: 16チームの1〜16位をすべて抽選で決める
// https://www.nba.com/news/nba-board-governors-approve-new-draft-lottery-system
const LOTTERY_GROUPS = [
    { key: 'rel',   balls: 2, label: 'Bottom 3', sub: 'guaranteed a top-12 pick' },
    { key: 'mid',   balls: 3, label: '4th–10th worst' },
    { key: 'pi910', balls: 2, label: 'Play-In 9/10 seeds' },
    { key: 'pi78',  balls: 1, label: 'Play-In 7-vs-8 losers' },
];
const LOTTERY_REL_FLOOR = 12;  // ワースト3はこの順位より後にならない
// 連続制限（元の指名権が2年連続1位・3年連続トップ5にならない）。minPick より前で当たったら minPick に移る。2027年ドラフト用
const LOTTERY_RESTRICTIONS = {
    WAS: { minPick: 2, label: 'No #1',    note: 'WAS can\'t land #1 (No. 1 pick in 2026).' },
    UTA: { minPick: 6, label: 'No Top 5', note: 'UTA can\'t land a top-5 pick (top 5 in 2025 and 2026).' },
};

/* ── ET date helpers (America/New_York, handles DST automatically) ── */
function etDateStr(utcDate) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' })
        .format(utcDate).replace(/-/g, '');
}

function etDateShift(utcDate, days) {
    const s = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(utcDate);
    const [y, m, d] = s.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + days, 17, 0, 0));
}

function fmtJstDate(utcDate) {
    const datePart = new Intl.DateTimeFormat('ja-JP', {
        year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Tokyo'
    }).format(utcDate);
    const weekday = new Intl.DateTimeFormat('en-US', {
        weekday: 'short', timeZone: 'Asia/Tokyo'
    }).format(utcDate);
    return `${datePart} (${weekday})`;
}

/* ── Lottery ── */
// 各チームが各順位になる確率（%）を、抽選の全パターンをたどって厳密に計算する。
// ・1位から順に、残っているチームのボールから1個引く
// ・ワースト3は、12位までの空き枠と未抽選のワースト3が同数になった時点でその中だけから引く
// ・連続制限のあるチームが入れない順位で当たったら、入れる一番早い順位に移し、その順位は引き直す
//   （NBA の運用: https://www.nba.com/news/what-nba-had-in-mind-with-draft-lottery-reform）
function lotteryOdds(teams) {
    const n = teams.length;
    const dist = teams.map(() => new Array(n).fill(0));
    // 状態: 順位が決まったチーム（mask）と、先の順位を確保済みのチーム（held: [チーム, 順位]）
    const keyOf = (mask, held) => mask + '|' + held.map(h => h.join(':')).join(',');
    let states = new Map([[keyOf(0, []), { mask: 0, held: [], p: 1 }]]);

    for (let pick = 1; pick <= n; pick++) {
        const next = new Map();
        const push = (map, mask, held, p) => {
            const k = keyOf(mask, held);
            const st = map.get(k);
            if (st) st.p += p; else map.set(k, { mask, held, p });
        };
        // 引き直しで同じ順位の状態が増えるので、空になるまで処理する
        while (states.size) {
            const [k, { mask, held, p }] = states.entries().next().value;
            states.delete(k);

            const h = held.find(x => x[1] === pick);
            if (h) {
                dist[h[0]][pick - 1] += p * 100;
                push(next, mask, held.filter(x => x !== h), p);
                continue;
            }
            let pool = [];
            for (let i = 0; i < n; i++) if (!(mask & (1 << i))) pool.push(i);
            if (!pool.length) continue;

            const rel = pool.filter(i => teams[i].group === 'rel');
            let freeSlots = 0;
            for (let s = pick; s <= LOTTERY_REL_FLOOR; s++) if (!held.some(x => x[1] === s)) freeSlots++;
            if (rel.length && rel.length === freeSlots) pool = rel;

            const total = pool.reduce((a, i) => a + teams[i].balls, 0);
            for (const i of pool) {
                const q = p * teams[i].balls / total;
                if (pick >= teams[i].minPick) {
                    dist[i][pick - 1] += q * 100;
                    push(next, mask | (1 << i), held, q);
                } else {
                    let slot = teams[i].minPick;
                    while (held.some(x => x[1] === slot)) slot++;
                    push(states, mask | (1 << i), [...held, [i, slot]], q);
                }
            }
        }
        states = next;
    }
    return dist;
}

// 今の順位から抽選に参加する16チームと区分を決める
function lotteryTeams() {
    const winPct = t => t.wins / (t.wins + t.losses || 1);
    const worstFirst = (a, b) => (winPct(a) - winPct(b)) || (b.losses - a.losses);
    const all = [...standingsData.West, ...standingsData.East];
    const seedLabel = t => `${standingsData.East.includes(t) ? 'E' : 'W'}${t.rank}`;

    const nonPlayIn = all.filter(t => t.rank > 10).sort(worstFirst);
    const teams = [
        ...nonPlayIn.map((t, i) => ({ t, group: i < 3 ? 'rel' : 'mid' })),
        ...all.filter(t => t.rank === 9 || t.rank === 10).sort(worstFirst).map(t => ({ t, group: 'pi910', seed: seedLabel(t) })),
        // 7位・8位決定戦の敗者は確定前なので、下のシード（8位）が負けると仮定する
        ...all.filter(t => t.rank === 8).sort(worstFirst).map(t => ({ t, group: 'pi78', seed: seedLabel(t) + '†' })),
    ];
    return teams.map(x => {
        const g = LOTTERY_GROUPS.find(g => g.key === x.group);
        const r = LOTTERY_RESTRICTIONS[x.t.abbr];
        return { ...x, balls: g.balls, minPick: r?.minPick || 1, restriction: r };
    });
}

function renderLottery() {
    const el = document.getElementById('lottery-list');
    if (!el) return;

    const teams = lotteryTeams();
    if (!teams.length) { el.innerHTML = '<div class="msg">No data</div>'; return; }
    const dist = lotteryOdds(teams);
    const pct = v => v < 0.05 ? '<span class="lt-zero">—</span>' : `<span class="lt-pct">${v.toFixed(1)}%</span>`;

    const rows = LOTTERY_GROUPS.map(g => {
        const members = teams.map((x, i) => ({ x, d: dist[i] })).filter(m => m.x.group === g.key);
        if (!members.length) return '';
        const head = `<tr class="lt-grp"><td colspan="6">${g.label}${g.sub ? `<span class="lt-grp-sub">(${g.sub})</span>` : ''}</td></tr>`;
        return head + members.map(({ x, d }) => {
            const possible = d.map(p => p > 1e-6);
            const best = possible.indexOf(true) + 1, worst = possible.lastIndexOf(true) + 1;
            return `<tr>
                <td class="lt-l"><div class="st-team">
                    <img class="st-logo" src="${x.t.logo}" alt="${x.t.abbr}" onerror="this.style.display='none'">
                    <span class="st-abbr">${x.t.abbr}</span>
                    ${x.seed ? `<span class="lt-seed">${x.seed}</span>` : ''}
                    ${x.restriction ? `<span class="lt-flag">${x.restriction.label}</span>` : ''}
                </div></td>
                <td>${x.t.wins}-${x.t.losses}</td>
                <td class="lt-l"><span class="lt-dots">${'<span class="lt-dot"></span>'.repeat(g.balls)}${'<span class="lt-dot off"></span>'.repeat(3 - g.balls)}</span></td>
                <td>${pct(d[0])}</td>
                <td>${pct(d.slice(0, 4).reduce((a, b) => a + b, 0))}</td>
                <td>${best}–${worst}</td>
            </tr>`;
        }).join('');
    }).join('');

    const restrictionNotes = teams.filter(x => x.restriction).map(x => x.restriction.note);

    el.innerHTML = `
        <table class="lt-table">
            <thead><tr>
                <th class="lt-l">Team</th><th>Record</th><th class="lt-l">Balls</th><th>#1</th><th>Top 4</th><th>Range</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
    document.getElementById('lottery-note').innerHTML = `
        <ul class="lt-rules">
            <li>Picks <b>1–16</b> go to <b>16 teams</b> — the 10 that miss the Play-In plus 6 Play-In teams — and are all decided by a drawing.</li>
            <li>Each team gets <b>1–3 lottery balls</b> based on its finish. More balls mean better odds of an early pick.</li>
            <li>The bottom 3 teams lose one ball, but can't fall below <b>#12</b>.</li>
        </ul>
        <div class="lottery-note">
            #1 and Top 4 are the chances of landing that pick. Range is every pick the team can end up with.<br>
            † Projected: assumes the lower seed loses the 7-vs-8 Play-In game.<br>
            ${restrictionNotes.map(n => n + '<br>').join('')}
            Projections based on current standings. Rules:
            <a href="https://www.nba.com/news/nba-board-governors-approve-new-draft-lottery-system" target="_blank" rel="noopener"
               style="color:var(--muted);text-decoration:underline">NBA.com</a>
        </div>`;
}

/* ── Streak helpers ── */
function streakBadge(streak) {
    if (!streak) return '';
    const m = streak.match(/^([WL])\s*(\d+)/);
    if (!m) return '';
    return `<span class="streak ${m[1] === 'W' ? 'w' : 'l'}">${m[1]}${m[2]}</span>`;
}

// ESPNのチームカラー（"1d428a" 形式）→ カード用CSS変数
function teamColorVars(color, alt) {
    const hex = c => /^[0-9a-f]{6}$/i.test(c || '') ? `#${c}` : null;
    const c1 = hex(color) || '#2a2a31';
    const c2 = hex(alt) || c1;
    const n = parseInt(c1.slice(1), 16);
    const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    return `--tc:${c1};--tc2:${c2};--tc-text:${lum > 0.6 ? '#111' : '#fff'}`;
}

/* ── Game render ── */
function renderGames(events, id) {
    const el = document.getElementById(id);
    if (!events?.length) { el.innerHTML = '<div class="msg">No games</div>'; return; }
    const statusPriority = e => {
        if (e.status.type.state === 'in') return 0;
        if (e.status.type.completed || e.status.type.state === 'post') return 2;
        return 1;
    };
    const sorted = [...events].sort((a, b) => statusPriority(a) - statusPriority(b));
    el.innerHTML = '';
    sorted.forEach(ev => el.appendChild(buildCard(ev)));
}

function buildCard(event) {
    const comp = event.competitions[0];
    const away = comp.competitors.find(c => c.homeAway === 'away') ?? comp.competitors[0];
    const home = comp.competitors.find(c => c.homeAway === 'home') ?? comp.competitors[1];

    const st = event.status;
    const isOver = !!st.type.completed || st.type.state === 'post';
    const isLive = !isOver && st.type.state === 'in';

    const awayScore = away.score != null ? String(away.score) : '';
    const homeScore = home.score != null ? String(home.score) : '';
    const awayNum = parseInt(awayScore);
    const homeNum = parseInt(homeScore);
    const awayWon = isOver && !isNaN(awayNum) && !isNaN(homeNum) && awayNum > homeNum;
    const homeWon = isOver && !isNaN(awayNum) && !isNaN(homeNum) && homeNum > awayNum;

    // Playoff series data
    const series = comp.series;
    const awaySeriesWins = series?.competitors?.find(c => c.id === away.team.id)?.wins ?? 0;
    const homeSeriesWins = series?.competitors?.find(c => c.id === home.team.id)?.wins ?? 0;
    const seriesNote = series
        ? (comp.notes?.find(n => n.headline && /series|game\s+\d+/i.test(n.headline))?.headline || '')
        : '';

    // Game number label (e.g. "Game 5") for playoff status bar
    let gameNumber = '';
    if (isPlayoffMode && series) {
        const allText = [st.type.shortDetail, ...(comp.notes || []).map(n => n.headline || '')].join(' ');
        const m = allText.match(/Game\s+\d+/i);
        if (m) gameNumber = m[0];
    }

    let statusLabel, statusClass;
    if (isOver) {
        statusLabel = (isPlayoffMode && gameNumber) ? `FINAL  •  ${gameNumber}` : 'FINAL';
        statusClass = 'final';
    } else if (isLive) {
        const tag = (isPlayoffMode && gameNumber) ? `  •  ${gameNumber}` : '';
        statusLabel = `LIVE  Q${st.period}  ${st.displayClock}${tag}`;
        statusClass = 'live';
    } else {
        const timeStr = new Date(event.date).toLocaleTimeString('en-US', {
            hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo'
        });
        const tag = (isPlayoffMode && gameNumber) ? `  •  ${gameNumber}` : '';
        statusLabel = `${timeStr} JST${tag}`;
        statusClass = 'sched';
    }

    function info(t, myWins, oppWins) {
        const rk  = rankMap[t.team.id];
        const rec = t.records?.find(r => r.type === 'total') ?? t.records?.[0];
        const base = {
            abbr:  normAbbr(t.team.abbreviation) || t.team.displayName,
            short: t.team.shortDisplayName || t.team.name || t.team.displayName,
            color: t.team.color,
            alt:   t.team.alternateColor
        };
        if (isPlayoffMode && series) {
            return { ...base, record: `${myWins}-${oppWins}`, rank: rk ? `#${rk.rank} Seed` : '', l10: '', streak: '' };
        }
        return {
            ...base,
            record: rec?.summary || '',
            rank:   rk ? `${rk.conf} #${rk.rank}` : '',
            l10:    rk?.l10 || '',
            streak: rk?.streak || ''
        };
    }

    const aw = info(away, awaySeriesWins, homeSeriesWins);
    const hw = info(home, homeSeriesWins, awaySeriesWins);
    const showScore = isOver || isLive;

    function teamRow(d, score, lose) {
        const meta = [d.record, d.rank, d.l10 ? `L10 ${d.l10}` : '', streakBadge(d.streak)]
            .filter(Boolean).join('<span class="g-dot">·</span>');
        return `
        <div class="g-team ${lose ? 'lose' : ''}" style="${teamColorVars(d.color, d.alt)}">
            <span class="g-chip">${d.abbr}</span>
            <div class="g-info">
                <div class="g-name">${d.short}</div>
                ${meta ? `<div class="g-meta">${meta}</div>` : ''}
            </div>
            ${showScore ? `<span class="g-score">${score || '-'}</span>` : ''}
        </div>`;
    }

    const card = document.createElement('div');
    card.className = 'card' + (isLive ? ' live' : '');
    if (showScore) {
        card.classList.add('clickable');
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.addEventListener('click', () => openBoxScoreModal(event));
        card.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBoxScoreModal(event); }
        });
    }
    card.innerHTML = `
        ${teamRow(aw, awayScore, homeWon)}
        ${teamRow(hw, homeScore, awayWon)}
        ${(isPlayoffMode && seriesNote) ? `<div class="g-series">${seriesNote}</div>` : ''}
        <div class="g-foot">
            <span class="g-status ${statusClass}">${statusLabel}</span>
            ${showScore ? '<span class="g-box">Box Score ›</span>' : ''}
        </div>`;
    return card;
}

const BOX_COLS = [

    ['PTS', 'PTS', 'pts', 'points'],
    ['REB', 'REB', 'reb', 'rebounds'],
    ['OREB', 'OREB', 'oreb', 'offensiveRebounds'],
    ['DREB', 'DREB', 'dreb', 'defensiveRebounds'],
    ['AST', 'AST', 'ast', 'assists'],
    ['FG',  'FG',  'fg',  'fieldGoalsMade-fieldGoalsAttempted'],
