<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 個人用サイトのため検索エンジンに載せない -->
    <meta name="robots" content="noindex, nofollow">
    <title>Players — NBA Daily</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="../assets/common.css?v=2026102901">
    <link rel="stylesheet" href="../assets/player-team.css?v=2026102901">
    <style>
        /* タブの位置を Games などほかのページとそろえる */
        .main-wrap.players-page { display: block; max-width: 1360px; padding-top: 0; }
        .tab-panel { padding-top: 4px; }
        .sl-head-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 14px; }
        .sl-head-row .sl-exp { margin-top: 0; }
        .sl-note { font-size: 11px; color: var(--muted); }
    </style>
</head>
<body class="theme-broadcast">

<header>
    <a class="site-logo" href="../games/">NBA <em>Daily</em></a>
    <nav class="site-nav" aria-label="Pages">
        <a href="../games/">Games</a>
        <a href="../standings/">Standings</a>
        <a class="on" href="../players/" aria-current="page">Players</a>
        <a href="../teams/">Teams</a>
        <a href="../salary/">Salary</a>
        <a href="../predict/">Predict</a>
    </nav>
    <div class="header-right">
        <div class="last-updated" id="last-updated"></div>
    </div>
</header>

<main>
    <div class="main-wrap players-page">

        <!-- タブ: Players（検索・Rookies）/ Leaders（シーズンのランキング） -->
        <div class="tabs-nav">
            <button class="tab-btn active" data-tab="players">Players</button>
            <button class="tab-btn" data-tab="leaders">Leaders</button>
        </div>

        <div class="tab-panel active" id="tab-players">
            <div class="lc-search" id="player-search-wrap">
                <div class="search-wrap">
                    <input type="text" id="q" placeholder="Search player (e.g. LeBron James)">
                    <ul id="suggestions" class="suggestions"></ul>
                </div>
            </div>

            <div id="rookie-list" class="lc-block">
                <div class="section-header">
                    <h2>Rookies</h2>
                    <span id="rookie-count" class="badge"></span>
                </div>
                <div id="rookie-list-body" class="rl-grid"><div class="msg">Loading<span class="spinner"></span></div></div>
            </div>
        </div>

        <div class="tab-panel" id="tab-leaders">
            <div class="section-header">
                <h2>Stats Leaders</h2>
                <span id="sl-season-badge" class="badge"></span>
            </div>
            <div class="sl-head-row">
                <div class="sl-exp" id="sl-exp">
                    <button class="sl-exp-btn active" data-exp="all">All</button>
                    <button class="sl-exp-btn" data-exp="rookie">Rookie</button>
                    <button class="sl-exp-btn" data-exp="sophomore">Sophomore</button>
                    <button class="sl-exp-btn" data-exp="veteran">Veteran</button>
                </div>
                <div class="sl-note" id="sl-note">1試合平均・規定出場数を満たした選手</div>
            </div>
            <div class="rk-grid" id="sl-grid"></div>
        </div>

    </div><!-- /main-wrap -->
</main>

<script src="../assets/api.js?v=2026102901"></script>
<script src="../assets/teams.js?v=2026102901"></script>
<script src="../assets/stats.js?v=2026102901"></script>
<script src="../assets/ui.js?v=2026102901"></script>
<script src="../assets/player-index.js?v=2026102901"></script>
<script>
let playerIndex = [];   // 背番号・経験年数を引くため
let teamIndex   = [];
const indexReady = NBA.playerIndex().then(ix => { playerIndex = ix.players; teamIndex = ix.teams; });

/* ─── タブ（?tab=leaders で Leaders を開く。Leaders は開いたときに読み込む） ─── */
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${tab}`));
    NBA.url.set({ tab: tab === 'leaders' ? 'leaders' : null });
    if (tab === 'leaders') loadLeaders();
}
document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

/* ─── Search ─── */
NBA.playerSearch(document.getElementById('q'), document.getElementById('suggestions'), {
    onClear: () => { rookieListEl.hidden = false; },
});

/* ─── Rookie List（今季の新人をチームごとに表示） ─── */
const rookieListEl = document.getElementById('rookie-list');
const rookieBodyEl = document.getElementById('rookie-list-body');

function renderRookieList() {
    // 新人は expYears が 0 または 1 で返るため両方 Rookie 扱い（slExpClass と同じ基準）
    const rookies = playerIndex.filter(p => p.expYears != null && p.expYears <= 1);
    if (!rookies.length) {
        rookieBodyEl.innerHTML = '<div class="msg">No rookie data available</div>';
        return;
    }
    document.getElementById('rookie-count').textContent = `${rookies.length} players`;
    rookieBodyEl.innerHTML = teamIndex.map(t => {
        const players = rookies.filter(p => p.teamId === t.id);
        if (!players.length) return '';
        return `<div class="rl-team">
            <div class="rl-team-head">
                <img class="tl-logo" src="${esc(t.logo || FALLBACK_IMG)}" alt="" onerror="this.src='${FALLBACK_IMG}'">
                <div class="sd-title">${esc(t.displayName)}</div>
            </div>
            <div class="tl-teams">${players.map(p => `
                <a class="tl-team" href="${NBA.link.player(p.id)}">
                    <img class="rl-photo" src="${esc(p.headshot || FALLBACK_IMG)}" alt="" onerror="this.src='${FALLBACK_IMG}'">
                    <div class="t-roster-name-row">
                        <span class="rl-name">${esc(p.displayName)}</span>
                        ${p.jersey ? `<span class="t-roster-pos">#${esc(p.jersey)}</span>` : ''}
                        ${p.position ? `<span class="t-roster-pos">${esc(p.position)}</span>` : ''}
                    </div>
                </a>`).join('')}
            </div>
        </div>`;
    }).join('');
}

indexReady.then(renderRookieList);

/* ─── Stats Leaders（全カテゴリーをカードで並べる） ─── */
const SL_YEAR = NBA.SEASON;
const SL_TYPE = 2;  // Regular Season

// カテゴリー。calc があるもの（Game Score・Fantasy）は PTS の上位100人からシーズン平均で計算して並べ直す
const SL_TABS = [
    { key: 'GS',  title: 'Game Score', note: 'シーズン平均・REB の内訳は近似', sort: 'offensive.avgPoints:desc', calc: a => gsOf(a) },
    { key: 'PTS', title: 'Points',   sort: 'offensive.avgPoints:desc',   catName: 'offensive', statName: 'avgPoints' },
    { key: 'REB', title: 'Rebounds', sort: 'general.avgRebounds:desc',   catName: 'general',   statName: 'avgRebounds' },
    { key: 'AST', title: 'Assists',  sort: 'offensive.avgAssists:desc',  catName: 'offensive', statName: 'avgAssists' },
    { key: 'STL', title: 'Steals',   sort: 'defensive.avgSteals:desc',   catName: 'defensive', statName: 'avgSteals' },
    { key: 'BLK', title: 'Blocks',   sort: 'defensive.avgBlocks:desc',   catName: 'defensive', statName: 'avgBlocks' },
    { key: '3P%', title: '3P%',      sort: 'offensive.threePointFieldGoalPct:desc', catName: 'offensive', statName: 'threePointFieldGoalPct', isPct: true,
      madeStatName: 'avgThreePointFieldGoalsMade', attStatName: 'avgThreePointFieldGoalsAttempted', madeLbl: '3P' },
    { key: 'FT%', title: 'FT%',      sort: 'offensive.freeThrowPct:desc', catName: 'offensive', statName: 'freeThrowPct', isPct: true,
      madeStatName: 'avgFreeThrowsMade', attStatName: 'avgFreeThrowsAttempted', madeLbl: 'FT' },
    { key: 'FTA', title: 'FTA',      sort: 'offensive.avgFreeThrowsAttempted:desc', catName: 'offensive', statName: 'avgFreeThrowsAttempted' },
    { key: 'TO',  title: 'Turnovers', sort: 'offensive.avgTurnovers:desc', catName: 'offensive', statName: 'avgTurnovers', note: '多い順' },
    { key: 'DD2', title: 'Double-Doubles', sort: 'general.doubleDouble:desc', catName: 'general', statName: 'doubleDouble', isInt: true, note: '合計' },
    { key: 'TD3', title: 'Triple-Doubles', sort: 'general.tripleDouble:desc', catName: 'general', statName: 'tripleDouble', isInt: true, note: '合計' },
    { key: 'FP',  title: 'Fantasy', note: 'シーズン平均・nba-fantasy と同じ配点', sort: 'offensive.avgPoints:desc', calc: a => fpOf(a) },
];

const slCache    = {};      // `${key}|${exp}` → athletes[]
const slRawCache = {};      // key → 絞り込み用の上位200人（Rookie〜Veteran で共有）
let slExp        = 'all';   // 経験年数の絞り込み
const SL_EXP_LIMIT  = 200;
const SL_EXP_MIN_GP = 20;   // 絞り込み時は20試合以上出場した選手のみ
let slCatMap = null;        // category name → { statName → index }
let slYear   = SL_YEAR;     // 今季のランキングがまだない（プレシーズンなど）ときは前のシーズン

function buildSlCatMap(categories) {
    const map = {};
    for (const cat of categories) {
        map[cat.name] = {};
        (cat.names || []).forEach((name, i) => { map[cat.name][name] = i; });
    }
    return map;
}

function getSlVal(athlete, catName, statName) {
    const idx = slCatMap?.[catName]?.[statName];
    if (idx == null) return null;
    return (athlete.categories || []).find(c => c.name === catName)?.values?.[idx] ?? null;
}

// Game Score のシーズン平均（式は assets/stats.js の gameScore と同じ）。
// Leaders の API はリバウンドの内訳（OREB/DREB）を返さないので、0.7×OREB＋0.3×DREB を
// リーグ平均の内訳（OREB が約23%）から REB×0.4 で近似する
function gsOf(a) {
    const v = (c, n) => getSlVal(a, c, n) ?? 0;
    return v('offensive', 'avgPoints') + 0.4 * v('offensive', 'avgFieldGoalsMade') - 0.7 * v('offensive', 'avgFieldGoalsAttempted')
        - 0.4 * (v('offensive', 'avgFreeThrowsAttempted') - v('offensive', 'avgFreeThrowsMade'))
        + 0.4 * v('general', 'avgRebounds') + v('defensive', 'avgSteals') + 0.7 * v('offensive', 'avgAssists')
        + 0.7 * v('defensive', 'avgBlocks') - 0.4 * v('general', 'avgFouls') - v('offensive', 'avgTurnovers');
}

// ファンタジーポイントのシーズン平均（配点は assets/stats.js の FANTASY_SCORING）
function fpOf(a) {
    const v = (c, n) => getSlVal(a, c, n) ?? 0;
    return fantasyPoints({ pts: v('offensive', 'avgPoints'), oreb: v('general', 'avgRebounds'), dreb: 0,
        ast: v('offensive', 'avgAssists'), stl: v('defensive', 'avgSteals'), blk: v('defensive', 'avgBlocks'), to: v('offensive', 'avgTurnovers') });
}

async function fetchSlLeaders(tab, limit = tab.calc ? 100 : 10) {
    const load = year => NBA.api.leaders(`season=${year}&seasontype=${SL_TYPE}&limit=${limit}&qualified=true&sort=${encodeURIComponent(tab.sort)}`);
    let data = await load(slYear);
    if (!data.athletes?.length && slYear === SL_YEAR) {
        slYear = SL_YEAR - 1;
        data = await load(slYear);
    }
    if (!slCatMap && data.categories) slCatMap = buildSlCatMap(data.categories);
    const rs = data.requestedSeason;
    if (rs?.displayName) document.getElementById('sl-season-badge').textContent = `${rs.displayName} ${rs.type?.name || 'Regular Season'}`;
    let athletes = data.athletes || [];
    if (tab.calc) athletes = athletes.map(a => ({ ...a, _v: tab.calc(a) })).sort((a, b) => b._v - a._v);
    // 回数を数えるカテゴリー（DD2 / TD3）は0回の選手を出さない
    if (tab.isInt) athletes = athletes.filter(a => (getSlVal(a, tab.catName, tab.statName) ?? 0) > 0);
    return limit === SL_EXP_LIMIT ? athletes : athletes.slice(0, 10);
}

// ロスターの経験年数（今季時点）を、表示中のシーズン時点に戻して判定する
function slExpClass(athleteId) {
    const p = playerIndex.find(x => x.id === String(athleteId));
    if (p?.expYears == null) return null;
    const years = p.expYears - (SL_YEAR - slYear);
    return years <= 1 ? 'rookie' : years === 2 ? 'sophomore' : 'veteran';
}

async function fetchSlLeadersByExp(tab, exp) {
    if (!slRawCache[tab.key]) slRawCache[tab.key] = fetchSlLeaders(tab, SL_EXP_LIMIT);
    const raw = await slRawCache[tab.key];
    await indexReady;
    return raw
        .filter(a => (getSlVal(a, 'general', 'gamesPlayed') ?? 0) >= SL_EXP_MIN_GP)
        .filter(a => slExpClass(a.athlete?.id) === exp)
        .slice(0, 10);
}

/* ── カード ── */
const f1 = v => v == null || isNaN(v) ? '-' : v.toFixed(1);
function slMainVal(a, tab) {
    const v = tab.calc ? a._v : getSlVal(a, tab.catName, tab.statName);
    if (v == null || isNaN(v)) return '-';
    if (tab.isInt) return String(Math.round(v));
    if (tab.isPct) return v.toFixed(1) + '%';
    return v.toFixed(1);
}

function slCardHTML(tab, athletes) {
    const S = (a, c, n) => getSlVal(a, c, n);
    const madeAtt = a => tab.madeStatName ? `${f1(S(a, tab.catName, tab.madeStatName))}/${f1(S(a, tab.catName, tab.attStatName))} ${tab.madeLbl}` : '';
    const rows = athletes.map((a, i) => {
        const ath = a.athlete || {};
        const name = ath.displayName || '—';
        const nameHTML = ath.id ? `<a class="rk-name" href="${NBA.link.player(ath.id)}">${esc(name)}</a>` : `<span class="rk-name">${esc(name)}</span>`;
        const team = normAbbr(ath.teamShortName || '');
        const pts = f1(S(a, 'offensive', 'avgPoints')), reb = f1(S(a, 'general', 'avgRebounds')), ast = f1(S(a, 'offensive', 'avgAssists'));
        const gp = S(a, 'general', 'gamesPlayed');
        if (i < 3) {
            // リーダーAPIは背番号を返さないため、ロスター由来の playerIndex から引く
            const jersey = playerIndex.find(x => x.id === String(ath.id))?.jersey || '';
            const photo = ath.headshot?.href
                ? `<img class="tp-photo" src="${esc(ath.headshot.href)}" alt="" onerror="this.style.display='none'">`
                : `<div class="tp-photo-placeholder">${esc(name.charAt(0))}</div>`;
            const pct = n => { const v = S(a, 'offensive', n); return v == null ? '-' : v.toFixed(1) + '%'; };
            return `<div class="rk-top">
                <span class="rk-rank">${i + 1}</span>${photo}
                <div class="rk-body">${nameHTML}<div class="rk-sub">${esc(team)}${jersey ? ` #${esc(jersey)}` : ''}${gp != null ? ` · ${Math.round(gp)} GP` : ''}</div>
                    <div class="rk-line"><b>${pts}</b> pts · <b>${reb}</b> reb · <b>${ast}</b> ast${tab.madeStatName ? ` · ${madeAtt(a)}` : ''}</div></div>
                <span class="rk-val">${slMainVal(a, tab)}</span>
                <div class="rk-chips">
                    <span class="tp-chip"><strong>${pct('fieldGoalPct')}</strong> FG</span>
                    <span class="tp-chip"><strong>${pct('threePointFieldGoalPct')}</strong> 3P</span>
                    <span class="tp-chip"><strong>${pct('freeThrowPct')}</strong> FT</span>
                    <span class="tp-chip">MIN <strong>${f1(S(a, 'general', 'avgMinutes'))}</strong></span>
                    <span class="tp-chip">STL <strong>${f1(S(a, 'defensive', 'avgSteals'))}</strong></span>
                    <span class="tp-chip">BLK <strong>${f1(S(a, 'defensive', 'avgBlocks'))}</strong></span>
                    <span class="tp-chip">TO <strong>${f1(S(a, 'offensive', 'avgTurnovers'))}</strong></span>
                    <span class="tp-chip">PF <strong>${f1(S(a, 'general', 'avgFouls'))}</strong></span>
                </div>
            </div>`;
        }
        const line = `${pts} pts · ${reb} reb · ${ast} ast · ${tab.madeStatName ? madeAtt(a) : `${f1(S(a, 'general', 'avgMinutes'))} min`}`;
        return `<div class="rk-row"><span class="rk-rank">${i + 1}</span><div class="rk-body">${nameHTML}<div class="rk-line">${line}</div></div><span class="rk-team">${esc(team)}</span><span class="rk-val">${slMainVal(a, tab)}</span></div>`;
    }).join('');
    if (rows) return rows;
    return slExp === 'all' ? '<div class="msg">No data</div>'
        : `<div class="msg">${SL_EXP_MIN_GP}試合以上出場した選手がまだいません</div>`;
}

let slSeq = 0;
function loadLeaders() {
    const seq = ++slSeq, exp = slExp;
    document.getElementById('sl-note').textContent = exp === 'all'
        ? '1試合平均・規定出場数を満たした選手' : `1試合平均・${SL_EXP_MIN_GP}試合以上出場した選手のみ`;
    const grid = document.getElementById('sl-grid');
    grid.innerHTML = SL_TABS.map(t => `<section class="rk-card" id="sl-card-${t.key.replace('%', 'p')}">
        <div class="rk-head"><span class="rk-title">${t.title}</span>${t.note ? `<span class="rk-note">${t.note}</span>` : ''}</div>
        <div class="rk-list"><div class="msg">Loading<span class="spinner"></span></div></div>
    </section>`).join('');
    // カテゴリーごとに届いた順に埋める（取得は api.js が1時間キャッシュする）
    SL_TABS.forEach(async tab => {
        const key = `${tab.key}|${exp}`;
        const el = grid.querySelector(`#sl-card-${tab.key.replace('%', 'p')} .rk-list`);
        try {
            if (!slCache[key]) slCache[key] = exp === 'all' ? fetchSlLeaders(tab) : fetchSlLeadersByExp(tab, exp);
            const athletes = await slCache[key];
            await indexReady;  // 背番号を playerIndex から引くため
            if (seq === slSeq) el.innerHTML = slCardHTML(tab, athletes);
        } catch (e) {
            delete slCache[key];
            if (seq === slSeq) el.innerHTML = '<div class="msg error">Failed to load</div>';
            console.error('leaders:', e);
        }
    });
}

document.querySelectorAll('#sl-exp .sl-exp-btn').forEach(btn => btn.addEventListener('click', () => {
    slExp = btn.dataset.exp;
    document.querySelectorAll('#sl-exp .sl-exp-btn').forEach(b => b.classList.toggle('active', b === btn));
    loadLeaders();
}));

if (NBA.url.get('tab') === 'leaders') switchTab('leaders');

document.getElementById('last-updated').textContent =
    new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
</script>
</body>
</html>
